<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; object-src 'none'">
<title>Scrooge's Safe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scrooge's Safe">
<meta name="application-name" content="Scrooge's Safe">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260726-2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=20260726-2">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260726-2">
<link rel="shortcut icon" type="image/png" href="assets/favicon-32.png?v=20260726-2">
<link rel="manifest" href="assets/manifest.webmanifest?v=20260726-2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --card:#FFFFFF; --card2:#F7F7F5; --line:#E9E9E7;
  --tx:#191919; --dim:#787774;
  --gold:#191919; --goldS:#F7F7F5;
  --green:#0F7B3E; --greenS:#EDF7F1;
  --red:#D44C47; --redS:#FCEDEC;
  --amber:#D9730D; --amberS:#FBF3DB;
  --blue:#2383E2; --blueS:#EAF3FB;
  --inverse:#FFFFFF; --field:#FFFFFF; --field-line:#D7D7D5;
  --header:rgba(255,255,255,.94); --nav-bg:rgba(255,255,255,.96);
  --muted-icon:#9B9A97; --shadow:rgba(0,0,0,.18);
  --nav:65px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191919; --card:#202020; --card2:#2A2A2A; --line:#373737;
    --tx:#F1F1EF; --dim:#A9A9A6;
    --gold:#F1F1EF; --goldS:#2A2A2A;
    --green:#55B77E; --greenS:#183727;
    --red:#FF7369; --redS:#44221F;
    --amber:#ECA559; --amberS:#44311F;
    --blue:#65A9E8; --blueS:#1F3345;
    --inverse:#191919; --field:#202020; --field-line:#4A4A48;
    --header:rgba(25,25,25,.94); --nav-bg:rgba(25,25,25,.96);
    --muted-icon:#8B8B88; --shadow:rgba(0,0,0,.42);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:0;
  scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet>.body::-webkit-scrollbar{display:none}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
.ph,.ph-fill{font-size:1.25em;line-height:1;display:inline-flex}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:var(--header);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:55px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:7px;flex:0 0 auto}
header h1{margin:0;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hbtn{width:34px;height:34px;display:grid;place-items:center;color:var(--tx);
  border-radius:6px;font-size:18px}
header .hbtn:active{background:var(--card2)}
.header-actions{display:flex;align-items:center;gap:2px}
#syncButton{position:relative}
#syncButton[data-status="syncing"] i{animation:sync-spin 1s linear infinite}
#syncButton[data-status="ok"]{color:var(--green)}
#syncButton[data-status="warning"]{color:var(--amber)}
#syncButton[data-status="error"]{color:var(--red)}
#refreshButton[data-status="checking"] i{animation:sync-spin 1s linear infinite}
#refreshButton[data-status="ready"]{color:var(--green)}
@keyframes sync-spin{to{transform:rotate(360deg)}}
.sync-state{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:var(--card2);font-size:21px}
.sync-state.ok{background:var(--greenS);color:var(--green)}
.sync-state.warning{background:var(--amberS);color:var(--amber)}
.sync-state.error{background:var(--redS);color:var(--red)}

/* ---------- 布局 ---------- */
main{padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:15px;display:flex;flex-direction:column;gap:10px}
.card.gold{background:var(--goldS)} .card.green{background:var(--greenS)}
.card.red{background:var(--redS)} .card.amber{background:var(--amberS)} .card.blue{background:var(--blueS)}
.h2{font-size:17px;font-weight:700;margin:0}
.h3{font-size:14px;font-weight:600;margin:0}
.dim{color:var(--dim);font-size:12px}
.big{font-size:30px;font-weight:700}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr{height:1px;background:var(--line);margin:2px 0}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{flex:1 1 96px;min-width:92px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:21px;font-weight:700}
.stat .v small{font-size:11px;color:var(--dim);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;text-align:left;width:100%}
.row .l{flex:1;min-width:0}
.row .l b{font-weight:400;font-size:14px;display:block;overflow-wrap:anywhere}
.row .v{font-weight:600;font-size:14px;white-space:nowrap}
.row.tap:active{opacity:.55}
.badge{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:650;white-space:nowrap}
.insurance-subject{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b-gold{background:var(--goldS);color:var(--gold)} .b-dim{background:var(--card2);color:var(--dim)}
.b-green{background:var(--greenS);color:var(--green)} .b-red{background:var(--redS);color:var(--red)}
.b-amber{background:var(--amberS);color:var(--amber)} .b-blue{background:var(--blueS);color:var(--blue)}
.c-gold{color:var(--gold)} .c-green{color:var(--green)} .c-red{color:var(--red)}
.c-dim{color:var(--dim)} .c-blue{color:var(--blue)}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- 按钮 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:6px;font-weight:650;font-size:14px;
  background:var(--tx);color:var(--inverse);min-height:44px}
.btn:active{opacity:.72}
.btn.ghost{background:var(--field);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:var(--redS);color:var(--red)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:5px;min-height:34px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;
  -ms-overflow-style:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:6px;background:var(--card2);
  color:var(--tx);font-size:13px;font-weight:600;border:1px solid transparent}
.chip.on{background:var(--tx);color:var(--inverse)}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label{color:var(--dim);font-size:12px}
.field input,.field select,.field textarea{
  background:var(--field);border-radius:5px;padding:12px;color:var(--tx);
  border:1px solid var(--field-line);font-size:16px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--tx)}
.field .hint{color:var(--dim);font-size:11px}
.field input[type=date]{min-height:46px}
.switch{display:flex;align-items:center;justify-content:space-between;
  background:var(--card2);border-radius:5px;padding:12px}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.sheet.open{transform:translateY(0)}
.sheet>.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.sheet>.top .h2{font-size:18px}
.sheet>.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.x{color:var(--tx);font-size:25px;line-height:1;width:36px;height:36px;border-radius:6px}
.x:active{background:var(--card2)}

/* ---------- 底部导航 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 7px;color:var(--muted-icon);font-size:10px;font-weight:600;min-width:0}
nav button.on{color:var(--tx)}
nav button .ph,nav button .ph-fill{font-size:23px;width:24px;height:24px;justify-content:center}

/* ---------- 图表 ---------- */
.chart-shell{display:flex;flex-direction:column;gap:4px;min-width:0}
.chart-readout{height:28px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;border-bottom:1px solid var(--line)}
.chart-readout span{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-readout strong{font-size:14px;font-weight:700;white-space:nowrap}
.chart-frame{display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px;align-items:start}
.chart-y-axis{height:138px;position:relative;color:var(--dim);font-size:9px;
  font-variant-numeric:tabular-nums}
.chart-y-unit{position:absolute;top:0;right:0;font-weight:650;color:var(--tx)}
.chart-y-label{position:absolute;right:0;line-height:1;transform:translateY(-50%);white-space:nowrap}
.chart-plot{min-width:0}
.chart{width:100%;height:138px;display:block;overflow:visible;touch-action:pan-y;
  cursor:crosshair;border-radius:4px}
.chart:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chart-grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-zero{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.65}
.chart-focus-line{stroke:var(--dim);stroke-width:1;stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;pointer-events:none}
.chart-focus-dot{stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.chart-bar{vector-effect:non-scaling-stroke}
.chart-bar.selected{stroke:var(--tx);stroke-width:1.5}
.chart-x-axis{height:18px;position:relative;margin-top:3px;color:var(--dim);
  font-size:9px;font-variant-numeric:tabular-nums}
.chart-x-label{position:absolute;top:0;line-height:1;transform:translateX(-50%);white-space:nowrap}
.chart-x-label.first{transform:none}.chart-x-label.last{transform:translateX(-100%)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%);z-index:80;background:var(--tx);color:var(--inverse);
  padding:11px 17px;border-radius:6px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}

/* ---------- 安全锁屏 ---------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:24px}
body.locked{overflow:hidden}
body.locked .lock{display:flex}
body.locked .app-shell,body.locked .sheet,body.locked .toast{visibility:hidden}
.lockbox{width:min(100%,390px);display:flex;flex-direction:column;gap:14px}
.vaultmark{width:72px;height:72px;object-fit:cover;border-radius:16px;margin-bottom:4px}
.lockbox h1{font-size:28px;margin:0}.lockbox p{margin:0;line-height:1.6}
.lockbox input{background:var(--field);border:1px solid var(--field-line);border-radius:5px;
  padding:13px;color:var(--tx);font-size:16px;width:100%}
.lockbox input:focus{outline:0;border-color:var(--tx)}
.lock-error{min-height:18px;color:var(--red);font-size:12px}
.lock-actions{display:flex;flex-direction:column;gap:9px}

/* ---------- 导入与识别 ---------- */
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.import-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.import-row{display:grid;grid-template-columns:24px 76px 1fr auto;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.import-row input{width:18px;height:18px}.import-row .note{min-width:0;overflow-wrap:anywhere}
.ocr-preview{width:100%;max-height:230px;object-fit:contain;background:var(--card2);border-radius:6px}
.progress{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--tx);width:0;transition:width .2s}

/* ---------- 今天 ---------- */
.today-head{padding:2px 0 7px}
.today-head h1{font-size:30px;line-height:1.15;margin:0 0 4px;font-weight:750}
.today-date{margin:0;color:var(--dim);font-size:13px}
.asset-strip{display:grid;grid-template-columns:38px minmax(0,1fr) auto 18px;
  align-items:center;gap:10px;width:100%;padding:15px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);text-align:left}
.asset-icon,.activity-icon{display:grid;place-items:center;background:var(--card2);border-radius:50%;color:var(--tx)}
.asset-icon{width:38px;height:38px;font-size:19px}
.asset-label{display:flex;flex-direction:column;min-width:0}
.asset-label b{font-size:14px;font-weight:650}.asset-label span{color:var(--dim);font-size:12px}
.asset-value{text-align:right;font-size:18px;font-weight:700;white-space:nowrap}
.asset-strip>.ph{color:var(--muted-icon);font-size:16px}
.home-section{display:flex;flex-direction:column}
.section-title{font-size:14px;font-weight:700;margin:4px 0 7px}
.activity-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;
  gap:10px;width:100%;padding:10px 0;text-align:left;border-bottom:1px solid var(--line)}
.activity-row:last-child{border-bottom:0}
.activity-icon{width:38px;height:38px;font-size:18px}
.activity-icon.red{background:var(--redS);color:var(--red)}
.activity-icon.amber{background:var(--amberS);color:var(--amber)}
.activity-icon.green{background:var(--greenS);color:var(--green)}
.activity-icon.blue{background:var(--blueS);color:var(--blue)}
.activity-copy{min-width:0;display:flex;flex-direction:column}
.activity-copy b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-copy span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-value{text-align:right;font-size:13px;font-weight:650;white-space:nowrap}
.activity-value small{display:block;color:var(--dim);font-size:10px;font-weight:500}
.home-actions{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.home-support{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.home-support .btn{min-width:0;padding-left:8px;padding-right:8px}
@media (min-width:700px){
  header{padding-left:max(16px,calc((100% - 640px)/2));padding-right:max(16px,calc((100% - 640px)/2))}
  nav{left:50%;right:auto;width:640px;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="lock" id="lock" aria-live="polite">
  <div class="lockbox">
    <img class="vaultmark" src="assets/scrooges-safe-icon.png" alt="Scrooge's Safe">
    <h1 id="lockTitle">打开 Scrooge's Safe</h1>
    <p class="dim" id="lockText"></p>
    <div id="lockFields"></div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-actions" id="lockActions"></div>
  </div>
</div>
<div class="app-shell">
  <header><div class="brand">
    <img src="assets/scrooges-safe-icon.png" alt="">
    <h1>Scrooge's Safe</h1>
  </div><div class="header-actions">
    <button class="hbtn" id="syncButton" data-status="off" onclick="manualSyncButton()" aria-label="家庭同步未设置" title="家庭同步未设置"><i id="syncIcon" class="ph ph-cloud-slash"></i></button>
    <button class="hbtn" onclick="lockVault()" aria-label="锁定" title="锁定"><i class="ph ph-lock"></i></button>
    <button class="hbtn" onclick="openSettings()" aria-label="设置" title="设置"><i class="ph ph-gear"></i></button>
  </div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div class="top"><h2 class="h2" id="sheetTitle"></h2><button class="x" onclick="closeSheet()">&times;</button></div><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
var SEED={version:2,fxRmbPerEur:8,appliedPatches:{},properties:[],meters:[],readings:[],accounts:[{id:"a1",name:"储蓄账户",currency:"EUR",note:""}],txs:[],contracts:[],budget:{einkommen:0,tilgung:0,autoMonat:0,grundbesitzQuartal:0,wohngebaeudeJahr:0,festkosten:[],sparZiel:0}};
/* ================= 计算引擎 =================
   逻辑与《嘘！Scrooge 的金库.xlsx》的公式逐条对齐：
   月均消耗 = (本次读数 − 上次读数) × 换算系数 ÷ 天数 × 30
   （对应 Excel  电: (E5-E4)/(B5-B4)*30   气: (Q5-Q4)*k/(M5-M4)*30 ）
   ============================================ */
var DAY = 86400000;

function toD(iso){ var p = iso.split('-'); return Date.UTC(+p[0], p[1]-1, +p[2]); }
function isoOf(ms){ return new Date(ms).toISOString().slice(0,10); }
function today(){ var n=new Date(); return isoOf(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function daysBetween(a,b){ return Math.round((toD(b)-toD(a))/DAY); }
function addDays(d,n){ return isoOf(toD(d)+n*DAY); }
function fmtDate(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function isDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); }

/** 结算年度起点：以 Ablesetermin (MM-DD) 为分界 */
function periodStart(d, term){
  var t=term.split('-'), am=+t[0], ad=+t[1];
  var dt=new Date(toD(d)), y=dt.getUTCFullYear();
  var cut=Date.UTC(y,am-1,ad);
  return isoOf(toD(d)>=cut ? cut : Date.UTC(y-1,am-1,ad));
}

function n0(v){ return Math.round(v).toLocaleString('de-DE'); }
function n2(v){ return v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function eur(v){ return (v<0?'−':'')+n2(Math.abs(v))+' €'; }
function money(v,cur){ return (v<0?'−':'')+n2(Math.abs(v))+' '+(cur==='EUR'?'€':'¥'); }

function sortByDate(a){ return a.slice().sort(function(x,y){ return x.date<y.date?-1:x.date>y.date?1:0; }); }
function meterReadings(readings,id){ return sortByDate(readings.filter(function(r){return r.meterId===id;})); }

/** 每两次抄表之间的区间 */
function intervals(rs,m){
  var s=sortByDate(rs), out=[];
  for(var i=1;i<s.length;i++){
    var days=daysBetween(s[i-1].date,s[i].date);
    var safe=days>0?days:1;
    var netRaw=s[i].value-s[i-1].value;
    var kwh=netRaw*m.factor;
    var cost=kwh*m.arbeitspreisCt/100;
    var absch=m.monthlyAbschlag*safe*12/365;
    out.push({from:s[i-1].date,to:s[i].date,days:days,netRaw:netRaw,kwh:kwh,
      avg30:kwh/safe*30, perDay:kwh/safe, cost:cost, abschlag:absch,
      delta:cost-absch, anomaly:netRaw<0, readingId:s[i].id, value:s[i].value});
  }
  return out;
}

/** 本结算年度累计 */
function currentPeriod(rs,m,now){
  now=now||today();
  var s=sortByDate(rs);
  if(s.length<2) return null;
  var start=periodStart(now,m.ableseTermin);
  // 基准 = 不晚于结算年度起点的最后一次抄表；若全都晚于起点则取第一次
  var bi=-1;
  for(var i=0;i<s.length;i++) if(s[i].date<=start) bi=i;
  if(bi<0) bi=0;
  var base=s[bi], last=s[s.length-1];
  if(base.date===last.date) return null;
  var netRaw=last.value-base.value, kwh=netRaw*m.factor;
  var days=Math.max(1,daysBetween(base.date,last.date));
  var cost=kwh*m.arbeitspreisCt/100;
  var paid=m.monthlyAbschlag*(daysBetween(base.date,now)/30.44);
  var perDay=kwh/days;
  return {start:base.date,end:last.date,kwh:kwh,netRaw:netRaw,cost:cost,
    abschlagPaid:paid, delta:cost-paid, days:days, avg30:perDay*30,
    projectedYearKwh:perDay*365, projectedYearCost:perDay*365*m.arbeitspreisCt/100};
}

function accountBalance(txs,id){

function totalEur(txs,accounts,fx){

/** 累计余额曲线（对应「存款走势」表） */
function balanceSeries(txs,ids){
  var rel=txs.filter(function(t){return ids.indexOf(t.accountId)>=0;})
             .sort(function(a,b){return a.date<b.date?-1:1;});
  var out=[],run=0;
  for(var i=0;i<rel.length;i++){
    run+=rel[i].amount;
    if(out.length && out[out.length-1].date===rel[i].date) out[out.length-1].value=run;
    else out.push({date:rel[i].date,value:run});
  }
  return out;
}
function monthlyNet(txs,ids){
  var m={};
  txs.forEach(function(t){
    if(ids.indexOf(t.accountId)<0||t.valuationOnly) return;
    var k=t.date.slice(0,7); m[k]=(m[k]||0)+t.amount;
  });
  return Object.keys(m).sort().map(function(k){return {date:k,value:m[k]};});
}

/** 合同倒计时 */
function contractStatus(c,now){
  now=now||today();
  var yearly=(c.premium||0)*(CYCLE_N[c.cycle]||0);
  if(!c.endDate) return {daysToEnd:null,noticeDeadline:null,daysToNotice:null,
    urgency:'open', label:c.autoRenew?'自动续约 · 无固定到期':'无到期日', yearlyCost:yearly};
  var dEnd=daysBetween(now,c.endDate);
  var nd=c.noticeDays>0 ? addDays(c.endDate,-c.noticeDays) : c.endDate;
  var dNotice=daysBetween(now,nd);
  var u,label;
  if(dEnd<0){ u='expired'; label='已过期 '+Math.abs(dEnd)+' 天'; }
  else if(dNotice<=0){ u='notice'; label='退保期已过 · '+dEnd+' 天后到期'; }
  else if(dNotice<=45){ u='soon'; label=dNotice+' 天内需决定退保'; }
  else { u='ok'; label=dEnd+' 天后到期'; }
  return {daysToEnd:dEnd,noticeDeadline:nd,daysToNotice:dNotice,urgency:u,label:label,yearlyCost:yearly};
}

/* ---------- .ics 日历文件 ---------- */
function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){
  var d=new Date(), p=function(n){return String(n).padStart(2,'0');};
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z';
}
function buildIcs(contracts){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scrooge Vault//Contracts//ZH',
         'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:金库 · 合同到期'];
  var alarm=function(trig,desc){ return ['BEGIN:VALARM','ACTION:DISPLAY',
    'TRIGGER:'+trig,'DESCRIPTION:'+icsEsc(desc),'END:VALARM']; };
  contracts.forEach(function(c){
    if(!c.endDate) return;
    var st=contractStatus(c);
    var mny=c.premium?(' · '+c.premium.toFixed(2)+' € / '+c.cycle):'';
    var desc=[c.provider?('服务商：'+c.provider):'', c.vehiclePlate?('车牌号：'+c.vehiclePlate):'',
      c.insuredPerson?('受保人：'+c.insuredPerson):'',
      c.tariff?('Tarif：'+c.tariff):'',
      c.premium?('保费：'+c.premium.toFixed(2)+' € ('+CYCLE_ZH[c.cycle]+')'):'',
      '合同期：'+fmtDate(c.startDate)+' – '+fmtDate(c.endDate),
      '退保通知期：'+c.noticeDays+' 天',
      c.autoRenew?'自动续约：是（不退保则自动延长）':'自动续约：否',
      c.notes?('备注：'+c.notes):''].filter(Boolean).join('\n');
    var ds=function(d){return d.replace(/-/g,'');};
    if(st.noticeDeadline && c.noticeDays>0){
      L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-notice@scrooge','DTSTAMP:'+icsStamp(),
        'DTSTART;VALUE=DATE:'+ds(st.noticeDeadline),
        'SUMMARY:⚠︎ 退保截止：'+icsEsc(c.name)+icsEsc(mny),
        'DESCRIPTION:'+icsEsc(desc)],
        alarm('-P14D',c.name+' 退保通知期还有 14 天'),
        alarm('-PT9H',c.name+' 今天是退保通知最后一天'),
        ['END:VEVENT']);
    }
    L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-end@scrooge','DTSTAMP:'+icsStamp(),
      'DTSTART;VALUE=DATE:'+ds(c.endDate),
      'SUMMARY:'+icsEsc(c.category)+' 到期：'+icsEsc(c.name)+icsEsc(mny),
      'DESCRIPTION:'+icsEsc(desc)],
      alarm('-P7D',c.name+' 7 天后到期'), ['END:VEVENT']);
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

function parseDecimalInput(v){
  var s=String(v==null?'':v).trim().replace(/[\s€'’]/g,'');
  var comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0&&dot>=0){
    if(comma>dot) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(comma>=0){
    s=s.replace(/\./g,'').replace(',','.');
  }else if((s.match(/\./g)||[]).length>1){
    var last=s.lastIndexOf('.');
    s=s.slice(0,last).replace(/\./g,'')+s.slice(last);

async function checkForAppUpdate(force){
  if(updateChecking||navigator.onLine===false) return false;
  if(!force&&Date.now()-lastUpdateCheck<60000) return false;
  updateChecking=true; lastUpdateCheck=Date.now();
  setRefreshStatus('checking','正在检查更新');
  try{
    var response=await fetch(appUrlWith('_update'),{cache:'no-store'});
    if(!response.ok) throw new Error('更新检查失败');
    var html=await response.text();
    var match=html.match(/var APP_BUILD=['"]([^'"]+)['"]/);
    if(match&&match[1]!==APP_BUILD){
      updatePending=true;
      setRefreshStatus('ready','发现新版本，点击刷新');
      var sheet=document.getElementById('sheet');
      if(sheet&&sheet.classList.contains('open')){
        toast('发现新版本，关闭当前编辑后自动刷新');
        return true;
      }
      await refreshApp(true);
      return true;
    }
    setRefreshStatus('idle','已是最新版本');
    return false;
  }catch(e){
    setRefreshStatus('idle','刷新应用');
    return false;
  }finally{
    updateChecking=false;
  }
}

var CW=320, CH=138, chartStore={}, chartSeq=0;

function clearChartState(){ chartStore={}; chartSeq=0; }
function chartNiceStep(v){
  var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;
}
function chartScale(vs){
  var rawMin=Math.min.apply(null,vs.concat([0]));
  var rawMax=Math.max.apply(null,vs.concat([0]));
  if(rawMin===rawMax) rawMax=rawMin+(Math.abs(rawMin)||1);
  var step=chartNiceStep((rawMax-rawMin)/3);
  var lo=Math.floor(rawMin/step)*step, hi=Math.ceil(rawMax/step)*step;
  if(lo===hi) hi=lo+step;
  var ticks=[], v;
  for(v=lo;v<=hi+step*.25;v+=step) ticks.push(Math.abs(v)<step/1000?0:v);
  if(ticks.length>6){
    step*=2; lo=Math.floor(rawMin/step)*step; hi=Math.ceil(rawMax/step)*step; ticks=[];
    for(v=lo;v<=hi+step*.25;v+=step) ticks.push(Math.abs(v)<step/1000?0:v);
  }
  return {min:lo,max:hi,ticks:ticks};
}
function chartShortNumber(v){
  var a=Math.abs(v), opts={maximumFractionDigits:1};
  if(a>=1000000) return (v/1000000).toLocaleString('de-DE',opts)+'M';
  if(a>=1000) return (v/1000).toLocaleString('de-DE',opts)+'k';
  if(a>0&&a<10&&Math.round(a)!==a) return v.toLocaleString('de-DE',opts);
  return n0(v);
}
function chartDateLong(d){
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)) return fmtDate(d);
  if(/^\d{4}-\d{2}$/.test(d)){ var p=d.split('-'); return p[1]+'.'+p[0]; }
  return d;
}
function chartDateShort(d){
  var p=d.split('-');
  if(p.length===3) return p[2]+'.'+p[1]+'.';
  if(p.length===2) return p[1]+'.'+p[0].slice(2);
  return d;
}
function chartGrid(scale,Y){

        esc(chartShortNumber(v))+'</span>';
    }).join('');

function chartXLabels(data,points,every,line){
  var idx=[], seen={}, i;
  if(line){
    idx=[0,Math.floor((data.length-1)/2),data.length-1];
  }else{
    for(i=0;i<data.length;i+=every) idx.push(i);
    idx.push(data.length-1);
  }
  idx=idx.filter(function(k){
    if(seen[k]) return false;
    seen[k]=true; return true;
  });
  if(!line&&idx.length>1){
    var last=idx[idx.length-1], prev=idx[idx.length-2];
    if(points[last].x-points[prev].x<44) idx.splice(idx.length-2,1);
  }
  return idx.map(function(k){
    var cls=k===0?' first':(k===data.length-1?' last':'');
    return '<span class="chart-x-label'+cls+'" style="left:'+(points[k].x/CW*100).toFixed(2)+'%">'+
      esc(chartDateShort(data[k].date))+'</span>';
  }).join('');
}
function chartMarkup(st,marks,scale,Y,every,line){

function selectChartPoint(id,index){
  var st=chartStore[id], shell=document.getElementById(id);
  if(!st||!shell) return;
  index=Math.max(0,Math.min(st.points.length-1,index));
  st.selected=index;
  var p=st.points[index], svg=shell.querySelector('svg');
  shell.querySelector('[data-chart-date]').textContent=chartDateLong(p.date);
  shell.querySelector('[data-chart-value]').textContent=st.fmt(p.value);
  var line=svg.querySelector('.chart-focus-line'), dot=svg.querySelector('.chart-focus-dot');
  line.setAttribute('x1',p.x); line.setAttribute('x2',p.x);
  dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y);
  dot.setAttribute('stroke',p.color||st.color);
  var bars=svg.querySelectorAll('.chart-bar');
  Array.prototype.forEach.call(bars,function(b){
    b.classList.toggle('selected',parseInt(b.getAttribute('data-bar-index'),10)===index);
  });
  svg.setAttribute('aria-label',st.label+'，'+chartDateLong(p.date)+'，'+st.fmt(p.value));
}
function chartPointFromPointer(e,id){
  var st=chartStore[id], svg=e.currentTarget;
  if(!st||!svg) return;
  var r=svg.getBoundingClientRect();
  if(!r.width) return;
  var x=Math.max(0,Math.min(CW,(e.clientX-r.left)/r.width*CW));
  var best=0, dist=Infinity;
  st.points.forEach(function(p,i){
    var d=Math.abs(p.x-x); if(d<dist){dist=d;best=i;}
  });
  selectChartPoint(id,best);
}
function chartPointerDown(e,id){
  e.currentTarget._chartDragging=true;
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  chartPointFromPointer(e,id);
}
function chartPointerMove(e,id){
  if(e.pointerType==='mouse'||e.currentTarget._chartDragging) chartPointFromPointer(e,id);
}
function chartPointerUp(e,id){
  chartPointFromPointer(e,id);
  e.currentTarget._chartDragging=false;
}
function chartPointerCancel(e){ e.currentTarget._chartDragging=false; }
function chartKey(e,id){
  var st=chartStore[id], next;
  if(!st) return;
  if(e.key==='ArrowLeft') next=st.selected-1;
  else if(e.key==='ArrowRight') next=st.selected+1;
  else if(e.key==='Home') next=0;
  else if(e.key==='End') next=st.points.length-1;
  else return;
  e.preventDefault(); selectChartPoint(id,next);
}
function lineChart(data,color,fmt,unit,label){
  if(data.length<2) return '<p class="dim">数据不足</p>';
  color=color||'var(--gold)'; fmt=fmt||n0; unit=unit||''; label=label||'趋势图';
  var scale=chartScale(data.map(function(d){return d.value;}));
  var top=18,bottom=6,span=scale.max-scale.min;
  var X=function(i){ return 2+(i/(data.length-1))*(CW-4); };
  var Y=function(v){ return top+((scale.max-v)/span)*(CH-top-bottom); };
  var points=data.map(function(p,i){
    return {x:X(i),y:Y(p.value),value:p.value,date:p.date,color:color};
  });
  var d=points.map(function(p,i){
    return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);
  }).join(' ');
  var base=Y(0);
  var area=d+' L'+points[points.length-1].x.toFixed(1)+','+base.toFixed(1)+
    ' L'+points[0].x.toFixed(1)+','+base.toFixed(1)+' Z';
  var marks='<path d="'+area+'" fill="'+color+'" opacity=".13"/>'+
    '<path d="'+d+'" stroke="'+color+'" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>';
  var id='chart-'+(++chartSeq), selected=data.length-1;
  chartStore[id]={id:id,data:data,points:points,selected:selected,color:color,fmt:fmt,unit:unit,label:label};
  return chartMarkup(chartStore[id],marks,scale,Y,1,true);
}
function barChart(data,fmt,colorFn,every,unit,label){
  if(!data.length) return '<p class="dim">暂无数据</p>';
  fmt=fmt||n0; every=every||Math.max(1,Math.ceil(data.length/6));
  unit=unit||''; label=label||'柱状图';
  var scale=chartScale(data.map(function(d){return d.value;}));
  var top=18,bottom=6,span=scale.max-scale.min,step=CW/data.length,bw=step*.62;
  var Y=function(v){ return top+((scale.max-v)/span)*(CH-top-bottom); };
  var zy=Y(0), selected=data.length-1, points=[], marks='';
  data.forEach(function(p,i){
    var y=Y(p.value), barTop=Math.min(y,zy), bh=Math.max(1.5,Math.abs(zy-y));
    var col=colorFn?colorFn(p.value):(p.value<0?'var(--red)':'var(--gold)');
    var x=i*step+step/2;
    points.push({x:x,y:y,value:p.value,date:p.date,color:col});
    marks+='<rect class="chart-bar'+(i===selected?' selected':'')+'" data-bar-index="'+i+
      '" x="'+(x-bw/2).toFixed(1)+'" y="'+barTop.toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+bh.toFixed(1)+'" rx="2" fill="'+col+'" opacity=".92"/>';
  });
  var id='chart-'+(++chartSeq);
  chartStore[id]={id:id,data:data,points:points,selected:selected,color:'var(--gold)',
    fmt:fmt,unit:unit,label:label};
  return chartMarkup(chartStore[id],marks,scale,Y,every,false);
}

/* ================= 加密存储与设备解锁 ================= */
var KDF_ITERATIONS=310000;
var vaultKey=null, vaultEnvelope=null, pendingState=null;
var saveQueue=Promise.resolve(), hiddenAt=0, vaultStarted=false;

function copyState(x){ return JSON.parse(JSON.stringify(x)); }
function randomBytes(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function bytesToB64(bytes){
  var s='', step=32768;
  for(var i=0;i<bytes.length;i+=step)
    s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
  return btoa(s);
}
function b64ToBytes(s){
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function b64Url(bytes){ return bytesToB64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlBytes(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  return b64ToBytes(s);
}
function subtle(){
  if(!window.crypto || !crypto.subtle) throw new Error('当前浏览器不支持加密，请使用最新版 Safari 或 Chrome');
  return crypto.subtle;
}
async function deriveVaultKey(password,salt,iterations){
  var raw=await subtle().importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return subtle().deriveKey(
    {name:'PBKDF2',salt:salt,iterations:iterations||KDF_ITERATIONS,hash:'SHA-256'},
    raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptTextWithKey(text,key,kdf,format){
  var iv=randomBytes(12);
  var encrypted=await subtle().encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));
  return {
    format:format,version:2,
    kdf:{name:'PBKDF2',hash:'SHA-256',iterations:kdf.iterations,salt:kdf.salt},
    cipher:{name:'AES-GCM',iv:bytesToB64(iv)},
    data:bytesToB64(new Uint8Array(encrypted))
  };
}
async function decryptTextWithKey(envelope,key){
  if(!envelope || envelope.version!==2 || !envelope.kdf || !envelope.cipher || !envelope.data)
    throw new Error('不是有效的加密金库文件');
  var plain=await subtle().decrypt(
    {name:'AES-GCM',iv:b64ToBytes(envelope.cipher.iv)},
    key,b64ToBytes(envelope.data));
  return new TextDecoder().decode(plain);
}
async function keyForEnvelope(password,envelope){
  return deriveVaultKey(password,b64ToBytes(envelope.kdf.salt),envelope.kdf.iterations);
}
function assertState(p){
  if(!p || !Array.isArray(p.accounts) || !Array.isArray(p.txs) ||
     !Array.isArray(p.readings) || !Array.isArray(p.contracts))
    throw new Error('备份内容结构不完整');
  return p;
}
function freshKdf(){
  return {iterations:KDF_ITERATIONS,salt:bytesToB64(randomBytes(16))};
}

async function persistSnapshot(snapshot,key,kdf){
  var env=await encryptTextWithKey(snapshot,key,kdf,'scrooge-vault-local');
  localStorage.setItem(ENC_KEY,JSON.stringify(env));
  vaultEnvelope=env;
  return env;
}
function save(){
  if(!S || !vaultKey || !vaultEnvelope) return Promise.resolve(false);
  if(typeof syncLocalChanged==='function') syncLocalChanged();
  var snapshot=JSON.stringify(S), key=vaultKey;
  var kdf={iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
  saveQueue=saveQueue.catch(function(){}).then(function(){
    return persistSnapshot(snapshot,key,kdf);
  }).catch(function(e){
    toast('加密保存失败：'+e.message);
    throw e;
  });
  return saveQueue;
}

async function setupVault(){
  var p=val('setup_pw'), p2=val('setup_pw2');
  if(p.length<8) return setLockError('主密码至少需要 8 位');
  if(p!==p2) return setLockError('两次输入的密码不一致');
  try{
    var kdf=freshKdf();
    vaultKey=await deriveVaultKey(p,b64ToBytes(kdf.salt),kdf.iterations);
    vaultEnvelope={kdf:kdf};
    S=assertState(pendingState||copyState(SEED));
    await persistSnapshot(JSON.stringify(S),vaultKey,kdf);
    localStorage.removeItem(KEY);
    pendingState=null;
    unlockUi();
    toast('Scrooge\'s Safe 已加密');
  }catch(e){ setLockError('加密失败：'+e.message); }
}
async function unlockWithPassword(){
  var p=val('unlock_pw');
  if(!p) return setLockError('请输入主密码');
  setLockError('正在解密…');
  try{
    var env=JSON.parse(localStorage.getItem(ENC_KEY));
    var key=await keyForEnvelope(p,env);
    var state=assertState(JSON.parse(await decryptTextWithKey(env,key)));
    vaultEnvelope=env; vaultKey=key; S=Object.assign({},SEED,state);
    unlockUi();
  }catch(e){
    vaultKey=null; S=null;
    setLockError('密码不正确，或加密数据已损坏');
  }
}
async function lockVault(){
  if(!vaultStarted) return;
  if(typeof syncLocked==='function') syncLocked();
  try{ await saveQueue; }catch(e){}
  closeSheet();

async function initVault(){

  var raw=localStorage.getItem(ENC_KEY);
  if(raw){
    try{
      vaultEnvelope=JSON.parse(raw);
      if(vaultEnvelope.format!=='scrooge-vault-local') throw new Error('格式不符');
      showUnlock();
      return;
    }catch(e){
      lockUi('无法打开 Scrooge\'s Safe','本地加密数据格式异常。请从加密备份恢复。','','');
      setLockError(e.message);
      return;
    }
  }
  try{
    var plain=localStorage.getItem(KEY);
    pendingState=plain ? assertState(Object.assign({},SEED,JSON.parse(plain))) : copyState(SEED);
  }catch(e){ pendingState=copyState(SEED); }
  showSetup();
}

async function encryptBackupPayload(state,password){
  var kdf=freshKdf();
  var key=await deriveVaultKey(password,b64ToBytes(kdf.salt),kdf.iterations);

}
async function decryptBackupPayload(envelope,password){
  if(envelope.format!=='scrooge-vault-backup') throw new Error('不是金库加密备份');
  var key=await keyForEnvelope(password,envelope);
  return assertState(JSON.parse(await decryptTextWithKey(envelope,key)));
}
async function encryptDataPatchPayload(patch,password){
  var kdf=freshKdf();
  var key=await deriveVaultKey(password,b64ToBytes(kdf.salt),kdf.iterations);
  return encryptTextWithKey(JSON.stringify(assertDataPatch(patch)),key,kdf,'scrooge-vault-patch');
}
async function decryptDataPatchPayload(envelope,password){
  if(envelope.format!=='scrooge-vault-patch') throw new Error('不是金库加密更新包');
  var key=await keyForEnvelope(password,envelope);
  return assertDataPatch(JSON.parse(await decryptTextWithKey(envelope,key)));
}

async function changeMasterPassword(){
  var old=val('old_pw'), next=val('new_pw'), again=val('new_pw2');
  if(next.length<8) return toast('新主密码至少需要 8 位');
  if(next!==again) return toast('两次输入的新密码不一致');
  try{
    var env=JSON.parse(localStorage.getItem(ENC_KEY));
    var oldKey=await keyForEnvelope(old,env);
    await decryptTextWithKey(env,oldKey);
    var syncConfig=typeof readSyncConfig==='function' ? await readSyncConfig(oldKey) : null;
    var kdf=freshKdf();
    var nextKey=await deriveVaultKey(next,b64ToBytes(kdf.salt),kdf.iterations);
    await persistSnapshot(JSON.stringify(S),nextKey,kdf);
    if(syncConfig&&typeof writeSyncConfig==='function')
      await writeSyncConfig(syncConfig,nextKey,kdf);
    vaultKey=nextKey;
    if(hasDeviceUnlock()) await storeDeviceKey(nextKey);
    closeSheet(); toast('主密码已更改');
  }catch(e){ toast('当前主密码不正确'); }
}

function openDeviceDb(){
  return new Promise(function(resolve,reject){
    var req=indexedDB.open('scrooge-vault-security',1);
    req.onupgradeneeded=function(){ req.result.createObjectStore('keys'); };
    req.onsuccess=function(){ resolve(req.result); };
    req.onerror=function(){ reject(req.error); };
  });
}
async function withDeviceStore(mode,fn){
  var db=await openDeviceDb();
  return new Promise(function(resolve,reject){
    var tx=db.transaction('keys',mode), store=tx.objectStore('keys'), req=fn(store);
    req.onsuccess=function(){ resolve(req.result); };
    req.onerror=function(){ reject(req.error); };
    tx.oncomplete=function(){ db.close(); };
  });
}
function storeDeviceKey(key){ return withDeviceStore('readwrite',function(s){return s.put(key,'vault-key');}); }
function readDeviceKey(){ return withDeviceStore('readonly',function(s){return s.get('vault-key');}); }
function deleteDeviceKey(){ return withDeviceStore('readwrite',function(s){return s.delete('vault-key');}); }

async function enableDeviceUnlock(){
  if(!window.isSecureContext || !window.PublicKeyCredential || !navigator.credentials)
    return toast('设备解锁需要 HTTPS 和最新版 Safari/Chrome');
  try{
    var userId=randomBytes(16);
    var cred=await navigator.credentials.create({publicKey:{
      challenge:randomBytes(32),
      rp:{name:"Scrooge's Safe"},
      user:{id:userId,name:'vault-device',displayName:"Scrooge's Safe 设备"},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',
        residentKey:'discouraged'},
      timeout:60000,attestation:'none'
    }});
    await storeDeviceKey(vaultKey);
    localStorage.setItem(DEVICE_KEY,JSON.stringify({
      credentialId:b64Url(new Uint8Array(cred.rawId)),userId:b64Url(userId)
    }));
    closeSheet(); toast('设备解锁已启用');
  }catch(e){
    toast(e.name==='NotAllowedError'?'设备认证已取消':'无法启用设备解锁：'+e.message);
  }
}
async function unlockWithDevice(){

var SYNC_META_KEY='scrooge.vault.sync.meta.v1';

function syncClone(value){
  return value===undefined?undefined:JSON.parse(JSON.stringify(value));
}
function syncSame(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function syncObject(value){
  return value!==null&&typeof value==='object'&&!Array.isArray(value);
}
function syncIdArrays(values){
  var found=false;
  for(var i=0;i<values.length;i++){
    var value=values[i];
    if(value===undefined) continue;
    if(!Array.isArray(value)) return false;
    for(var j=0;j<value.length;j++){
      found=true;
      if(!syncObject(value[j])||typeof value[j].id!=='string') return false;
    }
  }
  return found;
}
function syncMergeValue(base,local,remote,path,context){
  if(syncSame(local,remote)) return syncClone(local);
  if(syncSame(local,base)) return syncClone(remote);
  if(syncSame(remote,base)) return syncClone(local);

  if(syncIdArrays([base,local,remote])){
    var maps=[{}, {}, {}], order=[], seen={};
    [base||[],remote||[],local||[]].forEach(function(list,listIndex){
      list.forEach(function(item){
        maps[listIndex][item.id]=item;
        if(!seen[item.id]){ seen[item.id]=1; order.push(item.id); }
      });
    });
    return order.map(function(id){
      return syncMergeValue(maps[0][id],maps[2][id],maps[1][id],
        path+'['+id+']',context);
    }).filter(function(item){return item!==undefined;});
  }

  if(syncObject(local)&&syncObject(remote)&&(base===undefined||syncObject(base))){
    var keys={}, out={};
    Object.keys(base||{}).concat(Object.keys(local),Object.keys(remote)).forEach(function(k){
      keys[k]=1;
    });
    Object.keys(keys).forEach(function(k){
      var merged=syncMergeValue(base&&base[k],local[k],remote[k],
        path?(path+'.'+k):k,context);
      if(merged!==undefined) out[k]=merged;
    });
    return out;
  }

  context.conflicts.push(path||'state');
  return syncClone(context.preferLocal?local:remote);
}
function syncStateEmpty(state){
  if(!state) return true;
  return ['properties','meters','readings','txs','contracts'].every(function(k){
    return !Array.isArray(state[k])||state[k].length===0;
  });
}
function syncMergeStates(base,local,remote,preferLocal){
  if(!base&&syncStateEmpty(local)&&!syncStateEmpty(remote))
    return {state:syncClone(remote),conflicts:[]};
  if(!base&&syncStateEmpty(remote)&&!syncStateEmpty(local))
    return {state:syncClone(local),conflicts:[]};
  var context={preferLocal:!!preferLocal,conflicts:[]};
  var state=syncMergeValue(base||{},local,remote,'',context);
  return {state:assertState(Object.assign({},SEED,state)),conflicts:context.conflicts};
}

function readSyncMeta(){

function writeSyncMeta(patch){

async function readSyncConfig(key){

  var env=JSON.parse(raw), useKey=key||vaultKey;
  if(!useKey||env.format!=='scrooge-vault-sync-config')

async function writeSyncConfig(config,key,kdf){

  var useKdf=kdf||{iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
  var env=await encryptTextWithKey(JSON.stringify(config),useKey,useKdf,
    'scrooge-vault-sync-config');

function syncDeviceId(){

function syncRepoParts(repo){
  var match=String(repo||'').trim().match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
  if(!match) throw new Error('仓库格式应为 owner/repo');
  return {owner:match[1],repo:match[2]};
}
function syncApiUrl(config){
  var p=syncRepoParts(config.repo);
  var path=SYNC_FILE_PATH.split('/').map(encodeURIComponent).join('/');
  return 'https://api.github.com/repos/'+encodeURIComponent(p.owner)+'/'+
    encodeURIComponent(p.repo)+'/contents/'+path;
}
async function syncGithubRequest(config,method,body,query){
  var url=syncApiUrl(config)+(query?('?'+query):'');
  var response=await fetch(url,{
    method:method,
    headers:{
      Accept:'application/vnd.github+json',
      Authorization:'Bearer '+config.token,
      'X-GitHub-Api-Version':'2022-11-28',
      'Content-Type':'application/json'
    },
    body:body?JSON.stringify(body):undefined,
    signal:syncAbortController?syncAbortController.signal:undefined,
    cache:'no-store'
  });
  var data=null;
  try{ data=await response.json(); }catch(e){}
  if(response.status===404&&method==='GET') return null;
  if(!response.ok){
    var err=new Error((data&&data.message)||('GitHub 请求失败 ('+response.status+')'));
    err.status=response.status;
    throw err;
  }
  return data;
}
async function syncReadCloud(config){
  var data=await syncGithubRequest(config,'GET',null,
    'ref='+encodeURIComponent(config.branch||'main'));
  if(!data) return null;
  var raw=new TextDecoder().decode(b64ToBytes(String(data.content||'').replace(/\s/g,'')));
  return {sha:data.sha,envelope:JSON.parse(raw)};
}
async function syncWriteCloud(config,envelope,sha){
  var content=bytesToB64(new TextEncoder().encode(JSON.stringify(envelope)));
  var body={
    message:"Update encrypted Scrooge's Safe vault",
    content:content,branch:config.branch||'main'
  };
  if(sha) body.sha=sha;
  return syncGithubRequest(config,'PUT',body);
}
async function encryptSyncPayload(payload,password){
  var kdf=freshKdf();
  var key=await deriveVaultKey(password,b64ToBytes(kdf.salt),kdf.iterations);
  return encryptTextWithKey(JSON.stringify(payload),key,kdf,'scrooge-vault-sync');
}
async function decryptSyncPayload(envelope,password){
  if(!envelope||envelope.format!=='scrooge-vault-sync')
    throw new Error('云端文件不是 Scrooge\'s Safe 加密同步数据');
  try{
    var key=await keyForEnvelope(password,envelope);
    var payload=JSON.parse(await decryptTextWithKey(envelope,key));
    payload.state=assertState(Object.assign({},SEED,payload.state));
    return payload;
  }catch(e){
    if(e.message&&e.message.indexOf('云端文件')>=0) throw e;
    throw new Error('同步密码错误，或云端密文已损坏');
  }
}

function syncAssertSession(session){
  if(session!==syncSession||!S||!vaultKey) throw {cancelled:true};
}
async function syncOnce(config,session){
  syncAssertSession(session);
  await saveQueue.catch(function(){});
  syncAssertSession(session);
  var meta=readSyncMeta(), startVersion=syncEditVersion;
  var local=syncClone(S), cloud=await syncReadCloud(config);
  syncAssertSession(session);

  if(!cloud){
    if(syncEditVersion!==startVersion) throw {retry:true};
    var firstPayload={
      schema:1,revision:1,updatedAt:new Date().toISOString(),
      deviceId:config.deviceId,deviceName:config.deviceName,state:local
    };
    var firstEnvelope=await encryptSyncPayload(firstPayload,config.password);
    syncAssertSession(session);
    await syncWriteCloud(config,firstEnvelope,null);
    syncAssertSession(session);
    config.baseState=syncClone(local);
    config.revision=1;
    return {config:config,state:local,localAtStart:local,editVersion:startVersion,
      conflicts:[],uploaded:true};
  }

  var remotePayload=await decryptSyncPayload(cloud.envelope,config.password);
  syncAssertSession(session);
  var localChanged=new Date(meta.localChangedAt||0).getTime();
  var remoteChanged=new Date(remotePayload.updatedAt||0).getTime();
  var merged=syncMergeStates(config.baseState||null,local,remotePayload.state,
    localChanged>=remoteChanged);
  if(syncEditVersion!==startVersion) throw {retry:true};

  var needsUpload=!syncSame(merged.state,remotePayload.state);
  var revision=Number(remotePayload.revision)||0;
  if(needsUpload){
    var nextPayload={
      schema:1,revision:revision+1,updatedAt:new Date().toISOString(),
      deviceId:config.deviceId,deviceName:config.deviceName,state:merged.state
    };
    var envelope=await encryptSyncPayload(nextPayload,config.password);
    syncAssertSession(session);
    try{
      await syncWriteCloud(config,envelope,cloud.sha);
      syncAssertSession(session);
      revision++;
    }catch(e){
      if(e.status===409||e.status===422) throw {retry:true};
      throw e;
    }
  }
  config.baseState=syncClone(merged.state);
  config.revision=revision;
  return {config:config,state:merged.state,localAtStart:local,editVersion:startVersion,
    conflicts:merged.conflicts,uploaded:needsUpload};
}
async function runSync(options){
  options=options||{};
  if(!S||!vaultKey) return false;
  var meta=readSyncMeta();
  if(!meta.configured){
    if(!options.quiet) openSyncSettings();
    return false;
  }
  if(navigator.onLine===false){
    setSyncStatus('offline','当前离线','数据会保存在本机，联网后自动同步');
    if(!options.quiet) toast('当前离线，修改已安全保存在本机');
    return false;
  }

  setSyncStatus('syncing','正在加密同步…','');
  var session=syncSession;
  syncAbortController=new AbortController();
  var config=await readSyncConfig();
  syncAssertSession(session);
  if(!config||!config.token||!config.password) throw new Error('同步设置不完整');
  var result, attempts=0;
  while(attempts<4){
    attempts++;
    try{ result=await syncOnce(config,session); break; }
    catch(e){
      if(e&&e.retry){ await new Promise(function(r){setTimeout(r,180*attempts);}); continue; }
      throw e;
    }
  }
  if(!result) throw new Error('两台设备同时修改较频繁，请稍后重试');
  syncAssertSession(session);

  var stateToApply=result.state;
  if(syncEditVersion!==result.editVersion){
    var followup=syncMergeStates(result.localAtStart,S,result.state,true);
    stateToApply=followup.state;
    result.conflicts=result.conflicts.concat(followup.conflicts);
  }
  var changed=!syncSame(S,stateToApply);
  if(changed){
    S=assertState(Object.assign({},SEED,syncClone(stateToApply)));
    await saveQueue.catch(function(){});
    syncAssertSession(session);
    var kdf={iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
    await persistSnapshot(JSON.stringify(S),vaultKey,kdf);
    render();
  }
  config=result.config;
  config.lastSyncAt=new Date().toISOString();
  await writeSyncConfig(config);
  syncAssertSession(session);
  var stillPending=!syncSame(S,config.baseState);
  writeSyncMeta({
    pending:stillPending,lastSyncAt:config.lastSyncAt,lastError:'',
    conflicts:result.conflicts.length,revision:config.revision
  });
  syncRefreshStatus();
  if(stillPending) syncSchedule(500);
  if(!options.quiet)
    toast(result.conflicts.length?
      ('同步完成，'+result.conflicts.length+' 处同时修改已按较新时间合并'):'家庭数据已同步');
  return true;
}
function syncNow(options){
  if(syncRunning) return syncRunning;
  var run=runSync(options).catch(function(e){
    if(e&&(e.cancelled||e.name==='AbortError')) return false;
    var message=e&&e.message?e.message:'同步失败';
    writeSyncMeta({lastError:message});
    setSyncStatus('error','同步失败',message);
    if(!options||!options.quiet) toast('同步失败：'+message);
    return false;
  }).finally(function(){
    if(syncRunning===run){
      syncRunning=null;
      syncAbortController=null;
    }
  });
  syncRunning=run;
  return syncRunning;
}

var bankImportRows=[];

function parseDelimited(text,delimiter){
  var rows=[], row=[], field='', quoted=false;
  text=String(text||'').replace(/\r\n?/g,'\n');
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(quoted){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i++; }
      else if(c==='"') quoted=false;
      else field+=c;
    }else if(c==='"') quoted=true;
    else if(c===delimiter){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});
}
function normHeader(s){
  return String(s||'').replace(/^\uFEFF/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function findHeaderIndex(rows){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var hs=rows[i].map(normHeader);
    var hasDate=hs.some(function(h){
      return /^(buchung(?:stag)?|valuta|wertstellung(?:sdatum)?|datum|date)(?:\s|$)/.test(h);
    });

function parseBankDate(v){

  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):'';

function parseBankAmount(v){
  var s=String(v==null?'':v).trim(), neg=/^\(.*\)$/.test(s)||/-\s*$/.test(s);
  s=s.replace(/[()€$£¥\s']/g,'').replace(/-$/,'');

  if(s[0]==='+') s=s.slice(1);

  if(comma>=0&&dot>=0){

  }else if(comma>=0) s=s.replace(/\./g,'').replace(',','.');

function uniqueText(values){

function parseBankMatrix(rows){
  var hi=findHeaderIndex(rows);
  if(hi<0) throw new Error('找不到日期和金额列，请导出 CSV 格式的账单');
  var headers=rows[hi].map(normHeader);
  var dateCol=pickColumn(headers,[/^buchung(stag)?$/,/\bbuchung\b/,/^datum$/,/\bdate\b/,/wertstellung/,/valuta/]);
  var amountCol=pickColumn(headers,[/^betrag$/,/\bbetrag\b/,/^umsatz$/,/\bamount\b/]);
  var debitCol=pickColumn(headers,[/^soll$/,/\bdebit\b/]);
  var creditCol=pickColumn(headers,[/^haben$/,/\bcredit\b/]);
  if(dateCol<0 || (amountCol<0&&debitCol<0&&creditCol<0))
    throw new Error('账单列无法识别');
  var noteCols=[];
  [
    /auftraggeber/,/empfanger/,/begunstigter/,/zahlungspflichtiger/,
    /verwendungszweck/,/buchungstext/,/beschreibung/,/description/,/^name$/
  ].forEach(function(p){
    var idx=pickColumn(headers,[p],noteCols);
    if(idx>=0&&[dateCol,amountCol,debitCol,creditCol].indexOf(idx)<0) noteCols.push(idx);
  });

  rows.slice(hi+1).forEach(function(r){
    var date=parseBankDate(r[dateCol]);
    var amount=amountCol>=0?parseBankAmount(r[amountCol]):NaN;
    if(!isFinite(amount)){
      var debit=debitCol>=0?parseBankAmount(r[debitCol]):NaN;
      var credit=creditCol>=0?parseBankAmount(r[creditCol]):NaN;
      if(isFinite(credit)&&credit!==0) amount=Math.abs(credit);
      else if(isFinite(debit)&&debit!==0) amount=-Math.abs(debit);
    }
    if(!date||!isFinite(amount)||amount===0) return;
    var note=uniqueText(noteCols.map(function(i){return r[i];}));
    out.push({date:date,amount:amount,note:note||'银行账单导入',selected:true});
  });
  if(!out.length) throw new Error('没有找到可导入的交易');
  return out;
}
function parseBankCsvText(text){
  var semi=parseDelimited(text,';'), comma=parseDelimited(text,',');
  var a=findHeaderIndex(semi), b=findHeaderIndex(comma);

var tesseractLoader=null, ocrPreviewUrl='';

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoader) return tesseractLoader;
  tesseractLoader=new Promise(function(resolve,reject){

  });

}
async function loadMeterImage(file){
  var source, cleanup=function(){};
  if(window.createImageBitmap) source=await createImageBitmap(file);
  else{
    source=await new Promise(function(resolve,reject){
      var img=new Image(), url=URL.createObjectURL(file);
      cleanup=function(){URL.revokeObjectURL(url);};
      img.onload=function(){resolve(img);}; img.onerror=function(){reject(new Error('无法读取照片'));};
      img.src=url;
    });
  }

function meterCanvas(source,rect,maxWidth,upscale){
  var sx=Math.round(source.width*rect.x), sy=Math.round(source.height*rect.y);
  var sw=Math.max(1,Math.round(source.width*rect.w)), sh=Math.max(1,Math.round(source.height*rect.h));
  var scale=Math.min(upscale||1,maxWidth/sw);
  var canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(sw*scale));
  canvas.height=Math.max(1,Math.round(sh*scale));
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  var image=ctx.getImageData(0,0,canvas.width,canvas.height), d=image.data;
  for(var i=0;i<d.length;i+=4){
    var gray=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    gray=Math.max(0,Math.min(255,(gray-128)*1.7+128));
    d[i]=d[i+1]=d[i+2]=gray;
  }
  ctx.putImageData(image,0,0);
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('无法处理照片'));},'image/jpeg',.9);
  });
}
async function prepareMeterImages(file){
  var loaded=await loadMeterImage(file), source=loaded.source;
  try{
    return await Promise.all([
      meterCanvas(source,{x:0,y:0,w:1,h:1},1800,1),
      meterCanvas(source,{x:.18,y:.16,w:.64,h:.32},1800,4),
      meterCanvas(source,{x:.08,y:.30,w:.84,h:.34},1800,4)
    ]);
  }finally{
    if(source.close) source.close();
    loaded.cleanup();
  }
}
function meterNumber(token){
  var s=String(token||'').replace(/[Oo]/g,'0').replace(/[^\d.,]/g,'');
  if(!s) return NaN;
  var separators=(s.match(/[.,]/g)||[]).length;
  if(separators){
    var last=Math.max(s.lastIndexOf('.'),s.lastIndexOf(',')), tail=s.length-last-1;
    if(separators===1&&tail>0&&tail<=2)
      s=s.slice(0,last).replace(/[.,]/g,'')+'.'+s.slice(last+1);

function extractMeterCandidates(text,last,decimalPlaces,wholeOnly){

  matches.forEach(function(token){
    var compact=String(token).replace(/\D/g,''), digits=compact.length;

    var lastSeparator=Math.max(token.lastIndexOf('.'),token.lastIndexOf(','));
    var decimalTail=lastSeparator>=0?token.slice(lastSeparator+1).replace(/\D/g,'').length:0;
    var explicitDecimal=separators.length===1&&decimalTail>0&&decimalTail<=2;

    }
    values.forEach(function(candidate){
      var n=candidate.n;
      if(!isFinite(n)||n<0) return;

      if(isFinite(last)){

        if(n>last*5+10000) score-=80;
        if(integerDigits===String(Math.floor(last)).length) score+=18;

    return '<p class="c-red" style="margin:0;font-size:13px">'+fmtDate(a.from)+' → '+fmtDate(a.to)+
      '：读数下降 '+n2(Math.abs(a.netRaw))+' '+unit+'，请核对是否录错或换表。</p>';
  }).join(''),'red');

  var body=h2('抄表记录 ('+rs.length+')',
    '<button class="btn sm ghost" onclick="editTarif()">资费</button>')+
    '<span class="dim">表号 '+esc(m.serial||'—')+(m.reference?(' · 客户号 '+esc(m.reference)):'')+'</span>'+hr();
  if(!rs.length) body+='<p class="empty">还没有抄表记录</p>';
  iv.slice().reverse().forEach(function(i){
    body+=row({label:fmtDate(i.to)+'   '+n2(i.value)+' '+unit,
      sub:'+'+n2(i.netRaw)+' '+unit+' · '+i.days+' 天 · 月均 '+n0(i.avg30)+' kWh · '+n2(i.cost)+' €',
      right:'<button class="btn sm ghost" onclick="delReading(\''+i.readingId+'\')">删</button>'});
  });
  if(rs.length) body+=row({label:fmtDate(rs[0].date)+'   '+n2(rs[0].value)+' '+unit,sub:'基准读数',
    right:'<button class="btn sm ghost" onclick="delReading(\''+rs[0].id+'\')">删</button>'});
  out+=card(body);
  return out;
}

function previewReading(){
  var m=pickMeter(window._addKind);
  var rs=meterReadings(S.readings,m.id), last=rs[rs.length-1];
  var v=fnum('rd_val'), el=document.getElementById('rd_val_hint');
  if(!el) return;
  if(!last || !isFinite(v)){ el.textContent=''; return; }
  var net=v-last.value, kwh=net*m.factor;
  el.innerHTML='本期净用量 '+n2(net)+' '+(m.unit==='m3'?'m³':'kWh')+
    (m.factor!==1?(' = '+n0(kwh)+' kWh'):'')+' · 约 '+n2(kwh*m.arbeitspreisCt/100)+' €'+
    (net<0?' <span class="c-red">（读数比上次低，请核对）</span>':'');

function saveReading(){
  var m=pickMeter(window._addKind);
  var d=val('rd_date'), v=fnum('rd_val');
  if(!isDate(d)) return toast('请选择日期');
  if(!isFinite(v)) return toast('请输入有效的表读数');
  var rs=meterReadings(S.readings,m.id), last=rs[rs.length-1];
  if(last && v<last.value && !confirm('读数 '+n2(v)+' 小于上次的 '+n2(last.value)+'，仍然保存吗？')) return;
  S.readings.push({id:uid(),meterId:m.id,date:d,value:v,note:val('rd_note')});
  save(); closeSheet(); render(); toast('已保存');

function delReading(id){

  S.readings=S.readings.filter(function(x){return x.id!==id;});

  var fx=S.fxRmbPerEur, tot=totalEur(S.txs,S.accounts,fx);

      '汇率 1€ = '+n2(fx)+' ¥ '+icon('pencil-simple')+'</button></div>'+
    '<span class="big tnum c-gold">'+n2(tot)+' €</span>'+
    '<span class="dim">≈ '+n0(tot*fx)+' ¥</span>','gold');

  out+=card(h2('账户余额')+S.accounts.map(function(a){
    var b=accountBalance(S.txs,a.id);
    var sub=(a.currency==='RMB'?('≈ '+n2(b/fx)+' €'):'')+(a.note?((a.currency==='RMB'?' · ':'')+a.note):'');

      onclick:"setAcc('"+a.id+"')"});

    return {k:a.id,label:a.name};})),accSel,'setAcc');

  out+=card(h2('余额走势',badge(accSel==='all'?'EUR 账户合计':(sel?sel.currency:''),'dim'))+
    lineChart(balanceSeries(S.txs,ids),null,function(v){return n2(v)+' €';},'€','余额走势'));

  var mn=monthlyNet(S.txs,ids).slice(-18);
  var yr=today().slice(0,4);
  var rel = accSel==='all' ? S.txs.filter(function(t){return eurIds.indexOf(t.accountId)>=0;})
                           : S.txs.filter(function(t){return t.accountId===accSel;});
  var cashRel=rel.filter(function(t){return !t.valuationOnly;});
  var din=cashRel.filter(function(t){return t.date.slice(0,4)===yr&&t.amount>0;}).reduce(function(s,t){return s+t.amount;},0);
  var dout=cashRel.filter(function(t){return t.date.slice(0,4)===yr&&t.amount<0;}).reduce(function(s,t){return s+t.amount;},0);
  out+=card(h2('月度净流入')+barChart(mn,function(v){return n0(v)+' €';},
    function(v){return v<0?'var(--red)':'var(--green)';},3,'€','月度净流入')+hr()+
    '<div class="stats">'+stat(yr+' 存入',n0(din),'','green')+
    stat(yr+' 支出',n0(Math.abs(dout)),'','red')+
    stat('净额',n0(din+dout),'',din+dout>=0?'green':'red')+'</div>');

  var list=rel.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var shown = showAllTx ? list : list.slice(0,25);
  var body=h2('流水',badge(list.length+' 条','dim'));
  body+=shown.map(function(t){
    var a=S.accounts.filter(function(x){return x.id===t.accountId;})[0];
    return row({label:t.note||'（无备注）',
      sub:fmtDate(t.date)+' · '+a.name+(t.valuationOnly?' · 市值调整':''),
      value:money(t.amount,a.currency),tone:t.valuationOnly?'blue':(t.amount<0?'red':'green'),
      right:t.valuationOnly?'':'<button class="btn sm ghost" onclick="delTx(\''+t.id+'\')">删</button>'});
  }).join('');
  if(!list.length) body+='<p class="empty">还没有流水</p>';
  if(list.length>25) body+=btn(showAllTx?'收起':('显示全部 '+list.length+' 条'),'toggleAllTx()','ghost');
  out+=card(body);
  out+='<div class="btnrow">'+btn('记一笔','addTx()',null,'plus')+
    btn('导入银行账单','openBankImport()','ghost','file-csv')+'</div>';
  return out;

var CONTRACT_TYPES=[
  {id:'kfz',name:'Kfz-Versicherung',label:'车险 · Kfz-Versicherung',category:'车险'},
  {id:'building',name:'Wohngebäudeversicherung',label:'房屋险 · Wohngebäudeversicherung',category:'房屋险'},
  {id:'household',name:'Hausratversicherung',label:'家财险 · Hausratversicherung',category:'家财险'},

  {id:'accident',name:'Unfallversicherung',label:'意外险 · Unfallversicherung',category:'意外险'},

function contractTypeById(id){
  return CONTRACT_TYPES.filter(function(t){return t.id===id;})[0]||null;
}
function contractTypeFor(c){
  return CONTRACT_TYPES.filter(function(t){
    return c.category===t.category&&c.name===t.name;
  })[0]||null;
}
function normalizeVehiclePlate(s){
  return String(s||'').toUpperCase().replace(/[–—]/g,'-').replace(/\s+/g,' ').trim();

function needsInsuredPerson(c){
  return PERSON_INSURANCE.indexOf(typeof c==='string'?c:c.category)>=0;
}
function contractMissingFields(c){
  return [!c.premium?'缺保费':'',!c.endDate?'缺到期日':'',

    needsInsuredPerson(c)&&!c.insuredPerson?'缺受保人':''].filter(Boolean);

function saveCtr(id){
  var type=contractTypeById(val('c_name_type'));
  var name=type?type.name:val('c_name');
  if(!name) return toast('请填写合同名称');
  var st=val('c_start'), en=val('c_end');
  if(!isDate(st)) return toast('请选择生效日');
  if(en && !isDate(en)) return toast('到期日格式不对');
  var prem=fnum('c_prem'), nd=parseInt(val('c_notice'),10);
  var prop=val('c_prop');
  var category=val('c_cat');
  var obj={id:id||uid(),name:name,category:category,
    propertyId:prop==='none'?null:prop, provider:val('c_prov'), tariff:val('c_tar'),
    vehiclePlate:category==='车险'?normalizeVehiclePlate(val('c_vehicle')):'',
    insuredPerson:needsInsuredPerson(category)?val('c_insured'):'',
    premium:isFinite(prem)?Math.round((prem+Number.EPSILON)*100)/100:null,
    cycle:val('c_cyc'), startDate:st, endDate:en||null,
    autoRenew:document.getElementById('c_auto').checked,
    noticeDays:isFinite(nd)?nd:0, notes:val('c_notes')};
  var i=-1;
  S.contracts.forEach(function(c,k){ if(c.id===id) i=k; });
  if(i>=0) S.contracts[i]=obj; else S.contracts.push(obj);
  save(); closeSheet(); render(); toast('已保存');
}
function delCtr(id){
  var c=S.contracts.filter(function(x){return x.id===id;})[0];
  if(!confirm('删除合同「'+c.name+'」？')) return;
  S.contracts=S.contracts.filter(function(x){return x.id!==id;});
  save(); closeSheet(); render(); toast('已删除');
}

/* ================= 文件导出 ================= */
function saveFile(name,text,mime,utiHint){
  var blob=new Blob([text],{type:mime});
  // iPhone 优先走系统分享面板 —— 可直接选「日历」或存到「文件」
  if(navigator.canShare){
    try{
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).catch(function(){});
        return;
      }
    }catch(e){}
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  toast(utiHint||'已生成 '+name);
}
function exportIcs(){
  var withEnd=S.contracts.filter(function(c){return c.endDate;});
  if(!withEnd.length) return toast('没有带到期日的合同可导出');

    '已生成 '+withEnd.length+' 份合同的日历事件');
}

  var p=val('backup_pw'), p2=val('backup_pw2');

}

async function readBackupFile(input){
  var f=input.files&&input.files[0];
  if(!f) return;
  try{
    document.getElementById('imp').value=await f.text();
    toast('已读取 '+f.name);
  }catch(e){ toast('无法读取文件：'+e.message); }
}
async function doImport(){
  var t=val('imp');
  if(!t) return toast('请先选择文件或粘贴内容');
  try{
    var p=JSON.parse(t);
    if(p&&p.format==='scrooge-vault-patch'){
      var patchPassword=val('imp_pw');
      if(!patchPassword) return toast('请输入更新密码');
      var result=applyDataPatch(await decryptDataPatchPayload(p,patchPassword));
      await save(); closeSheet(); render();
      return toast(result.already?'这个更新包已经导入过':'数据更新已合并并加密保存');
    }
    if(p&&p.format==='scrooge-vault-backup'){
      var password=val('imp_pw');
      if(!password) return toast('请输入备份密码');
      p=await decryptBackupPayload(p,password);
    }
    assertState(p);
    S=Object.assign({},SEED,p);
    await save(); closeSheet(); render(); toast('备份已恢复并加密保存');
  }catch(e){ toast('恢复失败：'+e.message); }
}
function assertDataPatch(p){
  var keys=['properties','meters','readings','accounts','txs','contracts'];
  if(!p || p.format!=='scrooge-vault-data-patch' || p.version!==1 ||
     typeof p.id!=='string' || !p.id.trim())
    throw new Error('更新包结构不完整');
  var found=false;
  keys.forEach(function(key){
    if(p[key]==null) return;
    if(!Array.isArray(p[key]) || p[key].some(function(x){return !x||typeof x.id!=='string'||!x.id;}))
      throw new Error('更新包中的 '+key+' 记录无效');
    found=true;
  });
  if(!found) throw new Error('更新包中没有可合并的记录');
  return p;
}
function applyDataPatch(p){
  p=assertDataPatch(p);
  S.appliedPatches=S.appliedPatches||{};
  if(S.appliedPatches[p.id]) return {already:true,added:0,updated:0};
  var result={already:false,added:0,updated:0};
  ['properties','meters','readings','accounts','txs','contracts'].forEach(function(key){
    if(!p[key]) return;
    S[key]=S[key]||[];
    p[key].forEach(function(item){
      var i=S[key].findIndex(function(x){return x.id===item.id;});
      if(i<0){ S[key].push(copyState(item)); result.added++; }
      else { S[key][i]=copyState(item); result.updated++; }
    });
  });
  S.appliedPatches[p.id]=true;
  return result;
}
function doReset(){
  if(!confirm('将丢弃所有新增记录，恢复到从 Excel 导入时的状态。继续？')) return;
  S=JSON.parse(JSON.stringify(SEED)); save(); closeSheet(); render(); toast('已重置');
}
/** 生成不含数据的空壳，用于公开托管 */
function exportShell(){
  var html=document.documentElement.outerHTML;
  var empty='var SEED={version:2,fxRmbPerEur:8,appliedPatches:{},properties:[],meters:[],readings:[],'+
    'accounts:[{id:"a1",name:"储蓄账户",currency:"EUR",note:""}],txs:[],contracts:[],'+
    'budget:{einkommen:0,tilgung:0,autoMonat:0,grundbesitzQuartal:0,wohngebaeudeJahr:0,'+
    'festkosten:[],sparZiel:0}};';
  var i=html.indexOf('var SEED={'), j=html.indexOf('/* ================= 计算引擎');
  if(i<0||j<0||j<i) return toast('无法定位数据段，请手动删除 var SEED');
  var shell=html.slice(0,i)+empty+'\n'+html.slice(j);
  // 去掉运行时注入的内容，保证空壳干净
  shell=shell.replace(/<main id="main">[\s\S]*?<\/main>/,'<main id="main"></main>')
             .replace(/<nav id="nav">[\s\S]*?<\/nav>/,'<nav id="nav"></nav>')
             .replace(/<div class="body" id="sheetBody">[\s\S]*?<\/div>\s*<\/div>/,
                      '<div class="body" id="sheetBody"></div></div>');
  saveFile('Scrooges-Safe-空壳版.html','<!DOCTYPE html>\n'+shell,'text/html','空壳版已生成（不含数据）');
}
