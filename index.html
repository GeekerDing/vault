/* ================= 银行 CSV 导入 ================= */
var bankImportRows=[], bankImportFileName='', bankImportUndoIds=[];

function parseDelimited(text,delimiter){
  var rows=[], row=[], field='', quoted=false;
  text=String(text||'').replace(/\r\n?/g,'\n');
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(quoted){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i++; }
      else if(c==='"') quoted=false;
      else field+=c;
    }else if(c==='"') quoted=true;
    else if(c===delimiter){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});
}
function normHeader(s){
  return String(s||'').replace(/^\uFEFF/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function findHeaderIndex(rows){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var hs=rows[i].map(normHeader);
    var hasDate=hs.some(function(h){
      return /^(buchung(?:stag)?|valuta|wertstellung(?:sdatum)?|datum|date)(?:\s|$)/.test(h);
    });
    var hasAmount=hs.some(function(h){
      return /^(betrag|umsatz|amount|soll|haben)(?:\s|$)/.test(h);
    });
    if(hasDate&&hasAmount) return i;
  }
  return -1;
}
function pickColumn(headers,patterns,excluded){
  for(var i=0;i<headers.length;i++){
    if(excluded&&excluded.indexOf(i)>=0) continue;
    for(var j=0;j<patterns.length;j++) if(patterns[j].test(headers[i])) return i;
  }
  return -1;
}
function parseBankDate(v){
  v=String(v||'').trim();
  var m=v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):'';
}
function parseBankAmount(v){
  var s=String(v==null?'':v).trim(), neg=/^\(.*\)$/.test(s)||/-\s*$/.test(s);
  s=s.replace(/[()€$£¥\s']/g,'').replace(/-$/,'');
  if(s[0]==='-'){ neg=true; s=s.slice(1); }
  if(s[0]==='+') s=s.slice(1);
  var comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0&&dot>=0){
    if(comma>dot) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(comma>=0) s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,'');
  var n=parseFloat(s);
  return isFinite(n)?(neg?-Math.abs(n):n):NaN;
}
function uniqueText(values){
  var seen={}, out=[];
  values.forEach(function(v){
    v=String(v||'').replace(/\s+/g,' ').trim();
    var k=v.toLowerCase();
    if(v&&!seen[k]){seen[k]=1;out.push(v);}
  });
  return out.join(' · ').slice(0,500);
}
function parseBankMatrix(rows){
  var hi=findHeaderIndex(rows);
  if(hi<0) throw new Error('找不到日期和金额列，请导出 CSV 格式的账单');
  var headers=rows[hi].map(normHeader);
  var dateCol=pickColumn(headers,[/^buchung(stag)?$/,/\bbuchung\b/,/^datum$/,/\bdate\b/,/wertstellung/,/valuta/]);
  var amountCol=pickColumn(headers,[/^betrag$/,/\bbetrag\b/,/^umsatz$/,/\bamount\b/]);
  var debitCol=pickColumn(headers,[/^soll$/,/\bdebit\b/]);
  var creditCol=pickColumn(headers,[/^haben$/,/\bcredit\b/]);
  if(dateCol<0 || (amountCol<0&&debitCol<0&&creditCol<0))
    throw new Error('账单列无法识别');
  var noteCols=[];
  [
    /auftraggeber/,/empfanger/,/begunstigter/,/zahlungspflichtiger/,
    /verwendungszweck/,/buchungstext/,/beschreibung/,/description/,/^name$/
  ].forEach(function(p){
    var idx=pickColumn(headers,[p],noteCols);
    if(idx>=0&&[dateCol,amountCol,debitCol,creditCol].indexOf(idx)<0) noteCols.push(idx);
  });
  var out=[];
  rows.slice(hi+1).forEach(function(r){
    var date=parseBankDate(r[dateCol]);
    var amount=amountCol>=0?parseBankAmount(r[amountCol]):NaN;
    if(!isFinite(amount)){
      var debit=debitCol>=0?parseBankAmount(r[debitCol]):NaN;
      var credit=creditCol>=0?parseBankAmount(r[creditCol]):NaN;
      if(isFinite(credit)&&credit!==0) amount=Math.abs(credit);
      else if(isFinite(debit)&&debit!==0) amount=-Math.abs(debit);
    }
    if(!date||!isFinite(amount)||amount===0) return;
    var note=uniqueText(noteCols.map(function(i){return r[i];}));
    out.push({date:date,amount:amount,note:note||'银行账单导入',selected:true});
  });
  if(!out.length) throw new Error('没有找到可导入的交易');
  return out;
}
function parseBankCsvText(text){
  var semi=parseDelimited(text,';'), comma=parseDelimited(text,',');
  var a=findHeaderIndex(semi), b=findHeaderIndex(comma);
  return parseBankMatrix(a>=0&&(b<0||semi[a].length>=comma[b].length)?semi:comma);
}
function decodeBankFile(buffer){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buffer);}
  catch(e){return new TextDecoder('windows-1252').decode(buffer);}
}
function normalizedNote(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function importSignature(accountId,row){
  return accountId+'|'+row.date+'|'+Number(row.amount).toFixed(2)+'|'+normalizedNote(row.note);
}
function shortHash(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function markBankDuplicates(){
  var accountId=val('bank_acc'), seen={};
  S.txs.forEach(function(t){
    seen[importSignature(t.accountId,t)]=1;
    if(t.importRef) seen[t.importRef]=1;
  });
  bankImportRows.forEach(function(r){
    var wasDuplicate=r.duplicate;
    r.signature=importSignature(accountId,r);
    r.importRef='bank-'+shortHash(r.signature);
    r.duplicate=!!(seen[r.signature]||seen[r.importRef]);
    if(r.duplicate) r.selected=false;
    else if(wasDuplicate) r.selected=true;
    seen[r.signature]=1;
  });
}
function openBankImport(){
  bankImportRows=[];
  bankImportFileName='';
  bankImportUndoIds=[];
  var selected=accSel==='all'?(S.accounts.filter(function(a){return a.id==='ing';})[0]||S.accounts[0]).id:accSel;
  openSheet('导入银行账单',
    card('<h2 class="h2">ING / 银行 CSV</h2><p class="dim" style="margin:0;line-height:1.6">'+
      '从网上银行导出 CSV 后在这里选择。账单只在当前设备解析，导入前可核对，重复记录会自动跳过。</p>','blue')+
    field({id:'bank_acc',label:'导入到账户',type:'select',val:selected,
      opts:S.accounts.map(function(a){return {k:a.id,label:a.name+' ('+a.currency+')'};})})+
    fileField({id:'bank_file',label:'选择 CSV 账单',accept:'.csv,text/csv',
      onchange:'readBankFile(this)',hint:'支持德式日期与小数格式，也兼容常见的逗号分隔 CSV。'})+
    '<div id="bank_preview"><p class="empty">尚未选择文件</p></div>');
  document.getElementById('bank_acc').addEventListener('change',renderBankPreview);
}
async function readBankFile(input){
  var f=input.files&&input.files[0];
  if(!f) return;
  var box=document.getElementById('bank_preview');
  box.innerHTML='<p class="empty">正在读取 '+esc(f.name)+'…</p>';
  try{
    bankImportFileName=f.name||'';
    bankImportRows=parseBankCsvText(decodeBankFile(await f.arrayBuffer()));
    renderBankPreview();
  }catch(e){
    bankImportRows=[];
    box.innerHTML=card('<p class="c-red" style="margin:0">'+esc(e.message)+'</p>','red');
  }
}
function renderBankPreview(){
  var box=document.getElementById('bank_preview');
  if(!box||!bankImportRows.length) return;
  markBankDuplicates();
  var fresh=bankImportRows.filter(function(r){return !r.duplicate;}).length;
  var dup=bankImportRows.length-fresh;
  var account=S.accounts.filter(function(a){return a.id===val('bank_acc');})[0];
  var rows=bankImportRows.slice(0,100).map(function(r,i){
    return '<label class="import-row"><input type="checkbox" '+(r.selected?'checked ':'')+
      (r.duplicate?'disabled ':'')+'onchange="toggleBankRow('+i+',this.checked)">'+
      '<span class="dim">'+fmtDate(r.date)+'</span><span class="note">'+esc(r.note)+
      (r.duplicate?'<br><span class="c-amber">重复，已跳过</span>':'')+'</span>'+
      '<b class="tnum '+(r.amount<0?'c-red':'c-green')+'">'+
      money(r.amount,account?account.currency:'EUR')+'</b></label>';
  }).join('');
  box.innerHTML=card(h2('导入预览',badge(fresh+' 条可导入','green'))+
    '<p class="dim" style="margin:0">共识别 '+bankImportRows.length+' 条'+
    (dup?'，其中 '+dup+' 条重复':'')+'。取消勾选可排除记录。</p>'+
    '<div class="import-list">'+rows+'</div>'+
    (bankImportRows.length>100?'<p class="dim">这里只预览前 100 条，其余记录仍会按默认选择导入。</p>':'')+
    btn('导入已选记录','importBankRows()')+
    btn('查找并撤销这份 CSV 的已导入记录','previewBankImportUndo()','ghost','arrow-counter-clockwise'));
}
function toggleBankRow(i,checked){ if(bankImportRows[i]&&!bankImportRows[i].duplicate) bankImportRows[i].selected=checked; }
async function importBankRows(){
  var accountId=val('bank_acc');
  markBankDuplicates();
  var chosen=bankImportRows.filter(function(r){return r.selected&&!r.duplicate;});
  if(!chosen.length) return toast('没有可导入的记录');
  var batchId='bank-batch-'+uid(), importedAt=new Date().toISOString();
  chosen.forEach(function(r){
    S.txs.push({id:uid(),accountId:accountId,date:r.date,amount:r.amount,note:r.note,
      importRef:r.importRef,importBatchId:batchId,importFileName:bankImportFileName,importedAt:importedAt});
  });
  await save();
  closeSheet(); render(); toast('已导入 '+chosen.length+' 条账单记录');
}

function findBankImportMatches(rows){
  var signatures={}, accounts={};
  S.accounts.forEach(function(account){
    accounts[account.id]=account;
    rows.forEach(function(row){ signatures[importSignature(account.id,row)]=true; });
  });
  return S.txs.map(function(tx){
    if(!tx.importRef||!accounts[tx.accountId]) return null;
    var signature=importSignature(tx.accountId,tx);
    if(!signatures[signature]||tx.importRef!=='bank-'+shortHash(signature)) return null;
    return {tx:tx,account:accounts[tx.accountId]};
  }).filter(Boolean);
}
function previewBankImportUndo(){
  var matches=findBankImportMatches(bankImportRows), box=document.getElementById('bank_preview');
  if(!matches.length) return toast('没有找到由这份 CSV 导入的记录');
  bankImportUndoIds=matches.map(function(match){return match.tx.id;});
  var groups={};
  matches.forEach(function(match){
    var id=match.account.id;
    if(!groups[id]) groups[id]={account:match.account,count:0,total:0};
    groups[id].count++; groups[id].total+=Number(match.tx.amount)||0;
  });
  var summary=Object.keys(groups).map(function(id){
    var group=groups[id];
    return row({label:group.account.name,sub:group.count+' 条银行导入记录',
      value:money(group.total,group.account.currency),tone:group.total<0?'red':'green'});
  }).join('');
  box.innerHTML=card(h2('撤销导入预览',badge(matches.length+' 条','red'))+
    '<p class="dim" style="margin:0">只会删除与这份 CSV 精确匹配、且带银行导入编号的记录。</p>'+
    summary+btn('确认撤销这些记录','undoBankImportMatches()','danger','trash')+
    btn('返回导入预览','renderBankPreview()','ghost'));
}
async function undoBankImportMatches(){
  var ids=bankImportUndoIds.slice();
  if(!ids.length) return toast('没有可撤销的导入记录');
  if(!confirm('将删除这份 CSV 导入的 '+ids.length+' 条流水。继续？')) return;
  var idSet={}; ids.forEach(function(id){idSet[id]=true;});
  var before=S.txs.length;
  S.txs=S.txs.filter(function(tx){return !idSet[tx.id];});
  var removed=before-S.txs.length;
  if(!removed) return toast('这些记录已经撤销');
  await save();
  bankImportUndoIds=[]; bankImportRows=[]; bankImportFileName='';
  closeSheet(); render(); toast('已撤销 '+removed+' 条银行导入记录');
}

var tesseractLoader=null, ocrPreviewUrl='', ocrWindowPreviewUrl='';

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoader) return tesseractLoader;
  tesseractLoader=new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src='assets/vendor/tesseract/tesseract.min.js';
    script.onload=function(){ resolve(window.Tesseract); };
    script.onerror=function(){ reject(new Error('OCR 组件下载失败，请检查网络')); };
    document.head.appendChild(script);
  });
  return tesseractLoader;
}
async function loadMeterImage(file){
  var source, cleanup=function(){};
  if(window.createImageBitmap) source=await createImageBitmap(file);
  else{
    source=await new Promise(function(resolve,reject){
      var img=new Image(), url=URL.createObjectURL(file);
      cleanup=function(){URL.revokeObjectURL(url);};
      img.onload=function(){resolve(img);}; img.onerror=function(){reject(new Error('无法读取照片'));};
      img.src=url;
    });
  }
  return {source:source,cleanup:cleanup};
}
function meterCanvas(source,rect,maxWidth,upscale,options){
  options=options||{};
  var sx=Math.round(source.width*rect.x), sy=Math.round(source.height*rect.y);
  var sw=Math.max(1,Math.round(source.width*rect.w)), sh=Math.max(1,Math.round(source.height*rect.h));
  var scale=Math.min(upscale||1,maxWidth/sw);
  var canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(sw*scale));
  canvas.height=Math.max(1,Math.round(sh*scale));
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  var image=ctx.getImageData(0,0,canvas.width,canvas.height), d=image.data;
  var histogram=new Array(256).fill(0), contrast=options.contrast||1.7;
  for(var i=0;i<d.length;i+=4){
    var gray=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    histogram[Math.max(0,Math.min(255,Math.round(gray)))]++;
    gray=Math.max(0,Math.min(255,(gray-128)*contrast+128));
    d[i]=d[i+1]=d[i+2]=gray;
  }
  if(options.binary){
    var total=d.length/4,sum=0,sumB=0,wB=0,best=0,threshold=128,maxVariance=-1;
    for(var h=0;h<256;h++) sum+=h*histogram[h];
    for(var level=0;level<256;level++){
      wB+=histogram[level];
      if(!wB) continue;
      var wF=total-wB;
      if(!wF) break;
      sumB+=level*histogram[level];
      var meanB=sumB/wB,meanF=(sum-sumB)/wF;
      var variance=wB*wF*(meanB-meanF)*(meanB-meanF);
      if(variance>maxVariance){maxVariance=variance;threshold=level;}
    }
    for(var p=0;p<d.length;p+=4){
      var binary=d[p]>threshold?0:255;
      d[p]=d[p+1]=d[p+2]=binary;
    }
  }else if(options.invert){
    for(var q=0;q<d.length;q+=4) d[q]=d[q+1]=d[q+2]=255-d[q];
  }
  ctx.putImageData(image,0,0);
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('无法处理照片'));},'image/jpeg',.95);
  });
}
function detectMeterWindow(source){
  var scale=Math.min(1,640/source.width),w=Math.max(1,Math.round(source.width*scale));
  var h=Math.max(1,Math.round(source.height*scale)),canvas=document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,0,0,w,h);
  var data=ctx.getImageData(0,0,w,h).data,mask=new Uint8Array(w*h);
  var x0=Math.floor(w*.1),x1=Math.ceil(w*.9),y0=Math.floor(h*.12),y1=Math.ceil(h*.56);
  for(var y=y0;y<y1;y++) for(var x=x0;x<x1;x++){
    var index=y*w+x,p=index*4,r=data[p],g=data[p+1],b=data[p+2];
    if(r>105&&g<125&&r-g>38&&r-b>28) mask[index]=1;
  }
  var queue=new Int32Array(w*h),best=null,jumps=[-1,1,-w,w,-w-1,-w+1,w-1,w+1,-2,2,-2*w,2*w];
  for(var start=y0*w+x0;start<y1*w;start++){
    var startX=start%w;
    if(startX<x0||startX>=x1||!mask[start]) continue;
    var head=0,tail=0,minX=startX,maxX=startX,minY=Math.floor(start/w),maxY=minY,count=0;
    queue[tail++]=start; mask[start]=0;
    while(head<tail){
      var at=queue[head++],ax=at%w,ay=Math.floor(at/w); count++;
      minX=Math.min(minX,ax);maxX=Math.max(maxX,ax);minY=Math.min(minY,ay);maxY=Math.max(maxY,ay);
      for(var j=0;j<jumps.length;j++){
        var next=at+jumps[j],nx=next%w,ny=Math.floor(next/w);
        if(next<0||next>=mask.length||nx<x0||nx>=x1||ny<y0||ny>=y1||
          Math.abs(nx-ax)>2||Math.abs(ny-ay)>2||!mask[next]) continue;
        mask[next]=0; queue[tail++]=next;
      }
    }
    var bw=maxX-minX+1,bh=maxY-minY+1,cx=(minX+maxX)/2,cy=(minY+maxY)/2;
    if(count<12||bw<3||bh<7||bw>w*.075||bh>h*.04) continue;
    var score=count*2+bh+bw-Math.abs(cx-w*.58)*.12-Math.abs(cy-h*.34)*.04;
    if(!best||score>best.score) best={x:minX,y:minY,w:bw,h:bh,score:score};
  }
  if(!best) return null;
  var right=Math.min(w,best.x+best.w+best.h*.15);
  var windowWidth=Math.max(best.w*7.5,best.h*5,w*.22);
  if(best.h>h*.03) windowWidth=Math.min(windowWidth,w*.32);
  var left=Math.max(0,right-Math.min(windowWidth,w*.45));
  var scanTop=Math.max(0,Math.floor(best.y+best.h*.25));
  var scanBottom=Math.min(h,Math.ceil(best.y+best.h*2.15)),lightRun=0;
  var requiredLight=Math.max(14,Math.round(w*.028));
  for(var scanX=Math.floor(right-best.w*.7);scanX>Math.max(0,right-w*.5);scanX--){
    var dark=0,samples=0;
    for(var scanY=scanTop;scanY<scanBottom;scanY+=2){
      var pixel=(scanY*w+scanX)*4;
      var luminance=.299*data[pixel]+.587*data[pixel+1]+.114*data[pixel+2];
      if(luminance<105) dark++;samples++;
    }
    if(samples&&dark/samples<.28) lightRun++; else lightRun=0;
    if(lightRun>=requiredLight){
      var scannedLeft=scanX+lightRun,scannedWidth=right-scannedLeft;
      if(scannedWidth>=w*.18&&scannedWidth<=w*.43&&scannedWidth>=windowWidth*.8) left=scannedLeft;
      break;
    }
  }
  var top=Math.max(0,best.y-best.h*.35);
  var bottom=Math.min(h,Math.min(Math.max(best.y+best.h*2.3,top+h*.05),top+h*.07));
  if(right-left<w*.14||bottom-top<h*.018) return null;
  return {x:left/w,y:top/h,w:(right-left)/w,h:(bottom-top)/h,confidence:best.score};
}
function detectGasMeterWindow(source){
  var scale=Math.min(1,640/source.width),w=Math.max(1,Math.round(source.width*scale));
  var h=Math.max(1,Math.round(source.height*scale)),canvas=document.createElement('canvas');
  canvas.width=w;canvas.height=h;
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,0,0,w,h);
  var data=ctx.getImageData(0,0,w,h).data,mask=new Uint8Array(w*h);
  var x0=Math.floor(w*.1),x1=Math.ceil(w*.9),y0=Math.floor(h*.2),y1=Math.ceil(h*.68);
  for(var y=y0;y<y1;y++) for(var x=x0;x<x1;x++){
    var pixel=(y*w+x)*4,luma=.299*data[pixel]+.587*data[pixel+1]+.114*data[pixel+2];
    if(luma<58) mask[y*w+x]=1;
  }
  var queue=new Int32Array(w*h),jumps=[-1,1,-w,w,-w-1,-w+1,w-1,w+1],best=null;
  for(var start=y0*w+x0;start<y1*w;start++){
    var startX=start%w;
    if(startX<x0||startX>=x1||!mask[start]) continue;
    var head=0,tail=0,minX=startX,maxX=startX,minY=Math.floor(start/w),maxY=minY,count=0;
    queue[tail++]=start;mask[start]=0;
    while(head<tail){
      var at=queue[head++],ax=at%w,ay=Math.floor(at/w);count++;
      minX=Math.min(minX,ax);maxX=Math.max(maxX,ax);minY=Math.min(minY,ay);maxY=Math.max(maxY,ay);
      for(var j=0;j<jumps.length;j++){
        var next=at+jumps[j],nx=next%w,ny=Math.floor(next/w);
        if(next<0||next>=mask.length||nx<x0||nx>=x1||ny<y0||ny>=y1||
          Math.abs(nx-ax)>1||Math.abs(ny-ay)>1||!mask[next]) continue;
        mask[next]=0;queue[tail++]=next;
      }
    }
    var bw=maxX-minX+1,bh=maxY-minY+1,fill=count/(bw*bh),cy=(minY+maxY)/2;
    if(bw<w*.24||bw>w*.7||bh<h*.018||bh>h*.11||bw/bh<4||fill<.38) continue;
    var score=bw*3+count*.08-Math.abs(cy-h*.46)*.35;
    if(!best||score>best.score) best={x:minX,y:minY,w:bw,h:bh,score:score};
  }
  if(!best) return null;
  var padX=Math.max(4,best.w*.025),padY=Math.max(3,best.h*.28);
  var left=Math.max(0,best.x-padX),top=Math.max(0,best.y-padY);
  var right=Math.min(w,best.x+best.w+padX),bottom=Math.min(h,best.y+best.h+padY);
  return {x:left/w,y:top/h,w:(right-left)/w,h:(bottom-top)/h,confidence:best.score};
}
async function prepareMeterImages(file,meter){
  var loaded=await loadMeterImage(file), source=loaded.source;
  try{
    var detected=detectMeterWindow(source),passes=[];
    if(!detected&&meter&&meter.kind==='gas'){
      detected=detectGasMeterWindow(source);
      if(!detected) detected={x:.15,y:.42,w:.57,h:.1,confidence:0};
    }
    if(detected){
      passes.push({rect:detected,upscale:5,options:{contrast:2.1},weight:280,
        mode:'raw',label:'数字窗',trusted:true,preview:true});
      passes.push({rect:detected,upscale:5,options:{contrast:1.7,binary:true},weight:250,
        mode:'raw',label:'数字窗增强图',trusted:true});
    }
    passes.push({rect:{x:.14,y:.14,w:.72,h:.4},upscale:3,options:{contrast:1.9},
      weight:45,mode:'sparse',label:'表盘区域'});
    passes.push({rect:{x:0,y:0,w:1,h:1},upscale:1,options:{contrast:1.7},
      weight:0,mode:'sparse',label:'整张照片'});
    return await Promise.all(passes.map(async function(pass){
      pass.blob=await meterCanvas(source,pass.rect,1800,pass.upscale,pass.options);
      return pass;
    }));
  }finally{
    if(source.close) source.close();
    loaded.cleanup();
  }
}
function meterNumber(token){
  var s=String(token||'').replace(/[Oo]/g,'0').replace(/[^\d.,]/g,'');
  if(!s) return NaN;
  var separators=(s.match(/[.,]/g)||[]).length;
  if(separators){
    var last=Math.max(s.lastIndexOf('.'),s.lastIndexOf(',')), tail=s.length-last-1;
    if(separators===1&&tail>0&&tail<=2)
      s=s.slice(0,last).replace(/[.,]/g,'')+'.'+s.slice(last+1);
    else s=s.replace(/[.,]/g,'');
  }
  var n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function extractMeterCandidates(text,last,decimalPlaces,wholeOnly){
  var matches=String(text||'').replace(/[Oo]/g,'0').match(/\d[\d \t.,]{2,}\d/g)||[];
  decimalPlaces=decimalPlaces&&decimalPlaces.length?decimalPlaces:[0];
  var seen={}, out=[];
  matches.forEach(function(token){
    var compact=String(token).replace(/\D/g,''), digits=compact.length;
    if(digits<4||digits>10) return;
    var separators=token.match(/[.,]/g)||[];
    var lastSeparator=Math.max(token.lastIndexOf('.'),token.lastIndexOf(','));
    var decimalTail=lastSeparator>=0?token.slice(lastSeparator+1).replace(/\D/g,'').length:0;
    var explicitDecimal=separators.length===1&&decimalTail>0&&decimalTail<=2;
    var values=[{n:meterNumber(token),places:explicitDecimal?'explicit':0}];
    if(!separators.length){
      decimalPlaces.forEach(function(p){
        if(p>0&&digits>p) values.push({n:parseInt(compact,10)/Math.pow(10,p),places:p});
      });
    }
    values.forEach(function(candidate){
      var n=candidate.n;
      if(!isFinite(n)||n<0) return;
      if(wholeOnly) n=Math.floor(n);
      var key=String(n);
      if(seen[key]) return;
      seen[key]=1;
      var score=digits, integerDigits=String(Math.floor(n)).length;
      if(candidate.places==='explicit'||candidate.places===decimalPlaces[0]) score+=180;
      if(isFinite(last)){
        var delta=Math.abs(n-last), range=Math.max(50,Math.abs(last)*.03);
        score+=120/(1+delta/range);
        if(n>=last*.5&&n<=last*2+5000) score+=25;
        if(n>last*5+10000) score-=80;
        if(integerDigits===String(Math.floor(last)).length) score+=18;
      }
      out.push({value:n,raw:token.trim(),score:score});
    });
  });
  return out.sort(function(a,b){return b.score-a.score;});
}
function rankMeterCandidates(recognitions,last,decimalPlaces,wholeOnly){
  var merged={};
  recognitions.forEach(function(recognition){
    extractMeterCandidates(recognition.text,last,decimalPlaces,wholeOnly).forEach(function(candidate){
      var key=String(candidate.value),weighted=candidate.score+(recognition.weight||0)+
        Math.max(0,recognition.confidence||0)*.2;
      if(!merged[key]) merged[key]={value:candidate.value,raw:candidate.raw,score:weighted,hits:1,
        trustedHits:recognition.trusted?1:0,
        trustedConfidence:recognition.trusted?Math.max(0,recognition.confidence||0):0};
      else{
        merged[key].score=Math.max(merged[key].score,weighted)+70;
        merged[key].hits++;
        if(recognition.trusted){
          merged[key].trustedHits++;
          merged[key].trustedConfidence=Math.max(merged[key].trustedConfidence,
            Math.max(0,recognition.confidence||0));
        }
      }
    });
  });
  return Object.keys(merged).map(function(key){
    var candidate=merged[key];
    candidate.plausible=meterCandidatePlausible(candidate.value,last);
    candidate.safeToFill=candidate.plausible&&candidate.trustedHits>0&&candidate.trustedConfidence>=45;
    return candidate;
  }).sort(function(a,b){
    return b.score-a.score;
  });
}
function meterCandidatePlausible(value,last){
  if(!isFinite(value)||value<0) return false;
  if(!isFinite(last)||last<0) return true;
  return Math.abs(value-last)<=Math.max(5000,Math.abs(last)*.2);
}
function meterDecimalRules(m){
  var preferred=Number.isInteger(m.ocrDecimals)?m.ocrDecimals:2;
  return [preferred,0,1,2].filter(function(p,i,a){return a.indexOf(p)===i;});
}
function updateOcrProgress(message,progress){
  var text=document.getElementById('ocr_status'), bar=document.getElementById('ocr_bar');
  if(text) text.textContent=message;
  if(bar) bar.style.transform='scaleX('+Math.max(0,Math.min(1,progress||0))+')';
}
function applyOcrCandidate(value){
  var input=document.getElementById('rd_val');
  if(input){ input.value=value; previewReading(); }
}
async function scanMeterPhoto(input){
  var file=input.files&&input.files[0];
  if(!file) return;
  var result=document.getElementById('ocr_result');
  if(ocrPreviewUrl) URL.revokeObjectURL(ocrPreviewUrl);
  if(ocrWindowPreviewUrl) URL.revokeObjectURL(ocrWindowPreviewUrl);
  ocrPreviewUrl=URL.createObjectURL(file);
  result.innerHTML='<img class="ocr-preview" src="'+ocrPreviewUrl+'" alt="待识别的表计照片">'+
    '<div class="progress"><span id="ocr_bar"></span></div>'+
    '<p class="dim" id="ocr_status" style="margin:0">正在准备照片…</p>';
  var worker=null;
  try{
    var meter=pickMeter(window._addKind);
    var prepared=await prepareMeterImages(file,meter);
    var preview=prepared.filter(function(pass){return pass.preview;})[0];
    if(preview){
      ocrWindowPreviewUrl=URL.createObjectURL(preview.blob);
      result.querySelector('.ocr-preview').outerHTML=
        '<div class="ocr-window-review"><span>已定位的数字窗</span>'+
        '<img class="ocr-window-preview" src="'+ocrWindowPreviewUrl+'" alt="放大的表计数字窗">'+
        '<small>只录入黑色整数位，忽略右侧红色小数位</small></div>';
    }
    var T=await loadTesseract();
    worker=await T.createWorker('eng',1,{
      workerPath:'assets/vendor/tesseract/worker.min.js',
      workerBlobURL:false,
      corePath:'assets/vendor/tesseract/tesseract-core-lstm.wasm.js',
      langPath:'assets/vendor/tesseract/lang',
      logger:function(m){
      var labels={loading_tesseract_core:'加载识别引擎',initializing_tesseract:'初始化识别引擎',
        loading_language_traineddata:'加载数字模型',initializing_api:'准备识别',
        recognizing_text:'识别表盘数字'};
      updateOcrProgress(labels[m.status]||'正在识别',(m.progress||0)/prepared.length);
    }});
    await worker.setParameters({tessedit_char_whitelist:'0123456789., '});
    var recognitions=[];
    for(var pass=0;pass<prepared.length;pass++){
      updateOcrProgress('识别'+prepared[pass].label+' '+(pass+1)+' / '+prepared.length,
        pass/prepared.length);
      var psm=prepared[pass].mode==='word'
        ?(T.PSM&&T.PSM.SINGLE_WORD?T.PSM.SINGLE_WORD:'8')
        :(prepared[pass].mode==='char'
          ?(T.PSM&&T.PSM.SINGLE_CHAR?T.PSM.SINGLE_CHAR:'10')
        :(prepared[pass].mode==='raw'
          ?(T.PSM&&T.PSM.RAW_LINE?T.PSM.RAW_LINE:'13')
          :(T.PSM&&T.PSM.SPARSE_TEXT?T.PSM.SPARSE_TEXT:'11')));
      await worker.setParameters({tessedit_pageseg_mode:String(psm)});
      var recognized=await worker.recognize(prepared[pass].blob);
      recognitions.push({text:recognized.data.text,confidence:recognized.data.confidence,
        weight:prepared[pass].weight,trusted:prepared[pass].trusted});
    }
    await worker.terminate();
    worker=null;
    var rs=meterReadings(S.readings,meter.id), last=rs.length?rs[rs.length-1].value:NaN;
    var places=meterDecimalRules(meter);
    var candidates=rankMeterCandidates(recognitions,last,places,true);
    var safe=candidates.filter(function(candidate){return candidate.safeToFill;})[0];
    if(safe) applyOcrCandidate(safe.value);
    document.getElementById('ocr_status').textContent=safe
      ?'已填入数字窗读数，请对照放大图核对后保存'
      :(preview?'自动识别不够可靠，请对照放大图手动输入整数读数'
        :'没有定位到数字窗，请重拍近一点或手动输入');
    document.getElementById('ocr_bar').style.transform='scaleX(1)';
    var suggestions=candidates.filter(function(candidate){
      return candidate.plausible&&candidate.trustedHits>0;
    }).slice(0,4);
    if(suggestions.length) result.insertAdjacentHTML('beforeend',
      '<span class="ocr-suggestion-label">可能的读数，请先核对</span>'+
      '<div class="chips ocr-suggestions">'+suggestions.map(function(c){
        return '<button class="chip" onclick="applyOcrCandidate('+c.value+')">'+
          (Number.isInteger(c.value)?n0(c.value):n2(c.value))+'</button>';
      }).join('')+'</div>');
  }catch(e){
    updateOcrProgress('识别失败：'+e.message,0);
  }finally{
    if(worker) try{await worker.terminate();}catch(ignore){}
  }
}

function pickMeter(kind){
  var ms=S.meters.filter(function(m){return m.kind===kind;});
  if(!meterSel[kind] || !ms.some(function(m){return m.id===meterSel[kind];}))
    meterSel[kind]=ms.length?ms[0].id:null;
  return ms.filter(function(m){return m.id===meterSel[kind];})[0];
}
function setMeter(id){
  var m=S.meters.filter(function(x){return x.id===id;})[0];
  if(m){ meterSel[m.kind]=id; render(); }
}
function meterValueText(value){ return n0(Math.floor(Number(value)||0)); }
function energyExpiryState(m,now){
  if(!m.contractEndDate) return {label:'无固定到期',tone:'dim',days:null};
  var days=daysBetween(now||today(),m.contractEndDate);
  if(days<0) return {label:'已到期 '+Math.abs(days)+' 天',tone:'red',days:days};
  if(days<=60) return {label:days===0?'今天到期':days+' 天后到期',tone:'amber',days:days};
  return {label:days+' 天后到期',tone:'green',days:days};
}
function energyQuotaUnit(m){ return m.quotaUnit==='m3'?'m³':'kWh'; }
function meterReadingAt(readings,date){
  var rs=sortByDate(readings||[]);
  if(!rs.length||!isDate(date)) return null;
  if(date<=rs[0].date) return {value:Number(rs[0].value),date:rs[0].date,
    estimated:date!==rs[0].date,clamped:date!==rs[0].date};
  for(var i=0;i<rs.length;i++){
    if(rs[i].date===date) return {value:Number(rs[i].value),date:date,estimated:false,clamped:false};
    if(i&&rs[i].date>date){
      var before=rs[i-1],after=rs[i],span=daysBetween(before.date,after.date);
      var ratio=span>0?daysBetween(before.date,date)/span:0;
      return {value:Number(before.value)+(Number(after.value)-Number(before.value))*ratio,
        date:date,estimated:true,clamped:false};
    }
  }
  var last=rs[rs.length-1];
  return {value:Number(last.value),date:last.date,estimated:date!==last.date,clamped:date!==last.date};
}
function energyContractUsage(m,readings,now){
  if(!m.contractStartDate||!isDate(m.contractStartDate)) return null;
  var rs=sortByDate(readings||[]);
  if(!rs.length) return null;
  var end=now||today(),last=rs[rs.length-1];
  if(m.contractEndDate&&m.contractEndDate<end) end=m.contractEndDate;
  if(last.date<end) end=last.date;
  if(end<m.contractStartDate) return {used:0,netRaw:0,kwh:0,startDate:m.contractStartDate,
    endDate:end,estimatedStart:false,future:true};
  var manual=m.contractStartReading!=null&&m.contractStartReading!==''&&
    isFinite(Number(m.contractStartReading));
  var start=manual?{value:Number(m.contractStartReading),date:m.contractStartDate,
    estimated:false,clamped:false}:meterReadingAt(rs,m.contractStartDate);
  var finish=meterReadingAt(rs,end);
  if(!start||!finish) return null;
  var netRaw=finish.value-start.value,kwh=netRaw*Number(m.factor||1);
  return {used:m.quotaUnit==='m3'?netRaw:kwh,netRaw:netRaw,kwh:kwh,
    startDate:m.contractStartDate,endDate:end,startValue:start.value,endValue:finish.value,
    estimatedStart:!manual&&start.estimated,clampedStart:!manual&&start.clamped,
    manualStart:manual,future:false};
}
function energyQuotaUsage(m,usage){ return usage?Number(usage.used)||0:0; }
function energyPlanCard(m,readings){
  var expiry=energyExpiryState(m), quota=Number(m.annualQuota)||0;
  var usage=energyContractUsage(m,readings),used=energyQuotaUsage(m,usage);
  var remaining=quota-used,quotaUnit=energyQuotaUnit(m);
  var range=m.contractStartDate?(fmtDate(m.contractStartDate)+' → '+
    (m.contractEndDate?fmtDate(m.contractEndDate):'无固定结束日')):'尚未填写合同开始日';
  var quotaHtml=quota>0&&m.contractStartDate
    ? '<div class="energy-quota"><div class="between"><span class="dim">合同周期购买额度</span><b class="tnum">'+
        n0(used)+' / '+n0(quota)+' '+quotaUnit+'</b></div><div class="quota-track"><span style="width:'+
        Math.max(0,Math.min(100,used/quota*100)).toFixed(1)+'%"></span></div><span class="dim">'+
        (remaining>=0?'剩余 ':'超出 ')+n0(Math.abs(remaining))+' '+quotaUnit+'</span>'+
        '<span class="dim">'+range+(usage?(' · 统计至 '+fmtDate(usage.endDate)):'')+'</span>'+
        (usage&&usage.estimatedStart?'<span class="c-amber">合同起始读数按相邻抄表估算，可在编辑中填写准确读数。</span>':'')+
        (used<0?'<span class="c-green">净回送 '+n0(Math.abs(used))+' '+quotaUnit+
          '，因此剩余额度高于合同额度。</span>':'')+
        '<span class="dim">额度仅按净用量计算，不受正电价或负电价影响。</span></div>'
    : quota>0
      ? '<p class="dim energy-plan-empty">请填写合同开始日后计算合同剩余额度。</p>'
      : '<p class="dim energy-plan-empty">尚未填写合同周期购买额度。</p>';
  return card(h2('能源合同',badge(expiry.label,expiry.tone))+
    '<div class="stats energy-contract-stats">'+stat('运营商',esc(m.provider||'待填写'),'')+
      stat('合同开始',m.contractStartDate?fmtDate(m.contractStartDate):'待填写','')+
      stat('合同到期',m.contractEndDate?fmtDate(m.contractEndDate):'无固定期限','')+
      stat('每月预缴',n2(Number(m.monthlyAbschlag)||0),'€','gold')+
      stat('单位价格',n2(Number(m.arbeitspreisCt)||0),'ct/kWh')+'</div>'+quotaHtml+
    btn('编辑合同与资费',"editTarif('"+m.id+"')",'ghost','pencil-simple'));
}

function parseEcbFxCsv(text){
  var rows=parseDelimited(text,',');
  if(rows.length<2) throw new Error('ECB 返回的数据为空');
  var header=rows[0].map(function(x){return String(x).replace(/^\uFEFF/,'').trim();});
  var dateCol=header.indexOf('TIME_PERIOD'), rateCol=header.indexOf('OBS_VALUE');
  if(dateCol<0||rateCol<0) throw new Error('ECB 返回的数据格式无法识别');
  for(var i=rows.length-1;i>0;i--){
    var date=String(rows[i][dateCol]||'').trim(), rate=Number(rows[i][rateCol]);
    if(isDate(date)&&isFinite(rate)&&rate>0) return {date:date,rate:rate};
  }
  throw new Error('ECB 返回的数据没有有效汇率');
}
async function fetchOfficialFx(){
  officialFxLoading=true; officialFxError=''; renderOfficialFx();
  try{
    if(navigator.onLine===false) throw new Error('当前离线，仍可使用已保存的汇率');
    var response=await fetch(ECB_FX_URL,{cache:'no-store'});
    if(!response.ok) throw new Error('ECB 服务暂时不可用');
    officialFxQuote=parseEcbFxCsv(await response.text());
  }catch(e){
    officialFxQuote=null;
    officialFxError=e.message||'无法获取官方汇率';

  officialFxLoading=false; renderOfficialFx();

}

var RETIREMENT_TARGET=1000000;
var RETIREMENT_MILESTONE=100000;
var RETIREMENT_TAP_WINDOW=2500;
var RETIREMENT_ASSET_TYPES={
  deposit:{label:'固定存款',rate:0},
  stock:{label:'股票 / ETF',rate:null},
  gold:{label:'黄金',rate:2},
  rental:{label:'租金 / 房产',rate:1},
  other:{label:'其他资产',rate:0}
};
var retirementCelebrationTimer=null;

function retirementDefaultPlan(){
  return {
    accountIds:null,
    contributionMode:'auto',
    manualMonthlyContribution:1500,
    selectedScenario:'base',
    rates:{conservative:3,base:5,optimistic:7},
    assetConfigs:{},
    milestone:{highestReached:0,active:0,remainingUnlocks:0}
  };
}
function retirementInferAssetType(account){
  var text=((account&&account.name)||'')+' '+((account&&account.note)||'');
  text=text.toLowerCase();
  if(/etf|股票|aktien|depot|stock|fonds|fund/.test(text)) return 'stock';
  if(/黄金|gold/.test(text)) return 'gold';
  if(/租金|房租|miete|immobil|房产/.test(text)) return 'rental';
  if(/定期|存款|储蓄|saving|spar|deposit|银行|bank|ing|cmb|招商|boc/.test(text)) return 'deposit';
  return 'other';
}
function retirementDefaultAssetConfig(account){
  var type=retirementInferAssetType(account);
  return {type:type,annualRate:RETIREMENT_ASSET_TYPES[type].rate||0,
    manualMonthlyContribution:null};
}
function retirementPlanState(){
  var d=retirementDefaultPlan(), p=S.retirementPlan||{}, rates=p.rates||{},
    milestone=p.milestone||{}, savedConfigs=p.assetConfigs||{};
  var validIds=S.accounts.map(function(a){return a.id;});
  var accountIds=Array.isArray(p.accountIds)
    ? p.accountIds.filter(function(id){return validIds.indexOf(id)>=0;}) : null;
  if(accountIds&&accountIds.length===0) accountIds=null;
  var assetConfigs={};
  S.accounts.forEach(function(account){
    var fallback=retirementDefaultAssetConfig(account), saved=savedConfigs[account.id]||{};
    var type=RETIREMENT_ASSET_TYPES[saved.type]?saved.type:fallback.type;
    assetConfigs[account.id]={
      type:type,
      annualRate:isFinite(saved.annualRate)
        ? Math.max(0,Math.min(20,Number(saved.annualRate)))
        : (RETIREMENT_ASSET_TYPES[type].rate||0),
      manualMonthlyContribution:saved.manualMonthlyContribution!=null&&
        saved.manualMonthlyContribution!==''&&isFinite(saved.manualMonthlyContribution)&&
        Number(saved.manualMonthlyContribution)>=0
        ? Number(saved.manualMonthlyContribution):null
    };
  });
  S.retirementPlan={
    accountIds:accountIds,
    contributionMode:p.contributionMode==='manual'?'manual':'auto',
    manualMonthlyContribution:isFinite(p.manualMonthlyContribution)&&p.manualMonthlyContribution>=0
      ? Number(p.manualMonthlyContribution):d.manualMonthlyContribution,
    selectedScenario:['conservative','base','optimistic'].indexOf(p.selectedScenario)>=0
      ? p.selectedScenario:d.selectedScenario,
    rates:{
      conservative:isFinite(rates.conservative)?Number(rates.conservative):d.rates.conservative,
      base:isFinite(rates.base)?Number(rates.base):d.rates.base,
      optimistic:isFinite(rates.optimistic)?Number(rates.optimistic):d.rates.optimistic
    },
    assetConfigs:assetConfigs,
    milestone:{
      highestReached:isFinite(milestone.highestReached)?Number(milestone.highestReached):0,
      active:isFinite(milestone.active)?Number(milestone.active):0,
      remainingUnlocks:isFinite(milestone.remainingUnlocks)
        ? Math.max(0,Math.min(5,Math.floor(milestone.remainingUnlocks))):0
    }
  };
  return S.retirementPlan;
}
function retirementAccountIds(plan){
  return plan.accountIds&&plan.accountIds.length
    ? plan.accountIds.slice() : S.accounts.map(function(a){return a.id;});
}
function retirementPool(plan){
  var ids=retirementAccountIds(plan), fx=S.fxRmbPerEur>0?S.fxRmbPerEur:1;
  var items=S.accounts.filter(function(a){return ids.indexOf(a.id)>=0;}).map(function(a){
    var balance=accountBalance(S.txs,a.id);
    return {account:a,balance:balance,eur:a.currency==='EUR'?balance:balance/fx};
  });
  return {items:items,total:items.reduce(function(sum,item){return sum+item.eur;},0)};
}
function retirementMonthKey(offset,from){
  var p=String(from||today()).slice(0,7).split('-');
  var total=Number(p[0])*12+Number(p[1])-1+Number(offset||0);
  var year=Math.floor(total/12), month=total-year*12+1;
  return year+'-'+String(month).padStart(2,'0');
}
function retirementAutoContributions(plan){
  var ids=retirementAccountIds(plan);
  var accountMap={}, out={};
  S.accounts.forEach(function(a){accountMap[a.id]=a;});
  ids.forEach(function(id){out[id]=0;});
  var fx=S.fxRmbPerEur>0?S.fxRmbPerEur:1;
  var start=retirementMonthKey(-12), end=retirementMonthKey(-1);
  var hasHistory=S.txs.some(function(t){
    var month=String(t.date||'').slice(0,7);
    return ids.indexOf(t.accountId)>=0&&!t.valuationOnly&&month>=start&&month<=end;
  });
  if(!hasHistory){
    var fallback=Number(S.budget&&S.budget.sparZiel)||0;
    var fallbackId=ids.filter(function(id){
      return plan.assetConfigs[id]&&plan.assetConfigs[id].type==='stock';
    })[0]||ids[0];
    if(fallbackId) out[fallbackId]=fallback;
    return out;
  }
  var raw={};
  ids.forEach(function(id){raw[id]=0;});
  S.txs.forEach(function(t){
    var month=String(t.date||'').slice(0,7);
    if(ids.indexOf(t.accountId)<0||t.valuationOnly||month<start||month>end) return;
    var account=accountMap[t.accountId], amount=Number(t.amount||0);
    raw[t.accountId]+=(account&&account.currency==='RMB'?amount/fx:amount);
  });
  var total=ids.reduce(function(sum,id){return sum+raw[id];},0);
  var direction=total>=0?1:-1;
  var distributable=ids.reduce(function(sum,id){
    return sum+(raw[id]*direction>0?Math.abs(raw[id]):0);
  },0);
  if(distributable>0){
    ids.forEach(function(id){
      out[id]=raw[id]*direction>0
        ? (total*Math.abs(raw[id])/distributable/12):0;
    });
  }
  return out;
}
function retirementAutoContribution(plan){
  var byAccount=retirementAutoContributions(plan);
  return Object.keys(byAccount).reduce(function(sum,id){return sum+byAccount[id];},0);
}
function retirementManualContributions(plan){
  var auto=retirementAutoContributions(plan), out={}, ids=retirementAccountIds(plan);
  var hasExplicit=ids.some(function(id){
    var value=(plan.assetConfigs[id]||{}).manualMonthlyContribution;
    return value!=null&&value!==''&&isFinite(value);
  });
  if(!hasExplicit){
    var legacyTotal=Math.max(0,Number(plan.manualMonthlyContribution)||0);
    var autoTotal=ids.reduce(function(sum,id){return sum+Math.max(0,auto[id]||0);},0);
    if(autoTotal>0){
      ids.forEach(function(id){
        out[id]=legacyTotal*Math.max(0,auto[id]||0)/autoTotal;
      });
    }else{
      ids.forEach(function(id){out[id]=0;});
      var fallbackId=ids.filter(function(id){
        return plan.assetConfigs[id]&&plan.assetConfigs[id].type==='stock';
      })[0]||ids[0];
      if(fallbackId) out[fallbackId]=legacyTotal;
    }
    return out;
  }
  ids.forEach(function(id){
    var config=plan.assetConfigs[id]||{};
    out[id]=config.manualMonthlyContribution!=null&&
      config.manualMonthlyContribution!==''&&isFinite(config.manualMonthlyContribution)
      ? Number(config.manualMonthlyContribution):Math.max(0,auto[id]||0);
  });
  return out;
}
function retirementContributions(plan){
  return plan.contributionMode==='manual'
    ? retirementManualContributions(plan):retirementAutoContributions(plan);
}
function retirementMonthlyContribution(plan){
  var values=retirementContributions(plan);
  return Object.keys(values).reduce(function(sum,id){return sum+values[id];},0);
}
function retirementMonthsToTarget(current,monthly,annualPct,target){
  return retirementAssetsMonthsToTarget([{
    balance:Number(current),monthly:Number(monthly),rate:Number(annualPct),type:'other'
  }],target||RETIREMENT_TARGET);
}
function retirementBalanceAfter(current,monthly,annualPct,months){
  var rate=Number(annualPct)/100/12, balance=Number(current), contribution=Number(monthly);
  if(!rate) return balance+contribution*months;
  var growth=Math.pow(1+rate,months);
  return balance*growth+contribution*(growth-1)/rate;
}
function retirementAssetRate(plan,accountId,scenario){
  var config=plan.assetConfigs[accountId]||{};
  return config.type==='stock'?plan.rates[scenario]:Number(config.annualRate||0);
}
function retirementProjectionAssets(plan,pool,scenario){
  var contributions=retirementContributions(plan);
  return pool.items.map(function(item){
    var config=plan.assetConfigs[item.account.id]||retirementDefaultAssetConfig(item.account);
    return {
      accountId:item.account.id,
      balance:item.eur,
      monthly:Number(contributions[item.account.id]||0),
      rate:retirementAssetRate(plan,item.account.id,scenario),
      type:config.type
    };
  });
}
function retirementAssetsBalanceAfter(assets,months){
  return assets.reduce(function(sum,asset){
    return sum+retirementBalanceAfter(asset.balance,asset.monthly,asset.rate,months);
  },0);
}
function retirementAssetsMonthsToTarget(assets,target){
  target=target||RETIREMENT_TARGET;
  assets=assets.map(function(asset){
    return {
      balance:Number(asset.balance),monthly:Number(asset.monthly),rate:Number(asset.rate),
      type:asset.type
    };
  });
  if(assets.some(function(asset){
    return !isFinite(asset.balance)||!isFinite(asset.monthly)||!isFinite(asset.rate);
  })) return null;
  var current=retirementAssetsBalanceAfter(assets,0);
  if(current>=target) return 0;
  var monotonic=assets.every(function(asset){
    return asset.balance>=0&&asset.monthly>=0&&asset.rate>=0;
  });
  if(monotonic){
    var canGrow=assets.some(function(asset){
      return asset.monthly>0||(asset.balance>0&&asset.rate>0);
    });
    if(!canGrow) return null;
    var low=0, high=1, highBalance=retirementAssetsBalanceAfter(assets,high);
    while(highBalance<target&&high<134217728){
      low=high; high*=2;
      highBalance=retirementAssetsBalanceAfter(assets,high);
    }
    if(highBalance<target) return null;
    while(low+1<high){
      var middle=Math.floor((low+high)/2);
      if(retirementAssetsBalanceAfter(assets,middle)>=target) high=middle;
      else low=middle;
    }
    return high;
  }
  var simulated=assets.map(function(asset){return Object.assign({},asset);});
  for(var month=1;month<=12000;month++){
    current=0;
    simulated.forEach(function(asset){
      asset.balance=asset.balance*(1+asset.rate/100/12)+asset.monthly;
      current+=asset.balance;
    });
    if(!isFinite(current)||current < -target*10) return null;
    if(current>=target) return month;
  }
  return null;
}
function retirementProjectionSeries(assets,months){
  if(months==null||months<=0) return [];
  var out=[{date:retirementMonthKey(0),value:retirementAssetsBalanceAfter(assets,0)}];
  var step=Math.max(12,Math.ceil(months/72/12)*12);
  for(var m=step;m<months;m+=step)
    out.push({date:retirementMonthKey(m),value:retirementAssetsBalanceAfter(assets,m)});
  out.push({date:retirementMonthKey(months),
    value:retirementAssetsBalanceAfter(assets,months)});
  return out;
}
function retirementEmptyTypeValues(){
  return {deposit:0,stock:0,gold:0,rental:0,other:0};
}
function retirementTypeValuesTotal(values){
  return Object.keys(values).reduce(function(sum,type){return sum+values[type];},0);
}
function retirementProjectionBreakdown(assets,months){
  if(months==null||months<=0) return [];
  var offsets=[0], step=Math.max(12,Math.ceil(months/72/12)*12);
  for(var m=step;m<months;m+=step) offsets.push(m);
  offsets.push(months);
  return offsets.map(function(offset){
    var values=retirementEmptyTypeValues();
    assets.forEach(function(asset){
      values[asset.type]=(values[asset.type]||0)+
        retirementBalanceAfter(asset.balance,asset.monthly,asset.rate,offset);
    });
    return {
      date:retirementMonthKey(offset),value:retirementTypeValuesTotal(values),
      values:values,phase:offset===0?'actual':'forecast',today:offset===0
    };
  });
}
function retirementHistoricalBreakdown(plan){
  var ids=retirementAccountIds(plan), accountMap={}, fx=S.fxRmbPerEur>0?S.fxRmbPerEur:1;
  S.accounts.forEach(function(account){accountMap[account.id]=account;});
  return [-60,-48,-36,-24,-12,0].map(function(offset){
    var month=retirementMonthKey(offset), cutoff=offset===0?today():month+'-31';
    var balances={}, values=retirementEmptyTypeValues();
    ids.forEach(function(id){balances[id]=0;});
    S.txs.forEach(function(tx){
      if(ids.indexOf(tx.accountId)>=0&&String(tx.date||'')<=cutoff)
        balances[tx.accountId]+=Number(tx.amount||0);
    });
    ids.forEach(function(id){
      var account=accountMap[id], config=plan.assetConfigs[id]||retirementDefaultAssetConfig(account);
      var value=account&&account.currency==='RMB'?balances[id]/fx:balances[id];
      values[config.type]=(values[config.type]||0)+value;
    });
    return {
      date:offset===0?retirementMonthKey(0):month,
      value:retirementTypeValuesTotal(values),values:values,phase:'actual',today:offset===0
    };
  });
}
function retirementMonthsBetweenKeys(from,to){
  var a=String(from).slice(0,7).split('-'), b=String(to).slice(0,7).split('-');
  return (Number(b[0])-Number(a[0]))*12+Number(b[1])-Number(a[1]);
}
function retirementGrowthChart(plan,assets,months){
  var forecast=retirementProjectionBreakdown(assets,months);
  if(forecast.length<2) return '<p class="dim">数据不足</p>';
  var history=retirementHistoricalBreakdown(plan);
  var data=history.concat(forecast.slice(1));
  var colors={
    deposit:'var(--blue)',stock:'var(--green)',gold:'var(--amber)',
    rental:'var(--red)',other:'var(--dim)',total:'var(--tx)'
  };
  var series=Object.keys(RETIREMENT_ASSET_TYPES).filter(function(type){
    return data.some(function(point){return Math.abs(point.values[type]||0)>.001;});
  }).map(function(type){
    return {key:type,label:RETIREMENT_ASSET_TYPES[type].label,color:colors[type]};
  });
  series.push({key:'total',label:'合计',color:colors.total});
  var scaleValues=[];
  data.forEach(function(point){
    scaleValues.push(point.value);
    Object.keys(point.values).forEach(function(type){scaleValues.push(point.values[type]);});
  });
  var scale=chartScale(scaleValues), top=18,bottom=6,span=scale.max-scale.min;
  var firstDate=data[0].date, totalMonths=Math.max(1,
    retirementMonthsBetweenKeys(firstDate,data[data.length-1].date));
  var X=function(date){
    return 2+retirementMonthsBetweenKeys(firstDate,date)/totalMonths*(CW-4);
  };
  var Y=function(value){return top+((scale.max-value)/span)*(CH-top-bottom);};
  var points=data.map(function(point){
    return {x:X(point.date),y:Y(point.value),value:point.value,date:point.date,color:colors.total};
  });
  var todayIndex=data.findIndex(function(point){return point.today;});
  var marks=series.map(function(item){
    function pathFor(start,end){
      return data.slice(start,end).map(function(point,i){
        var value=item.key==='total'?point.value:(point.values[item.key]||0);
        return (i?'L':'M')+X(point.date).toFixed(1)+','+Y(value).toFixed(1);
      }).join(' ');
    }
    return '<path class="retirement-series-line actual" data-series-line="'+item.key+
      '-actual" d="'+pathFor(0,todayIndex+1)+'" stroke="'+item.color+
      '" stroke-width="'+(item.key==='total'?'2.8':'1.8')+
      '" fill="none" opacity="'+(item.key==='total'?'1':'.88')+
      '" vector-effect="non-scaling-stroke"/>'+
      '<path class="retirement-series-line forecast" data-series-line="'+item.key+
      '-forecast" d="'+pathFor(todayIndex,data.length)+'" stroke="'+item.color+
      '" stroke-width="'+(item.key==='total'?'2.8':'1.8')+
      '" fill="none" opacity="'+(item.key==='total'?'1':'.88')+
      '" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>';
  }).join('');
  var todayX=X(data[todayIndex].date).toFixed(1);
  marks+='<line class="retirement-today-line" x1="'+todayX+'" y1="0" x2="'+todayX+
    '" y2="'+CH+'" vector-effect="non-scaling-stroke"/>';
  var id='chart-'+(++chartSeq);
  chartStore[id]={
    id:id,data:data,points:points,selected:todayIndex,color:colors.total,
    fmt:function(value){return n0(value)+' €';},unit:'€',
    label:'退休资产分类增长路径',series:series
  };
  return '<div class="retirement-phase-key" aria-label="实线为已记录资产，虚线为未来估算">'+
    '<span><i class="actual"></i>已记录</span><span><i class="forecast"></i>未来估算</span></div>'+
    chartMarkup(chartStore[id],marks,scale,Y,1,true);
}
function retirementYearsText(months){
  if(months==null) return '无法达到';
  if(months===0) return '已经达到';
  return (months/12).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})+' 年';
}
function retirementDateText(months){
  if(months==null) return '—';
  if(months===0) return '现在';
  var p=retirementMonthKey(months).split('-');
  return p[1]+'.'+p[0];
}

function retirementMilestoneProgress(total){
  var safe=Math.max(0,total), reached=Math.min(10,Math.floor(safe/RETIREMENT_MILESTONE));
  return '<div class="retirement-milestones" aria-label="已完成 '+reached+' 个十万欧元里程碑">'+
    Array.from({length:10},function(_,i){
      return '<span class="'+(i<reached?'done':(i===reached?'next':''))+'"></span>';
    }).join('')+'</div>';
}
function viewRetirement(){
  var plan=retirementPlanState(), pool=retirementPool(plan);
  var monthly=retirementMonthlyContribution(plan), rates=plan.rates;
  var scenario=plan.selectedScenario, scenarioMeta=retirementScenarioMeta(scenario);
  var scenarioAssets=retirementProjectionAssets(plan,pool,scenario);
  var scenarioMonths=retirementAssetsMonthsToTarget(
    retirementProjectionAssets(plan,pool,scenario),RETIREMENT_TARGET);
  var scenarioEndValue=scenarioMonths==null?null:
    retirementAssetsBalanceAfter(scenarioAssets,scenarioMonths);
  var progress=Math.max(0,Math.min(100,pool.total/RETIREMENT_TARGET*100));
  var gap=Math.max(0,RETIREMENT_TARGET-pool.total);
  var next=Math.min(RETIREMENT_TARGET,
    (Math.floor(Math.max(0,pool.total)/RETIREMENT_MILESTONE)+1)*RETIREMENT_MILESTONE);
  var nextGap=Math.max(0,next-pool.total), out='';

  out+='<section class="retirement-heading"><div>'+
    '<button class="retirement-back" onclick="go(\'save\')" aria-label="返回储蓄" title="返回储蓄">'+
      icon('arrow-left')+'</button>'+
    '<div><span class="dim">仅在金库深处可见</span><h1>秘密退休计划</h1></div></div>'+
    btn('调整计划','editRetirementPlan()','ghost sm','sliders-horizontal')+'</section>';

  out+=card('<div class="between"><span class="dim">100 万欧元目标</span>'+
      '<span class="retirement-target-badge">'+
        badge(scenarioMeta.label+' · '+(scenarioMonths==null?'无法达到':
          retirementDateText(scenarioMonths)),scenarioMeta.tone)+'</span></div>'+
    retirementScenarioControl(plan)+
    '<div class="retirement-scenario-result">'+
    '<span class="retirement-date '+(scenarioMonths==null?'c-red':'c-'+scenarioMeta.tone)+'">'+
      esc(retirementYearsText(scenarioMonths))+'</span>'+
    '<span class="dim">'+(scenarioMonths==null
      ? '按当前投入和所选收益率无法达到'
      : (scenarioMonths===0?'目标已经完成':
        scenarioMeta.label+'情景预计 '+retirementDateText(scenarioMonths)+' 达到 · 首次跨过时 '+
          n0(scenarioEndValue)+' €'))+'</span></div>'+
    '<div class="between retirement-progress-label"><span class="dim">当前资产进度</span>'+
      '<strong class="tnum">'+progress.toLocaleString('de-DE',{maximumFractionDigits:1})+'%</strong></div>'+
    '<div class="retirement-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" '+
      'aria-valuenow="'+progress.toFixed(1)+'"><span style="width:'+progress.toFixed(2)+'%"></span></div>'+
    '<div class="stats retirement-summary-stats">'+
      stat('当前资金',n0(pool.total),'€','green')+
      stat('距离目标',n0(gap),'€',gap?'':'green')+
      stat(plan.contributionMode==='auto'?'近12月月均':'计划月投',
        n0(monthly),'€',monthly>=0?'blue':'red')+
    '</div>',scenarioMeta.tone);

  var series=retirementProjectionBreakdown(scenarioAssets,scenarioMonths);
  out+=card(h2(scenarioMeta.label+'增长路径',
      badge('股票 '+fxText(rates[scenario])+'%',scenarioMeta.tone))+
    (series.length>1
      ? retirementGrowthChart(plan,scenarioAssets,scenarioMonths)
      : '<p class="empty">'+(scenarioMonths===0?'目标已经达到':'当前设置无法生成达到目标的路径')+'</p>'));

  var contributions=retirementContributions(plan);
  out+=card(h2('退休资金池',badge(pool.items.length+' 个账户','dim'))+
    pool.items.map(function(item){
      var config=plan.assetConfigs[item.account.id]||retirementDefaultAssetConfig(item.account);
      var rate=config.type==='stock'
        ? '股票三档收益率'
        : '固定年化 '+fxText(config.annualRate)+'%';
      var sub=RETIREMENT_ASSET_TYPES[config.type].label+' · '+rate+
        ' · 月投入 '+n2(contributions[item.account.id]||0)+' €';
      if(item.account.currency==='RMB') sub+=' · '+money(item.balance,'RMB')+' 折算';
      return row({label:item.account.name,sub:sub,value:n2(item.eur)+' €',
        tone:item.eur<0?'red':''});
    }).join(''));

  out+=card(h2('下一个里程碑',badge(next>=RETIREMENT_TARGET?'最终目标':n0(next)+' €','blue'))+
    retirementMilestoneProgress(pool.total)+
    row({label:pool.total>=RETIREMENT_TARGET?'100 万欧元目标已完成':'距离 '+n0(next)+' €',
      sub:'每跨过 10 万欧元，即完成一个新的退休里程碑',
      value:pool.total>=RETIREMENT_TARGET?'完成':n0(nextGap)+' €',
      tone:pool.total>=RETIREMENT_TARGET?'green':'blue'}));

  out+='<p class="dim retirement-disclaimer">各类资产独立计算后汇总。预测使用名义金额，不包含通胀、税费或养老金收入。</p>';
  return out;
}

function saveRetirementPlan(){
  var accountRows=Array.prototype.slice.call(
    document.querySelectorAll('[data-retirement-account]'));
  var ids=[], configs={}, manualTotal=0, invalidRate=false, invalidMonthly=false;
  accountRows.forEach(function(accountRow,i){
    var id=accountRow.getAttribute('data-retirement-account');
    var checked=document.getElementById('rp_acc_'+i).checked;
    var type=val('rp_type_'+i), rate=fnum('rp_asset_rate_'+i);
    var monthly=fnum('rp_monthly_'+i);
    if(checked) ids.push(id);
    if(type!=='stock'&&(!isFinite(rate)||rate<0||rate>20)) invalidRate=true;
    if(val('rp_mode')==='manual'&&checked&&(!isFinite(monthly)||monthly<0)) invalidMonthly=true;
    configs[id]={
      type:RETIREMENT_ASSET_TYPES[type]?type:'other',
      annualRate:type==='stock'?0:rate,
      manualMonthlyContribution:isFinite(monthly)&&monthly>=0?monthly:null
    };
    if(checked&&isFinite(monthly)&&monthly>=0) manualTotal+=monthly;
  });
  if(!ids.length) return toast('请至少选择一个退休资金账户');
  var mode=val('rp_mode');
  var low=fnum('rp_rate_low'), base=fnum('rp_rate_base'), high=fnum('rp_rate_high');
  if(invalidMonthly) return toast('请输入有效的账户每月投入');
  if(invalidRate) return toast('固定收益率应在 0%–20% 之间');
  if(![low,base,high].every(function(rate){return isFinite(rate)&&rate>=0&&rate<=20;}))
    return toast('收益率应在 0%–20% 之间');
  if(!(low<=base&&base<=high)) return toast('收益率应按保守、基准、乐观递增');
  var plan=retirementPlanState();
  plan.accountIds=ids;
  plan.contributionMode=mode==='manual'?'manual':'auto';
  if(mode==='manual') plan.manualMonthlyContribution=manualTotal;
  plan.rates={conservative:low,base:base,optimistic:high};
  plan.assetConfigs=configs;
  save(); closeSheet(); render(); toast('退休计划已加密保存');
}

function couponSafeImage(image){

function loadJsQr(){

    };

    document.head.appendChild(script);
  });

}
function loadZxingQr(){
  if(window.ZXingBrowser&&window.ZXingBrowser.BrowserQRCodeReader)
    return Promise.resolve(window.ZXingBrowser);
  if(zxingQrLoader) return zxingQrLoader;
  zxingQrLoader=new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src='assets/vendor/zxing/zxing-browser.min.js';

      if(window.ZXingBrowser&&window.ZXingBrowser.BrowserQRCodeReader) resolve(window.ZXingBrowser);
      else reject(new Error('ZXing 二维码组件未正确加载'));
    };

    document.head.appendChild(script);
  });
  return zxingQrLoader;
}
function couponQrRegions(){
  return [
    {x:0,y:0,w:1,h:1,maxSide:2200},
    {x:0,y:0,w:.58,h:.58,maxSide:1600},
    {x:.42,y:0,w:.58,h:.58,maxSide:1600},
    {x:0,y:.42,w:.58,h:.58,maxSide:1600},
    {x:.42,y:.42,w:.58,h:.58,maxSide:1600}
  ];
}
function couponQrCanvas(source,region){
  var sx=Math.round(source.width*region.x),sy=Math.round(source.height*region.y);
  var sw=Math.max(1,Math.round(source.width*region.w));
  var sh=Math.max(1,Math.round(source.height*region.h));
  var scale=Math.min(1,region.maxSide/Math.max(sw,sh));
  var canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(sw*scale)); canvas.height=Math.max(1,Math.round(sh*scale));
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.drawImage(source,sx,sy,sw,sh,0,0,canvas.width,canvas.height);
  return canvas;
}
async function couponDecodeCanvas(canvas){
  var zxingError=null,jsQrError=null;
  try{
    var zxing=await loadZxingQr();
    var result=new zxing.BrowserQRCodeReader().decodeFromCanvas(canvas);
    if(result&&result.getText()) return String(result.getText());
  }catch(e){ zxingError=e; }
  try{
    var decoder=await loadJsQr(),ctx=canvas.getContext('2d',{willReadFrequently:true});
    var pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
    var fallback=decoder(pixels.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});
    if(fallback&&fallback.data) return String(fallback.data);
  }catch(e){ jsQrError=e; }
  if(zxingError&&jsQrError) throw new Error('二维码组件暂时不可用');
  return '';
}
async function couponDecodeSource(source){
  var regions=couponQrRegions();
  for(var i=0;i<regions.length;i++){
    var canvas=couponQrCanvas(source,regions[i]);
    try{
      var value=await couponDecodeCanvas(canvas);
      if(value) return value;
    }finally{ canvas.width=canvas.height=1; }
  }
  return '';
}

function couponCanvasBlob(canvas,quality){
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('图片压缩失败'));},'image/jpeg',quality);
  });
}
function couponBlobDataUrl(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){resolve(reader.result);};
    reader.onerror=function(){reject(new Error('无法保存图片'));};
    reader.readAsDataURL(blob);
  });
}
async function couponPrepareImage(file){
  if(!file||!/^image\//.test(file.type||'')) throw new Error('请选择图片文件');
  if(file.size>25*1024*1024) throw new Error('原图超过 25 MB，请先裁剪');
  var loaded=await loadMeterImage(file), source=loaded.source;
  try{
    var qr='',qrError='';
    try{ qr=await couponDecodeSource(source); }
    catch(e){ qrError=e.message||'二维码识别组件未能运行'; }
    var scale=Math.min(1,1600/Math.max(source.width,source.height));
    var canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(source.width*scale));
    canvas.height=Math.max(1,Math.round(source.height*scale));
    var ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(source,0,0,canvas.width,canvas.height);
    var quality=.8, blob=await couponCanvasBlob(canvas,quality);
    while(blob.size>280000&&quality>.48){
      quality-=.08; blob=await couponCanvasBlob(canvas,quality);
    }
    while(blob.size>280000&&canvas.width>900&&canvas.height>900){
      var smaller=document.createElement('canvas');
      smaller.width=Math.round(canvas.width*.84); smaller.height=Math.round(canvas.height*.84);
      smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);
      canvas=smaller; blob=await couponCanvasBlob(canvas,.56);
    }
    if(blob.size>300000) throw new Error('图片压缩后仍过大，请先裁剪后重试');
    return {image:{dataUrl:await couponBlobDataUrl(blob),width:canvas.width,height:canvas.height,
      byteSize:blob.size,addedDate:today()},qr:qr,qrError:qrError};
  }finally{ loaded.cleanup(); }
}

    if(days<=30) return {key:'soon',label:days===0?'今天到期':days+' 天后到期',tone:'amber',days:days};

function debtRecordState(debt,now){
  now=now||today();
  if(debt.settledDate) return {key:'settled',label:'已结清',tone:'dim',days:null};
  if(debt.dueDate){
    var days=daysBetween(now,debt.dueDate);
    if(days<0) return {key:'overdue',label:'逾期 '+Math.abs(days)+' 天',tone:'red',days:days};
    if(days<=30) return {key:'due',label:days===0?'今天到期':days+' 天后到期',tone:'amber',days:days};
    return {key:'open',label:days+' 天后到期',tone:'blue',days:days};
  }
  return {key:'open',label:'待结清',tone:'blue',days:null};
}
function debtAttentionItems(){
  return (S.debts||[]).filter(function(debt){
    return ['overdue','due'].indexOf(debtRecordState(debt).key)>=0;
  }).sort(function(a,b){return a.dueDate<b.dueDate?-1:1;});
}
function debtOutstandingSummary(){
  return (S.debts||[]).filter(function(debt){return !debt.settledDate;})
    .reduce(function(out,debt){
      var amount=recordAmountEur(debt.amount,debt.currency||'EUR');
      if(debt.direction==='receivable') out.receivable+=amount;
      else out.payable+=amount;
      out.count++;
      return out;
    },{payable:0,receivable:0,count:0});
}
function setDebtFilter(value){
  debtFilter=['open','overdue','settled','all'].indexOf(value)>=0?value:'open';
  render();
}
function viewDebts(embedded){
  var all=S.debts||[],summary=debtOutstandingSummary(),attention=debtAttentionItems();
  var list=all.filter(function(debt){
    var key=debtRecordState(debt).key;
    if(debtFilter==='open') return key!=='settled';
    return debtFilter==='all'||key===debtFilter;
  }).sort(function(a,b){
    var rank={overdue:0,due:1,open:2,settled:3};
    var ar=rank[debtRecordState(a).key],br=rank[debtRecordState(b).key];
    if(ar!==br) return ar-br;
    var ad=a.dueDate||a.startDate||'9999-12-31',bd=b.dueDate||b.startDate||'9999-12-31';
    return ad<bd?-1:ad>bd?1:0;
  });
  var out=(embedded?recordSectionHeading:recordHeading)('欠款','应还、应收与结清状态','editDebt()');
  out+=card('<div class="stats debt-summary-stats">'+stat('我应还',n2(summary.payable),'€',summary.payable?'red':'dim')+
    stat('我应收',n2(summary.receivable),'€',summary.receivable?'green':'dim')+
    stat('净应收',n2(summary.receivable-summary.payable),'€',
      summary.receivable-summary.payable>=0?'green':'red',summary.count+' 笔未结清')+'</div>','blue');
  out+=chips([
    {k:'open',label:'未结清'},{k:'overdue',label:'已逾期'},
    {k:'settled',label:'已结清'},{k:'all',label:'全部'}
  ],debtFilter,'setDebtFilter');
  if(!list.length) out+='<div class="card record-empty"><p class="empty">'+
    (all.length?'这个筛选下没有欠款':'还没有欠款记录')+'</p></div>';
  out+=list.map(function(debt){
    var state=debtRecordState(debt),receivable=debt.direction==='receivable';
    var body='<div class="between"><div style="flex:1;min-width:0"><h3 class="h3">'+esc(debt.title)+'</h3>'+
      '<div class="record-badges">'+badge(receivable?'别人欠我':'我欠别人',receivable?'green':'red')+
      (debt.counterparty?badge(debt.counterparty,'dim'):'')+'</div></div>'+badge(state.label,state.tone)+'</div>'+hr()+
      row({label:debt.dueDate?('到期日 '+fmtDate(debt.dueDate)):'无固定到期日',
        sub:'发生于 '+fmtDate(debt.startDate),value:money(debt.amount,debt.currency||'EUR'),
        tone:receivable?'green':'red'});
    if(debt.notes) body+='<p class="dim record-notes">'+esc(debt.notes)+'</p>';
    body+='<div class="btnrow">'+
      btn(debt.settledDate?'恢复为未结清':'标记已结清',"toggleDebtSettled('"+debt.id+"')",debt.settledDate?'ghost':'','check-circle')+
      btn('编辑',"editDebt('"+debt.id+"')",'ghost','pencil-simple')+'</div>';
    return card(body);
  }).join('');
  if(attention.length) out+='<p class="dim retirement-disclaimer">到期提醒仅用于家庭记录，请以实际约定为准。</p>';
  return out;
}

function estatePropertyName(id){

}

}
function estateUseLabel(value){
  return {owner:'自住',rental:'出租',mixed:'自住兼出租'}[value]||'用途待补';
}
function estateRentTypeLabel(value){
  return {fixed:'固定租金',index:'Indexmiete',step:'Staffelmiete'}[value]||'固定租金';
}
function estateMortgagePayments(mortgageId){
  return (S.mortgagePayments||[]).filter(function(item){return item.mortgageId===mortgageId;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
}
function estateLatestMortgagePayment(mortgageId){
  return estateMortgagePayments(mortgageId).filter(function(item){
    return item.remainingBalance!=null&&isFinite(Number(item.remainingBalance));
  })[0]||null;
}
function estateSpecialRepayments(mortgageId){
  return (S.specialRepayments||[]).filter(function(item){return item.mortgageId===mortgageId;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
}
function estateMortgageBalance(mortgage){
  var special=estateSpecialRepayments(mortgage.id).filter(function(item){
    return item.remainingBalance!=null&&isFinite(Number(item.remainingBalance));
  })[0];
  if(special) return Number(special.remainingBalance);
  var latest=estateLatestMortgagePayment(mortgage.id);
  return latest?Number(latest.remainingBalance):Number(mortgage.currentBalance||0);
}
function estateMortgagePrincipalPaid(mortgage){
  var original=Number(mortgage.originalPrincipal||0),balance=estateMortgageBalance(mortgage);
  if(original>0) return Math.max(0,original-balance);
  return estateMortgagePayments(mortgage.id).reduce(function(sum,item){
    return sum+Number(item.principal||0)+Number(item.specialPrincipal||0);
  },0)+estateSpecialRepayments(mortgage.id).reduce(function(sum,item){return sum+Number(item.amount||0);},0);
}
function estateTenancyPayments(tenancyId){
  return (S.rentPayments||[]).filter(function(item){return item.tenancyId===tenancyId;})
    .sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
}
function estateActiveTenancy(tenancy){
  return (!tenancy.endDate||tenancy.endDate>=today())&&(!tenancy.startDate||tenancy.startDate<=today());
}
function estateRentPaymentTotal(payment){
  return Number(payment.kaltmiete||0)+Number(payment.nebenkosten||0)+Number(payment.other||0);
}
function estateSummary(){
  var mortgages=S.mortgages||[],tenancies=S.tenancies||[];
  return {
    balance:mortgages.reduce(function(sum,item){return sum+estateMortgageBalance(item);},0),
    monthly:mortgages.reduce(function(sum,item){return sum+Number(item.monthlyPayment||0);},0),
    kalt:tenancies.filter(estateActiveTenancy).reduce(function(sum,item){return sum+Number(item.kaltmiete||0);},0),
    warm:tenancies.filter(estateActiveTenancy).reduce(function(sum,item){
      return sum+Number(item.kaltmiete||0)+Number(item.nebenkosten||0);
    },0)
  };
}
function estatePropertyMortgages(propertyId){
  return (S.mortgages||[]).filter(function(item){return item.propertyId===propertyId;});
}
function estatePropertyTenancies(propertyId){
  return (S.tenancies||[]).filter(function(item){return item.propertyId===propertyId;});
}

function specialBalanceWithout(mortgage,id){
  var balance=Number(mortgage.currentBalance||0);
  estateSpecialRepayments(mortgage.id).filter(function(item){return item.id!==id;})
    .sort(function(a,b){return a.date>b.date?1:a.date<b.date?-1:0;}).forEach(function(item){
      if(item.remainingBalance!=null&&isFinite(Number(item.remainingBalance))) balance=Number(item.remainingBalance);
      else balance=Math.max(0,balance-Number(item.amount||0));
    });
  return balance;

/* ================= 文件导出 ================= */
function saveFile(name,text,mime,utiHint){
  var blob=new Blob([text],{type:mime});
  // iPhone 优先走系统分享面板 —— 可直接选「日历」或存到「文件」
  if(navigator.canShare){
    try{
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).catch(function(){});
        return;
      }
    }catch(e){}
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  toast(utiHint||'已生成 '+name);
}

        '" onclick="refreshApp()" aria-label="'+esc(appRefreshTitle)+'" title="'+esc(appRefreshTitle)+'">'+
        icon('arrow-clockwise')+'重新加载最新版</button>'+
    '</div>'+
    '<details class="settings-section"><summary>恢复与导入</summary><div class="settings-section-body">'+
      fileField({id:'imp_file',label:'选择备份或更新文件',
        accept:'.json,.vault.json,.patch.json,application/json',
        onchange:'readBackupFile(this)',
        hint:'加密更新包只合并指定记录；完整备份会覆盖恢复。文件只在本机读取。'})+
      field({id:'imp',label:'备份 / 更新内容',type:'textarea',
        ph:'选择文件后会自动读取，也可以粘贴加密内容'})+
      field({id:'imp_pw',label:'备份 / 更新密码（旧版明文备份留空）',type:'password'})+
      btn('导入备份或更新','doImport()','ghost')+
    '</div></details>'+
    '<details class="settings-section"><summary>高级托管工具</summary><div class="settings-section-body">'+
      '<p class="dim" style="margin:0;line-height:1.6">生成一份不含任何家庭数据的空壳 HTML，用于重新部署主屏幕应用。</p>'+
      btn('导出空壳版 HTML（不含数据）','exportShell()','ghost','download-simple')+

      '<p class="dim" style="margin:0">重置会丢弃之后新增的所有记录，请先导出加密备份。</p>'+

}
async function readBackupFile(input){
  var f=input.files&&input.files[0];
  if(!f) return;
  try{
    document.getElementById('imp').value=await f.text();
    toast('已读取 '+f.name);
  }catch(e){ toast('无法读取文件：'+e.message); }
}
async function doImport(){
  var t=val('imp');
  if(!t) return toast('请先选择文件或粘贴内容');
  try{
    var p=JSON.parse(t);
    if(p&&p.format==='scrooge-vault-patch'){
      var patchPassword=val('imp_pw');
      if(!patchPassword) return toast('请输入更新密码');
      var result=applyDataPatch(await decryptDataPatchPayload(p,patchPassword));
      await save(); closeSheet(); render();
      return toast(result.already?'这个更新包已经导入过':'数据更新已合并并加密保存');
    }
    if(p&&p.format==='scrooge-vault-backup'){
      var password=val('imp_pw');
      if(!password) return toast('请输入备份密码');
      p=await decryptBackupPayload(p,password);
    }
    assertState(p);
    S=Object.assign({},SEED,p);
    await save(); closeSheet(); render(); toast('备份已恢复并加密保存');
  }catch(e){ toast('恢复失败：'+e.message); }
}
function assertDataPatch(p){
  var keys=['properties','meters','readings','accounts','txs','contracts','coupons','debts',
    'mortgages','mortgagePayments','specialRepayments','tenancies','rentPayments'];
  if(!p || p.format!=='scrooge-vault-data-patch' || p.version!==1 ||
     typeof p.id!=='string' || !p.id.trim())
    throw new Error('更新包结构不完整');
  var found=false;
  keys.forEach(function(key){
    if(p[key]==null) return;
    if(!Array.isArray(p[key]) || p[key].some(function(x){return !x||typeof x.id!=='string'||!x.id;}))
      throw new Error('更新包中的 '+key+' 记录无效');
    found=true;
  });
  if(!found) throw new Error('更新包中没有可合并的记录');
  return p;
}
function applyDataPatch(p){
  p=assertDataPatch(p);
  S.appliedPatches=S.appliedPatches||{};
  if(S.appliedPatches[p.id]) return {already:true,added:0,updated:0};
  var result={already:false,added:0,updated:0};
  ['properties','meters','readings','accounts','txs','contracts','coupons','debts',
    'mortgages','mortgagePayments','specialRepayments','tenancies','rentPayments'].forEach(function(key){
    if(!p[key]) return;
    S[key]=S[key]||[];
    p[key].forEach(function(item){
      var i=S[key].findIndex(function(x){return x.id===item.id;});
      if(i<0){ S[key].push(copyState(item)); result.added++; }
      else { S[key][i]=copyState(item); result.updated++; }
    });
  });
  S.appliedPatches[p.id]=true;
  return result;
}
function doReset(){
  if(!confirm('将丢弃所有新增记录，恢复到从 Excel 导入时的状态。继续？')) return;
  S=JSON.parse(JSON.stringify(SEED)); save(); closeSheet(); render(); toast('已重置');
}
/** 生成不含数据的空壳，用于公开托管 */
function exportShell(){
  var clone=document.documentElement.cloneNode(true);
  var main=clone.querySelector('#main');
  var nav=clone.querySelector('#nav');
  var sheet=clone.querySelector('#sheet');
  var sheetBody=clone.querySelector('#sheetBody');
  var toastBox=clone.querySelector('#toast');
  if(main){
    main.innerHTML='';
    main.removeAttribute('data-view');
  }
  if(nav) nav.innerHTML='';
  if(sheet){
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden','true');
    sheet.setAttribute('inert','');
  }
  if(sheetBody) sheetBody.innerHTML='';
  if(toastBox){
    toastBox.classList.remove('show');
    toastBox.innerHTML='';
  }
  var html=clone.outerHTML;
  var empty='var SEED={version:2,fxRmbPerEur:8,fxRateSource:"manual",fxRateDate:null,'+
    'appliedPatches:{},retirementPlan:{accountIds:null,contributionMode:"auto",'+
    'manualMonthlyContribution:1500,selectedScenario:"base",rates:{conservative:3,base:5,optimistic:7},'+
    'assetConfigs:{},'+
    'milestone:{highestReached:0,active:0,remainingUnlocks:0}},properties:[],meters:[],readings:[],'+
    'accounts:[{id:"a1",name:"储蓄账户",currency:"EUR",note:""}],txs:[],contracts:[],coupons:[],debts:[],'+
    'mortgages:[],mortgagePayments:[],specialRepayments:[],tenancies:[],rentPayments:[],'+
    'budget:{einkommen:0,tilgung:0,autoMonat:0,grundbesitzQuartal:0,wohngebaeudeJahr:0,'+
    'festkosten:[],sparZiel:0}};';
  var i=html.indexOf('var SEED={'), j=html.indexOf('/* ================= 计算引擎');
  if(i<0||j<0||j<i) return toast('无法定位数据段，请手动删除 var SEED');
  var shell=html.slice(0,i)+empty+'\n'+html.slice(j);
  saveFile('Scrooges-Safe-空壳版.html','<!DOCTYPE html>\n'+shell,'text/html','空壳版已生成（不含数据）');
}

function render(){
  var m=document.getElementById('main');
  clearChartState();
  m.setAttribute('data-view',view);
  if(view==='home') m.innerHTML=viewHome();
  else if(view==='energy') m.innerHTML=viewEnergyOverview();
  else if(view==='power') m.innerHTML=viewMeter('power');
  else if(view==='gas') m.innerHTML=viewMeter('gas');
  else if(view==='save') m.innerHTML=viewSave('save');
  else if(view==='transactions') m.innerHTML=viewSave('transactions');
  else if(view==='estate') m.innerHTML=viewEstate();
  else if(view==='retire') m.innerHTML=viewRetirement();
  else if(view==='rights') m.innerHTML=viewRightsOverview();
  else if(view==='coupons') m.innerHTML=sectionTabs('rights','coupons')+viewCoupons(true);
  else if(view==='debts') m.innerHTML=sectionTabs('funds','debts')+viewDebts(true);

}
