<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://data-api.ecb.europa.eu; worker-src 'self' blob:; manifest-src 'self'; base-uri 'none'; object-src 'none'">
<title>Scrooge's Safe</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scrooge's Safe">
<meta name="application-name" content="Scrooge's Safe">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260726-2">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png?v=20260726-2">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=20260726-2">
<link rel="shortcut icon" type="image/png" href="assets/favicon-32.png?v=20260726-2">
<link rel="manifest" href="assets/manifest.webmanifest?v=20260726-2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#FFFFFF; --card:#FFFFFF; --card2:#F7F7F5; --line:#E9E9E7;
  --tx:#191919; --dim:#6F6E6B;
  --gold:#191919; --goldS:#F7F7F5;
  --green:#0F7B3E; --greenS:#EDF7F1;
  --red:#D44C47; --redS:#FCEDEC;
  --amber:#D9730D; --amberS:#FBF3DB;
  --blue:#2383E2; --blueS:#EAF3FB;
  --inverse:#FFFFFF; --field:#FFFFFF; --field-line:#D7D7D5;
  --header:rgba(255,255,255,.94); --nav-bg:rgba(255,255,255,.96);
  --muted-icon:#6F6E6B; --shadow:rgba(0,0,0,.18);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --nav:65px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#191919; --card:#202020; --card2:#2A2A2A; --line:#373737;
    --tx:#F1F1EF; --dim:#A9A9A6;
    --gold:#F1F1EF; --goldS:#2A2A2A;
    --green:#55B77E; --greenS:#183727;
    --red:#FF7369; --redS:#44221F;
    --amber:#ECA559; --amberS:#44311F;
    --blue:#65A9E8; --blueS:#1F3345;
    --inverse:#191919; --field:#202020; --field-line:#4A4A48;
    --header:rgba(25,25,25,.94); --nav-bg:rgba(25,25,25,.96);
    --muted-icon:#8B8B88; --shadow:rgba(0,0,0,.42);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:0;
  scrollbar-width:none;min-height:100%}
html::-webkit-scrollbar,body::-webkit-scrollbar,.sheet>.body::-webkit-scrollbar{display:none}
body{min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ph,.ph-fill{font-size:1.25em;line-height:1;display:inline-flex}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:var(--header);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:55px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;object-fit:cover;border-radius:7px;flex:0 0 auto}
header h1{margin:0;font-size:17px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hbtn{width:44px;height:44px;display:grid;place-items:center;color:var(--tx);
  border-radius:6px;font-size:18px;transition:transform .14s var(--ease-out)}
header .hbtn:active{background:var(--card2)}
.header-actions{display:flex;align-items:center;gap:0}
#syncButton{position:relative}
#syncButton[data-status="syncing"] i{animation:sync-spin 1s linear infinite}
#syncButton[data-status="ok"]{color:var(--green)}
#syncButton[data-status="warning"]{color:var(--amber)}
#syncButton[data-status="error"]{color:var(--red)}
#refreshButton[data-status="checking"] i{animation:sync-spin 1s linear infinite}
#refreshButton[data-status="ready"]{color:var(--green)}
@keyframes sync-spin{to{transform:rotate(360deg)}}
.sync-state{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;
  background:var(--card2);font-size:21px}
.sync-state.ok{background:var(--greenS);color:var(--green)}
.sync-state.warning{background:var(--amberS);color:var(--amber)}
.sync-state.error{background:var(--redS);color:var(--red)}

/* ---------- 布局 ---------- */
main{padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
main>*{flex-shrink:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:15px;display:flex;flex-direction:column;gap:10px}
.card.gold{background:var(--goldS)} .card.green{background:var(--greenS)}
.card.red{background:var(--redS)} .card.amber{background:var(--amberS)} .card.blue{background:var(--blueS)}
.h2{font-size:17px;font-weight:700;margin:0}
.h3{font-size:14px;font-weight:600;margin:0}
.dim{color:var(--dim);font-size:12px}
.big{font-size:30px;font-weight:700}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr{height:1px;background:var(--line);margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px}
.stat{min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:21px;font-weight:700;line-height:1.16;white-space:normal;overflow-wrap:anywhere}
.stat .v small{font-size:11px;color:var(--dim);font-weight:400;white-space:nowrap}
.contract-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.contract-stats .stat{min-width:0}
.contract-stats .stat .v{font-size:18px;letter-spacing:0}
.contract-stats .stat .v small{font-size:10px}
.contract-stats .stat .dim{overflow-wrap:anywhere}
.contract-stats .stat:nth-child(3):last-child{grid-column:1/-1;padding-top:10px;border-top:1px solid var(--line)}
.debt-summary-stats,.coupon-summary-stats,.cashflow-summary-stats,.retirement-summary-stats{
  grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.debt-summary-stats .stat,.coupon-summary-stats .stat,.cashflow-summary-stats .stat,.retirement-summary-stats .stat{min-width:0}
.debt-summary-stats .stat .v,.coupon-summary-stats .stat .v,.cashflow-summary-stats .stat .v,.retirement-summary-stats .stat .v{font-size:18px}
.debt-summary-stats .stat:nth-child(3):last-child,.cashflow-summary-stats .stat:nth-child(3):last-child,.retirement-summary-stats .stat:nth-child(3):last-child{
  grid-column:1/-1;padding-top:10px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;text-align:left;width:100%}
.row .l{flex:1;min-width:0}
.row .l b{font-weight:400;font-size:14px;display:block;overflow-wrap:anywhere}
.row .v{flex:0 1 auto;min-width:0;max-width:48%;font-weight:600;font-size:14px;line-height:1.3;
  white-space:normal;overflow-wrap:anywhere;text-align:right}
.row.tap{transition:transform .14s var(--ease-out),opacity .14s ease}
.row.tap:active{opacity:.72;transform:scale(.99)}
.badge{display:inline-block;padding:3px 7px;border-radius:5px;font-size:11px;font-weight:650;white-space:nowrap}
.insurance-subject{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b-gold{background:var(--goldS);color:var(--gold)} .b-dim{background:var(--card2);color:var(--dim)}
.b-green{background:var(--greenS);color:var(--green)} .b-red{background:var(--redS);color:var(--red)}
.b-amber{background:var(--amberS);color:var(--amber)} .b-blue{background:var(--blueS);color:var(--blue)}
.c-gold{color:var(--gold)} .c-green{color:var(--green)} .c-red{color:var(--red)}
.c-amber{color:var(--amber)}
.c-dim{color:var(--dim)} .c-blue{color:var(--blue)}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- 按钮 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 16px;border-radius:6px;font-weight:650;font-size:14px;
  background:var(--tx);color:var(--inverse);min-height:44px;
  min-width:0;line-height:1.2;text-align:center;white-space:normal;
  transition:transform .14s var(--ease-out),opacity .14s ease}
.btn:active,header .hbtn:active,.x:active,.retirement-back:active{transform:scale(.97)}
.btn.ghost{background:var(--field);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:var(--redS);color:var(--red)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:5px;min-height:44px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1;min-width:0}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;
  -ms-overflow-style:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:6px;background:var(--card2);
  color:var(--tx);font-size:13px;font-weight:600;border:1px solid transparent;
  min-height:44px;transition:transform .14s var(--ease-out)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--tx);color:var(--inverse)}
.section-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;
  padding:3px;background:var(--card2);border:1px solid var(--line);border-radius:7px;
  position:sticky;top:0;z-index:12;box-shadow:0 8px 12px var(--shadow)}
.section-tab{min-width:0;min-height:44px;padding:8px 6px;border-radius:5px;color:var(--dim);
  font-size:13px;font-weight:650;white-space:nowrap;transition:background-color .14s ease,color .14s ease}
.section-tab:active{background:var(--line)}
.section-tab.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.section-tabs.tabs-4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ---------- 房产 ---------- */
.estate-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.estate-heading h1{font-size:25px;line-height:1.2;margin:0}
.estate-heading p{margin:3px 0 0}
.estate-summary-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.estate-property-card{gap:13px}
.estate-property-title{min-width:0}
.estate-property-title h2{font-size:18px;margin:0;overflow-wrap:anywhere}
.estate-property-title p{margin:3px 0 0;overflow-wrap:anywhere}
.estate-section{display:flex;flex-direction:column;gap:8px}
.estate-section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.estate-section-head h3{font-size:14px;margin:0}
.estate-record{padding:10px 0;border-top:1px solid var(--line)}
.estate-record:first-of-type{border-top:0}
.estate-record .between{align-items:flex-start}
.estate-record-title{min-width:0}
.estate-record-title b{display:block;font-size:14px;overflow-wrap:anywhere}
.estate-record-title span{display:block;margin-top:2px}
.estate-record .stats{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;row-gap:18px;margin-top:14px;margin-bottom:2px}
.estate-record .stat .v{font-size:18px;line-height:1.25}
.estate-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.estate-actions .btn{padding-inline:8px;font-size:12px}
.estate-record-actions{margin-top:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.estate-record-actions .btn:first-child{grid-column:1/-1}
.estate-assumption{margin:12px 0 0;line-height:1.5}
.estate-empty{margin:0;padding:5px 0;color:var(--dim);font-size:12px}

/* ---------- 表单 ---------- */
.field{min-width:0;display:flex;flex-direction:column;gap:5px}
.field>label{color:var(--dim);font-size:12px}
.field input,.field select,.field textarea{
  background:var(--field);border-radius:5px;padding:12px;color:var(--tx);
  border:1px solid var(--field-line);font-size:16px;width:100%;min-width:0;max-width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--tx)}
.field .hint{color:var(--dim);font-size:11px}
.date-control{width:100%;min-width:0;max-width:100%;overflow:hidden;background:var(--field);
  border:1px solid var(--field-line);border-radius:5px}
.date-control:focus-within{border-color:var(--tx)}
.date-control input[type=date],.date-control input[type=month]{display:block;inline-size:100%;
  min-inline-size:0;max-inline-size:100%;width:100%;min-width:0;max-width:100%;min-height:46px;
  overflow:hidden;border:0;border-radius:0;background:transparent;box-shadow:none}
.field input[type=date]::-webkit-date-and-time-value,
.field input[type=month]::-webkit-date-and-time-value{min-width:0;width:100%;text-align:left;margin:0}
.switch{display:flex;align-items:center;justify-content:space-between;
  background:var(--card2);border-radius:5px;padding:12px}
.settings-actions{display:grid;gap:8px}
.settings-section{border:1px solid var(--line);border-radius:6px;background:var(--card)}
.settings-section>summary{list-style:none;min-height:48px;padding:12px 14px;display:flex;
  align-items:center;justify-content:space-between;font-weight:650;cursor:pointer}
.settings-section>summary::-webkit-details-marker{display:none}
.settings-section>summary::after{content:"+";font-size:20px;color:var(--dim);font-weight:400}
.settings-section[open]>summary::after{content:"−"}
.settings-section[open]>summary{border-bottom:1px solid var(--line)}
.settings-section-body{display:flex;flex-direction:column;gap:12px;padding:14px}
.settings-section.danger>summary{color:var(--red)}

/* ---------- 秘密退休计划 ---------- */
.retirement-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.retirement-heading>div{display:flex;align-items:center;gap:9px;min-width:0}
.retirement-heading h1{font-size:22px;line-height:1.2;margin:1px 0 0}
.retirement-back{width:44px;height:44px;display:grid;place-items:center;border-radius:6px;
  border:1px solid var(--line);font-size:19px;flex:0 0 auto;
  transition:transform .14s var(--ease-out)}
.retirement-back:active{background:var(--card2)}
.retirement-date{font-size:34px;font-weight:750;line-height:1.08}
.retirement-scenario-control{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:3px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:3px}
.retirement-scenario-control button{height:48px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;border-radius:4px;color:var(--dim);min-width:0;
  transition:transform .14s var(--ease-out),background-color .18s ease,color .18s ease}
.retirement-scenario-control button:active{transform:scale(.97)}
.retirement-scenario-control button b{font-size:13px;font-weight:650}
.retirement-scenario-control button small{font-size:9px;white-space:nowrap}
.retirement-scenario-control button.on{background:var(--card);box-shadow:0 1px 3px var(--shadow)}
.retirement-scenario-control button.on.amber{color:var(--amber)}
.retirement-scenario-control button.on.blue{color:var(--blue)}
.retirement-scenario-control button.on.green{color:var(--green)}
.retirement-scenario-result{display:flex;flex-direction:column;gap:3px;
  animation:retirement-scenario-in .2s var(--ease-out) both}
.retirement-progress{height:8px;background:var(--card);border:1px solid var(--line);
  border-radius:4px;overflow:hidden}
.retirement-progress span{display:block;height:100%;background:var(--blue);border-radius:3px}
.retirement-progress-label{font-size:12px}
.retirement-milestones{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;height:10px}
.retirement-milestones span{display:block;background:var(--line);border-radius:2px}
.retirement-milestones span.done{background:var(--green)}
.retirement-milestones span.next{background:var(--blue)}
.retirement-disclaimer{margin:0;text-align:center;line-height:1.5}
.retirement-account-list{display:flex;flex-direction:column;border:1px solid var(--field-line);
  border-radius:6px;overflow:hidden}
.retirement-asset-choice{border-bottom:1px solid var(--line);background:var(--field)}
.retirement-asset-choice:last-child{border-bottom:0}
.retirement-account-choice{display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:11px 12px}
.retirement-account-choice span{display:flex;flex-direction:column;min-width:0}
.retirement-account-choice b{font-size:14px;font-weight:600}
.retirement-account-choice small{font-size:11px;color:var(--dim)}
.retirement-account-choice input{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.retirement-asset-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;padding:0 12px 12px}
.retirement-asset-fields .field{margin:0}
.retirement-asset-fields .hint{grid-column:1/-1;margin:0}
.mode-control{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--card2);
  border:1px solid var(--line);border-radius:6px;padding:3px}
.mode-control button{min-height:44px;border-radius:4px;font-size:13px;color:var(--dim);
  transition:transform .14s var(--ease-out),background-color .18s ease,color .18s ease}
.mode-control button:active{transform:scale(.97)}
.mode-control button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px var(--shadow)}
.retirement-rate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.retirement-phase-key{display:flex;align-items:center;gap:14px;color:var(--dim);font-size:10px}
.retirement-phase-key span{display:flex;align-items:center;gap:5px}
.retirement-phase-key i{display:block;width:20px;height:0;border-top:2px solid var(--tx)}
.retirement-phase-key i.forecast{border-top-style:dashed}
.retirement-celebration{position:fixed;inset:0;z-index:140;display:none;overflow:hidden;
  align-items:center;justify-content:center;background:rgba(18,18,18,.96);color:#fff;padding:28px}
.retirement-celebration.show{display:flex}
.retirement-celebration-content{position:relative;z-index:2;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:10px;max-width:420px}
.retirement-celebration-content .mark{width:64px;height:64px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.32);border-radius:50%;font-size:31px;color:#76B7F2}
.retirement-celebration-content h2{font-size:21px;margin:4px 0 0}
.retirement-celebration-amount{font-size:42px;font-weight:800;line-height:1}
.retirement-celebration-content p{margin:0;color:#D4D4D2}
.retirement-celebration-content .btn{margin-top:12px;background:#fff;color:#191919;min-width:180px}
.retirement-celebration-close{position:absolute;z-index:3;right:16px;
  top:calc(env(safe-area-inset-top) + 16px);width:42px;height:42px;display:grid;place-items:center;
  color:#fff;border-radius:6px;font-size:25px}
.retirement-confetti{position:absolute;inset:0;pointer-events:none}
.retirement-confetti i{position:absolute;left:50%;top:46%;width:7px;height:18px;border-radius:2px;
  opacity:0;animation:retirement-burst 1.6s cubic-bezier(.18,.7,.28,1) var(--delay) both}
.retirement-confetti i.blue{background:#65A9E8}.retirement-confetti i.green{background:#55B77E}
.retirement-confetti i.gold{background:#F2C14E}.retirement-confetti i.red{background:#FF7369}
.retirement-confetti i.pink{background:#E78AC3}
@keyframes retirement-burst{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))
    scale(1) rotate(var(--rot))}
}
@keyframes retirement-scenario-in{
  from{opacity:.25;transform:translateY(3px)}
  to{opacity:1;transform:translateY(0)}
}
@media (max-width:440px){
  .retirement-heading{align-items:flex-start}
  .retirement-heading>.btn{width:44px;min-width:44px;padding:0;font-size:0}
  .retirement-heading>.btn .ph{font-size:18px}
  .retirement-rate-grid{grid-template-columns:1fr}
  .retirement-asset-fields{grid-template-columns:1fr}
  .retirement-date{font-size:31px}
}
@media (prefers-reduced-motion:reduce){
  .retirement-confetti{display:none}
  .retirement-celebration-content .mark{border-color:#65A9E8}
}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;transform:translateY(100%);
  visibility:hidden;pointer-events:none;
  transition:transform .24s var(--ease-drawer),visibility 0s linear .24s}
.sheet.open{transform:translateY(0);visibility:visible;pointer-events:auto;
  transition:transform .24s var(--ease-drawer),visibility 0s}
.sheet>.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.sheet>.top .h2{font-size:18px}
.sheet>.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.x{color:var(--tx);font-size:25px;line-height:1;width:44px;height:44px;border-radius:6px;
  transition:transform .14s var(--ease-out)}
.x:active{background:var(--card2)}

/* ---------- 底部导航 ---------- */
nav{position:fixed;inset-inline:0;bottom:0;z-index:30;
  background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;min-height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);isolation:isolate;transform:translateZ(0);
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 7px;color:var(--muted-icon);font-size:11px;font-weight:600;min-width:0}
nav button.on{color:var(--tx)}
nav button .ph,nav button .ph-fill{font-size:23px;width:24px;height:24px;justify-content:center}

/* ---------- 图表 ---------- */
.chart-shell{display:flex;flex-direction:column;gap:4px;min-width:0}
.chart-readout{height:28px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;border-bottom:1px solid var(--line)}
.chart-readout span{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-readout strong{font-size:14px;font-weight:700;white-space:nowrap}
.chart-series-readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px 12px;padding:4px 0 6px}
.chart-series-readout span{display:grid;grid-template-columns:8px minmax(0,1fr);
  align-items:center;column-gap:6px;min-width:0}
.chart-series-readout i{width:8px;height:8px;border-radius:2px;grid-row:1/3}
.chart-series-readout b{font-size:10px;color:var(--dim);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-series-readout strong{font-size:11px;font-weight:650;white-space:nowrap}
.chart-frame{display:grid;grid-template-columns:42px minmax(0,1fr);gap:6px;align-items:start}
.chart-y-axis{height:156px;position:relative;color:var(--dim);font-size:11px;
  font-variant-numeric:tabular-nums}
.chart-y-unit{position:absolute;top:0;right:0;font-weight:650;color:var(--tx)}
.chart-y-label{position:absolute;right:0;line-height:1;transform:translateY(-50%);white-space:nowrap}
.chart-plot{min-width:0}
.chart{width:100%;height:156px;display:block;overflow:visible;touch-action:pan-y;
  cursor:crosshair;border-radius:4px}
.chart:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chart-grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart-zero{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.65}
.chart-focus-line{stroke:var(--dim);stroke-width:1;stroke-dasharray:3 3;
  vector-effect:non-scaling-stroke;pointer-events:none}
.chart-focus-dot{stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.retirement-series-line{pointer-events:none}
.retirement-today-line{stroke:var(--dim);stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.chart-bar{vector-effect:non-scaling-stroke}
.chart-bar.selected{stroke:var(--tx);stroke-width:1.5}
.chart-x-axis{height:18px;position:relative;margin-top:3px;color:var(--dim);
  font-size:11px;font-variant-numeric:tabular-nums}
.chart-x-label{position:absolute;top:0;line-height:1;transform:translateX(-50%);white-space:nowrap}
.chart-x-label.first{transform:none}.chart-x-label.last{transform:translateX(-100%)}
.chart-x-label.today{color:var(--blue);font-weight:700}
.retirement-phase-key+.chart-shell{animation:retirement-scenario-in .22s var(--ease-out) both}
@media (max-width:440px){
  .chart-series-readout{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){
  .retirement-scenario-result,.retirement-phase-key+.chart-shell{animation:none}
}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%);z-index:80;background:var(--tx);color:var(--inverse);
  padding:11px 17px;border-radius:6px;font-size:13px;font-weight:600;
  box-shadow:0 8px 24px var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .18s ease;max-width:88vw;text-align:center;
  display:flex;align-items:center;gap:12px}
.toast.show{opacity:1;pointer-events:auto}
.toast-action{color:inherit;text-decoration:underline;text-underline-offset:3px;font-weight:750;
  min-height:32px;padding:0 2px}

/* ---------- 安全锁屏 ---------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:24px}
body.locked{overflow:hidden}
body.locked .lock{display:flex}
body.locked .app-shell,body.locked .sheet,body.locked .toast,body.locked #nav{visibility:hidden}
.lockbox{width:min(100%,390px);display:flex;flex-direction:column;gap:14px}
.vaultmark{width:72px;height:72px;object-fit:cover;border-radius:16px;margin-bottom:4px}
.lockbox h1{font-size:28px;margin:0}.lockbox p{margin:0;line-height:1.6}
.lockbox input{background:var(--field);border:1px solid var(--field-line);border-radius:5px;
  padding:13px;color:var(--tx);font-size:16px;width:100%}
.lockbox input:focus{outline:0;border-color:var(--tx)}
.lock-error{min-height:18px;color:var(--red);font-size:12px}
.lock-actions{display:flex;flex-direction:column;gap:9px}

/* ---------- 导入与识别 ---------- */
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.import-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.import-row{display:grid;grid-template-columns:24px 76px 1fr auto;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.import-row input{width:18px;height:18px}.import-row .note{min-width:0;overflow-wrap:anywhere}
.ocr-preview{width:100%;max-height:230px;object-fit:contain;background:var(--card2);border-radius:6px}
.ocr-window-review{display:grid;gap:7px;padding:10px;background:var(--card2);border:1px solid var(--line);
  border-radius:6px}
.ocr-window-review>span{font-size:12px;font-weight:700;color:var(--dim)}
.ocr-window-review>small{font-size:11px;line-height:1.45;color:var(--dim)}
.ocr-window-preview{display:block;width:100%;height:104px;object-fit:contain;background:#d8d8d5;
  border-radius:4px}
.ocr-suggestion-label{display:block;margin-top:2px;color:var(--dim);font-size:11px}
.ocr-suggestions{margin:0;padding:0}
.progress{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--tx);width:100%;
  transform:scaleX(0);transform-origin:left;transition:transform .2s var(--ease-out)}

/* ---------- 今天 ---------- */
.today-head{padding:2px 0 7px}
.today-head h1{font-size:30px;line-height:1.15;margin:0 0 4px;font-weight:750}
.today-date{margin:0;color:var(--dim);font-size:13px}
.asset-strip{display:grid;grid-template-columns:38px minmax(0,1fr) auto 18px;
  align-items:center;gap:10px;width:100%;padding:15px 0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);text-align:left}
.asset-icon,.activity-icon{display:grid;place-items:center;background:var(--card2);border-radius:50%;color:var(--tx)}
.asset-icon{width:38px;height:38px;font-size:19px}
.asset-label{display:flex;flex-direction:column;min-width:0}
.asset-label b{font-size:14px;font-weight:650}.asset-label span{color:var(--dim);font-size:12px}
.asset-value{text-align:right;font-size:18px;font-weight:700;white-space:nowrap}
.asset-strip>.ph{color:var(--muted-icon);font-size:16px}
.home-section{display:flex;flex-direction:column}
.section-title{font-size:14px;font-weight:700;margin:4px 0 7px}
.activity-row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;
  gap:10px;width:100%;padding:10px 0;text-align:left;border-bottom:1px solid var(--line)}
.activity-row:last-child{border-bottom:0}
.activity-icon{width:38px;height:38px;font-size:18px}
.activity-icon.red{background:var(--redS);color:var(--red)}
.activity-icon.amber{background:var(--amberS);color:var(--amber)}
.activity-icon.green{background:var(--greenS);color:var(--green)}
.activity-icon.blue{background:var(--blueS);color:var(--blue)}
.activity-copy{min-width:0;display:flex;flex-direction:column}
.activity-copy b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-copy span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-value{text-align:right;font-size:13px;font-weight:650;white-space:nowrap}
.activity-value small{display:block;color:var(--dim);font-size:10px;font-weight:500}
.home-actions{display:flex;flex-direction:column;gap:8px;padding-top:2px}
.home-support{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.home-support .btn{min-width:0;padding-left:8px;padding-right:8px}
.save-overview,.save-dashboard,.save-chart-grid,.save-account-view,.overview-grid{display:flex;flex-direction:column;gap:14px;min-width:0}
.overview-unit{font-size:13px}
.record-overview-copy{margin:0;min-height:36px;line-height:1.5}
.energy-quota{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.energy-quota .between{align-items:baseline}
.quota-track{height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.quota-track>span{display:block;height:100%;border-radius:inherit;background:var(--green)}
.energy-plan-empty{margin:0}
.energy-contract-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.energy-contract-stats .stat{min-width:0}
.energy-contract-stats .stat .v{font-size:20px;white-space:normal;overflow-wrap:anywhere;line-height:1.18}
.record-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.record-heading-title{display:flex;flex:1;align-items:center;gap:10px;min-width:0}
.record-heading-title>div{display:flex;flex-direction:column;min-width:0}
.record-heading h1{font-size:23px;line-height:1.15;margin:0}
.record-heading .btn{flex:0 0 auto}
.record-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.record-badges .badge{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.record-code{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card2);border-radius:5px;padding:10px 12px}
.record-code span{flex:0 0 auto;color:var(--dim);font-size:11px}
.record-code strong{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere;text-align:right}
.record-notes{margin:0;line-height:1.5;white-space:pre-wrap}
.coupon-image-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.coupon-image-actions .btn{min-width:0;padding-left:8px;padding-right:8px}
.coupon-image-actions .coupon-live-scan{grid-column:1/-1}
.coupon-qr-scanner{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--card2);border-radius:6px}
.coupon-qr-scanner[hidden]{display:none}
.coupon-qr-scanner video{display:block;width:100%;aspect-ratio:4/3;max-height:48vh;object-fit:cover;
  background:#111;border-radius:5px}
.coupon-image-preview{display:flex;flex-direction:column;gap:8px}
.coupon-image-preview img,.coupon-image-full{display:block;width:100%;max-height:360px;object-fit:contain;
  background:var(--card2);border:1px solid var(--line);border-radius:6px}
.coupon-image-full{max-height:68vh}
.coupon-image-empty{margin:0;padding:14px;text-align:center;background:var(--card2);border-radius:6px}
.coupon-photo{display:grid;grid-template-columns:72px minmax(0,1fr);align-items:center;gap:10px;
  width:100%;padding:8px;background:var(--card2);border-radius:6px;text-align:left}
.coupon-photo img{width:72px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.coupon-photo span{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650}
@media (min-width:700px){
  header{padding-left:max(16px,calc((100% - 640px)/2));padding-right:max(16px,calc((100% - 640px)/2))}
  nav{left:50%;right:auto;width:640px;transform:translate3d(-50%,0,0);border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .contract-stats,.debt-summary-stats,.cashflow-summary-stats,.retirement-summary-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .contract-stats .stat:nth-child(3):last-child,.debt-summary-stats .stat:nth-child(3):last-child,.cashflow-summary-stats .stat:nth-child(3):last-child,.retirement-summary-stats .stat:nth-child(3):last-child{

  .coupon-summary-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .estate-summary-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .estate-record-actions{grid-template-columns:repeat(3,minmax(0,1fr))}

}
@media (max-width:899px){

    grid-template-rows:auto minmax(0,1fr)}
  header{position:relative}
  main{width:100%;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;

  nav{position:fixed;inset-inline:0;bottom:0;width:100%;margin:0;transform:none;

}
@media (min-width:900px){
  body{padding-bottom:0}

    border-right:1px solid var(--line)}

    grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:16px}
  main>*{min-width:0}
  main>.today-head,main>.asset-strip,main>.chips,main>.meter-entry,main>.btnrow,main>.section-tabs,

  .section-tabs{position:relative;top:auto;box-shadow:none}

  .save-overview,.save-dashboard,.overview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .save-account-view{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px;align-items:start}

  .chart,.chart-y-axis{height:180px}

}

  .chart,.chart-y-axis{height:196px}
}

<body>
<div class="lock" id="lock" aria-live="polite">
  <div class="lockbox">
    <img class="vaultmark" src="assets/scrooges-safe-icon.png" alt="Scrooge's Safe">
    <h1 id="lockTitle">打开 Scrooge's Safe</h1>
    <p class="dim" id="lockText"></p>
    <div id="lockFields"></div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-actions" id="lockActions"></div>
  </div>
</div>
<div class="app-shell">
  <header><div class="brand">
    <img src="assets/scrooges-safe-icon.png" alt="">
    <h1>Scrooge's Safe</h1>
  </div><div class="header-actions">
    <button class="hbtn" id="syncButton" data-status="off" onclick="manualSyncButton()" aria-label="家庭同步未设置" title="家庭同步未设置"><i id="syncIcon" class="ph ph-cloud-slash"></i></button>
    <button class="hbtn" onclick="lockVault()" aria-label="锁定" title="锁定"><i class="ph ph-lock"></i></button>
    <button class="hbtn" onclick="openSettings()" aria-label="设置" title="设置"><i class="ph ph-gear"></i></button>
  </div></header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"
  aria-labelledby="sheetTitle" tabindex="-1" inert><div class="top"><h2 class="h2" id="sheetTitle"></h2>
  <button class="x" onclick="closeSheet()" aria-label="关闭">&times;</button></div>
  <div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="retirement-celebration" id="retirementCelebration" role="dialog" aria-modal="true"
  aria-labelledby="retirementCelebrationTitle">
  <button class="retirement-celebration-close" onclick="hideRetirementCelebration()"
    aria-label="跳过庆祝" title="跳过庆祝">&times;</button>
  <div class="retirement-confetti" id="retirementConfetti" aria-hidden="true"></div>
  <div class="retirement-celebration-content">
    <span class="mark"><i class="ph ph-trophy"></i></span>
    <h2 id="retirementCelebrationTitle">新的退休里程碑</h2>
    <strong class="retirement-celebration-amount tnum" id="retirementCelebrationAmount"></strong>
    <p>离秘密退休计划又近了一大步。</p>
    <button class="btn" onclick="hideRetirementCelebration()">继续进入金库</button>
  </div>

<script>

/* ================= 计算引擎 =================
   逻辑与《嘘！Scrooge 的金库.xlsx》的公式逐条对齐：
   月均消耗 = (本次读数 − 上次读数) × 换算系数 ÷ 天数 × 30
   （对应 Excel  电: (E5-E4)/(B5-B4)*30   气: (Q5-Q4)*k/(M5-M4)*30 ）
   ============================================ */
var DAY = 86400000;

function toD(iso){ var p = iso.split('-'); return Date.UTC(+p[0], p[1]-1, +p[2]); }
function isoOf(ms){ return new Date(ms).toISOString().slice(0,10); }
function today(){ var n=new Date(); return isoOf(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function daysBetween(a,b){ return Math.round((toD(b)-toD(a))/DAY); }
function addDays(d,n){ return isoOf(toD(d)+n*DAY); }
function addYearsIso(d,n){
  if(!isDate(d)) return '';
  var p=d.split('-'),year=Number(p[0])+Number(n||0),month=Number(p[1]),day=Number(p[2]);
  var maxDay=new Date(Date.UTC(year,month,0)).getUTCDate();
  return [year,String(month).padStart(2,'0'),String(Math.min(day,maxDay)).padStart(2,'0')].join('-');
}
function fmtDate(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function isDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); }

/** 结算年度起点：以 Ablesetermin (MM-DD) 为分界 */
function periodStart(d, term){
  var t=term.split('-'), am=+t[0], ad=+t[1];
  var dt=new Date(toD(d)), y=dt.getUTCFullYear();
  var cut=Date.UTC(y,am-1,ad);
  return isoOf(toD(d)>=cut ? cut : Date.UTC(y-1,am-1,ad));
}

function n0(v){ return Math.round(v).toLocaleString('de-DE'); }
function n2(v){ return v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function eur(v){ return (v<0?'−':'')+n2(Math.abs(v))+' €'; }
function money(v,cur){ return (v<0?'−':'')+n2(Math.abs(v))+' '+(cur==='EUR'?'€':'¥'); }

function sortByDate(a){ return a.slice().sort(function(x,y){ return x.date<y.date?-1:x.date>y.date?1:0; }); }
function meterReadings(readings,id){ return sortByDate(readings.filter(function(r){return r.meterId===id;})); }

/** 每两次抄表之间的区间 */
function intervals(rs,m){
  var s=sortByDate(rs), out=[];
  for(var i=1;i<s.length;i++){
    var days=daysBetween(s[i-1].date,s[i].date);
    var safe=days>0?days:1;
    var netRaw=s[i].value-s[i-1].value;
    var kwh=netRaw*m.factor;
    var cost=kwh*m.arbeitspreisCt/100;
    var absch=m.monthlyAbschlag*safe*12/365;
    out.push({from:s[i-1].date,to:s[i].date,days:days,netRaw:netRaw,kwh:kwh,
      avg30:kwh/safe*30, perDay:kwh/safe, cost:cost, abschlag:absch,
      delta:cost-absch, anomaly:netRaw<0, readingId:s[i].id, value:s[i].value});
  }
  return out;
}

/** 本结算年度累计 */
function currentPeriod(rs,m,now){
  now=now||today();
  var s=sortByDate(rs);
  if(s.length<2) return null;
  var start=periodStart(now,m.ableseTermin);
  // 基准 = 不晚于结算年度起点的最后一次抄表；若全都晚于起点则取第一次
  var bi=-1;
  for(var i=0;i<s.length;i++) if(s[i].date<=start) bi=i;
  if(bi<0) bi=0;
  var base=s[bi], last=s[s.length-1];
  if(base.date===last.date) return null;
  var netRaw=last.value-base.value, kwh=netRaw*m.factor;
  var days=Math.max(1,daysBetween(base.date,last.date));
  var cost=kwh*m.arbeitspreisCt/100;
  var paid=m.monthlyAbschlag*(daysBetween(base.date,now)/30.44);
  var perDay=kwh/days;
  return {start:base.date,end:last.date,kwh:kwh,netRaw:netRaw,cost:cost,
    abschlagPaid:paid, delta:cost-paid, days:days, avg30:perDay*30,
    projectedYearKwh:perDay*365, projectedYearCost:perDay*365*m.arbeitspreisCt/100};
}

function accountBalance(txs,id){
  return txs.reduce(function(s,t){ return t.accountId===id ? s+t.amount : s; },0);
}
function totalEur(txs,accounts,fx){
  return accounts.reduce(function(s,a){
    var b=accountBalance(txs,a.id);
    return s + (a.currency==='EUR' ? b : b/fx);
  },0);
}
/** 累计余额曲线（对应「存款走势」表） */
function balanceSeries(txs,ids){
  var rel=txs.filter(function(t){return ids.indexOf(t.accountId)>=0;})
             .sort(function(a,b){return a.date<b.date?-1:1;});
  var out=[],run=0;
  for(var i=0;i<rel.length;i++){
    run+=rel[i].amount;
    if(out.length && out[out.length-1].date===rel[i].date) out[out.length-1].value=run;
    else out.push({date:rel[i].date,value:run});
  }
  return out;
}
function monthlyNet(txs,ids){
  var m={};
  txs.forEach(function(t){
    if(ids.indexOf(t.accountId)<0||t.valuationOnly) return;
    var k=t.date.slice(0,7); m[k]=(m[k]||0)+t.amount;
  });
  return Object.keys(m).sort().map(function(k){return {date:k,value:m[k]};});
}

var CYCLE_N={'jährlich':1,'halbjährlich':2,'quartal':4,'monatlich':12,'einmalig':0};
var CYCLE_ZH={'jährlich':'每年','halbjährlich':'每半年','quartal':'每季度','monatlich':'每月','einmalig':'一次性'};

function contractIsFixedTerm(c){
  if(c.fixedTerm===true) return true;
  if(c.fixedTerm===false) return false;
  return !c.autoRenew&&!!c.endDate;
}
function contractRenewalDate(c){
  if(contractIsFixedTerm(c)) return null;
  return c.renewalDate||c.endDate||null;
}
function contractCalendarDate(c){
  return contractIsFixedTerm(c)?(c.endDate||null):contractRenewalDate(c);
}

/** 合同倒计时 */
function contractStatus(c,now){
  now=now||today();
  var yearly=(c.premium||0)*(CYCLE_N[c.cycle]||0);
  var fixed=contractIsFixedTerm(c), eventDate=contractCalendarDate(c);
  if(!eventDate) return {daysToEnd:null,noticeDeadline:null,daysToNotice:null,
    eventDate:null,eventKind:fixed?'end':'renewal',urgency:'open',
    label:fixed?'未填写固定到期日':'自动续约 · 无固定到期',yearlyCost:yearly};
  var dEnd=daysBetween(now,eventDate);
  if(!fixed&&c.noticeDays<=0) return {
    daysToEnd:dEnd,noticeDeadline:null,daysToNotice:null,eventDate:eventDate,
    eventKind:'renewal',urgency:'open',label:'自动续约 · 无固定到期',yearlyCost:yearly
  };
  var nd=c.noticeDays>0 ? addDays(eventDate,-c.noticeDays) : eventDate;
  var dNotice=daysBetween(now,nd);
  var u,label;
  if(fixed&&dEnd<0){ u='expired'; label='已过期 '+Math.abs(dEnd)+' 天'; }
  else if(!fixed&&dEnd<0){ u='open'; label='续约日期待更新'; }
  else if(dNotice<=0){ u='notice'; label='退保期已过 · '+dEnd+' 天后'+(fixed?'到期':'续约'); }
  else if(dNotice<=45){ u='soon'; label=dNotice+' 天内需决定退保'; }
  else { u='ok'; label=dEnd+' 天后'+(fixed?'到期':'续约'); }
  return {daysToEnd:dEnd,noticeDeadline:nd,daysToNotice:dNotice,eventDate:eventDate,
    eventKind:fixed?'end':'renewal',urgency:u,label:label,yearlyCost:yearly};
}

/* ---------- .ics 日历文件 ---------- */
function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){
  var d=new Date(), p=function(n){return String(n).padStart(2,'0');};
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z';
}
function buildIcs(contracts){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scrooge Vault//Contracts//ZH',
         'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:金库 · 合同到期'];
  var alarm=function(trig,desc){ return ['BEGIN:VALARM','ACTION:DISPLAY',
    'TRIGGER:'+trig,'DESCRIPTION:'+icsEsc(desc),'END:VALARM']; };
  contracts.forEach(function(c){
    var st=contractStatus(c), eventDate=st.eventDate;
    if(!eventDate) return;
    var isRenewal=st.eventKind==='renewal';
    var mny=c.premium?(' · '+c.premium.toFixed(2)+' € / '+c.cycle):'';
    var desc=[c.provider?('服务商：'+c.provider):'', c.vehiclePlate?('车牌号：'+c.vehiclePlate):'',
      c.insuredPerson?('受保人：'+c.insuredPerson):'',
      c.tariff?('Tarif：'+c.tariff):'',
      c.premium?('保费：'+c.premium.toFixed(2)+' € ('+CYCLE_ZH[c.cycle]+')'):'',
      (isRenewal?'下次续约：':'合同期：'+fmtDate(c.startDate)+' – ')+fmtDate(eventDate),
      '退保通知期：'+c.noticeDays+' 天',
      c.autoRenew?'自动续约：是（不退保则自动延长）':'自动续约：否',
      c.notes?('备注：'+c.notes):''].filter(Boolean).join('\n');
    var ds=function(d){return d.replace(/-/g,'');};
    if(st.noticeDeadline && c.noticeDays>0){
      L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-notice@scrooge','DTSTAMP:'+icsStamp(),
        'DTSTART;VALUE=DATE:'+ds(st.noticeDeadline),
        'SUMMARY:⚠︎ 退保截止：'+icsEsc(c.name)+icsEsc(mny),
        'DESCRIPTION:'+icsEsc(desc)],
        alarm('-P14D',c.name+' 退保通知期还有 14 天'),
        alarm('-PT9H',c.name+' 今天是退保通知最后一天'),
        ['END:VEVENT']);
    }
    L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-end@scrooge','DTSTAMP:'+icsStamp(),
        'DTSTART;VALUE=DATE:'+ds(eventDate),
        'SUMMARY:'+icsEsc(c.category)+(isRenewal?' 续约：':' 到期：')+icsEsc(c.name)+icsEsc(mny),
        'DESCRIPTION:'+icsEsc(desc)],
      alarm('-P7D',c.name+' 7 天后'+(isRenewal?'续约':'到期')), ['END:VEVENT']);
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

function toast(msg,actionLabel,actionFn){
  var el=document.getElementById('toast');

  text.textContent=msg; el.appendChild(text);
  if(actionLabel&&actionFn){
    var action=document.createElement('button');
    action.className='toast-action'; action.textContent=actionLabel;
    action.onclick=function(){
      clearTimeout(toastT);

  }else if(comma>=0){
    s=s.replace(/\./g,'').replace(',','.');

var CW=320, CH=138, chartStore={}, chartSeq=0;

function chartNiceStep(v){
  var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)), n=v/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;
}
function chartScale(vs){
  var rawMin=Math.min.apply(null,vs.concat([0]));
  var rawMax=Math.max.apply(null,vs.concat([0]));
  if(rawMin===rawMax) rawMax=rawMin+(Math.abs(rawMin)||1);
  var step=chartNiceStep((rawMax-rawMin)/3);
  var lo=Math.floor(rawMin/step)*step, hi=Math.ceil(rawMax/step)*step;
  if(lo===hi) hi=lo+step;
  var ticks=[], v;
  for(v=lo;v<=hi+step*.25;v+=step) ticks.push(Math.abs(v)<step/1000?0:v);
  if(ticks.length>6){
    step*=2; lo=Math.floor(rawMin/step)*step; hi=Math.ceil(rawMax/step)*step; ticks=[];
    for(v=lo;v<=hi+step*.25;v+=step) ticks.push(Math.abs(v)<step/1000?0:v);
  }
  return {min:lo,max:hi,ticks:ticks};
}
function chartShortNumber(v){
  var a=Math.abs(v), opts={maximumFractionDigits:1};
  if(a>=1000000) return (v/1000000).toLocaleString('de-DE',opts)+'M';
  if(a>=1000) return (v/1000).toLocaleString('de-DE',opts)+'k';
  if(a>0&&a<10&&Math.round(a)!==a) return v.toLocaleString('de-DE',opts);
  return n0(v);
}
function chartDateLong(d){
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)) return fmtDate(d);
  if(/^\d{4}-\d{2}$/.test(d)){ var p=d.split('-'); return p[1]+'.'+p[0]; }
  return d;
}
function chartDateShort(d){
  var p=d.split('-');
  if(p.length===3) return p[2]+'.'+p[1]+'.';
  if(p.length===2) return p[1]+'.'+p[0].slice(2);
  return d;
}
function chartGrid(scale,Y){
  return scale.ticks.map(function(v){
    var y=Y(v).toFixed(1), cls=Math.abs(v)<1e-9?'chart-zero':'chart-grid';
    return '<line class="'+cls+'" x1="0" y1="'+y+'" x2="'+CW+'" y2="'+y+'"/>';
  }).join('');
}
function chartYAxis(scale,Y,unit){
  return '<span class="chart-y-unit">'+esc(unit||'')+'</span>'+
    scale.ticks.map(function(v){
      return '<span class="chart-y-label" style="top:'+(Y(v)/CH*100).toFixed(2)+'%">'+
        esc(chartShortNumber(v))+'</span>';
    }).join('');
}
function chartXLabels(data,points,every,line){
  var idx=[], seen={}, i;
  if(line){
    idx=[0,Math.floor((data.length-1)/2),data.length-1];
    data.forEach(function(point,k){if(point.today) idx.push(k);});
  }else{
    for(i=0;i<data.length;i+=every) idx.push(i);
    idx.push(data.length-1);
  }
  idx=idx.filter(function(k){
    if(seen[k]) return false;
    seen[k]=true; return true;
  });
  idx.sort(function(a,b){return a-b;});
  if(line){
    var todayIndex=data.findIndex(function(point){return point.today;});
    if(todayIndex>=0) idx=idx.filter(function(k){
      return k===todayIndex||Math.abs(points[k].x-points[todayIndex].x)>=44;
    });
  }
  if(!line&&idx.length>1){
    var last=idx[idx.length-1], prev=idx[idx.length-2];
    if(points[last].x-points[prev].x<44) idx.splice(idx.length-2,1);
  }
  return idx.map(function(k){
    var cls=(k===0?' first':(k===data.length-1?' last':''))+(data[k].today?' today':'');
    return '<span class="chart-x-label'+cls+'" style="left:'+(points[k].x/CW*100).toFixed(2)+'%">'+
      esc(chartDateShort(data[k].date))+'</span>';
  }).join('');
}
function chartPointDate(st,index){
  var point=st.data[index], prefix=point.phase==='actual'?'实际 · ':
    (point.phase==='forecast'?'预测 · ':'');
  return prefix+chartDateLong(point.date);
}
function chartSeriesReadout(st,index){

  return '<div class="chart-series-readout" data-chart-series-readout>'+
    st.series.map(function(series){
      var value=series.key==='total'?point.value:(point.values[series.key]||0);
      return '<span data-series-key="'+esc(series.key)+'">'+
        '<i style="background:'+series.color+'" aria-hidden="true"></i>'+
        '<b>'+esc(series.label)+'</b>'+
        '<strong class="tnum" data-series-value>'+esc(st.fmt(value))+'</strong></span>';
    }).join('')+'</div>';
}
function chartAriaLabel(st,index){
  var point=st.data[index], text=st.label+'，'+chartPointDate(st,index)+'，'+st.fmt(point.value);
  if(st.series) text+='，'+st.series.map(function(series){
    var value=series.key==='total'?point.value:(point.values[series.key]||0);
    return series.label+' '+st.fmt(value);
  }).join('，');
  return text;
}
function chartMarkup(st,marks,scale,Y,every,line){
  var p=st.points[st.selected], col=p.color||st.color;
  return '<div class="chart-shell" id="'+st.id+'" data-chart-shell="'+st.id+'">'+
    '<div class="chart-readout" id="'+st.id+'-readout" role="status" aria-live="polite" aria-atomic="true">'+
      '<span data-chart-date>'+esc(chartPointDate(st,st.selected))+'</span>'+
      '<strong class="tnum" data-chart-value>'+esc(st.fmt(p.value))+'</strong></div>'+
    chartSeriesReadout(st,st.selected)+
    '<div class="chart-frame"><div class="chart-y-axis" aria-hidden="true">'+
      chartYAxis(scale,Y,st.unit)+'</div><div class="chart-plot">'+
      '<svg class="chart interactive-chart" data-chart-id="'+st.id+'" viewBox="0 0 '+CW+' '+CH+
        '" preserveAspectRatio="none" role="img" tabindex="0" aria-describedby="'+st.id+'-readout"'+
        ' aria-label="'+esc(chartAriaLabel(st,st.selected))+'"'+
        ' onpointerdown="chartPointerDown(event,\''+st.id+'\')"'+
        ' onpointermove="chartPointerMove(event,\''+st.id+'\')"'+
        ' onpointerup="chartPointerUp(event,\''+st.id+'\')"'+
        ' onpointercancel="chartPointerCancel(event)"'+
        ' onkeydown="chartKey(event,\''+st.id+'\')">'+
        chartGrid(scale,Y)+marks+
        '<g class="chart-focus" aria-hidden="true">'+
          '<line class="chart-focus-line" x1="'+p.x+'" y1="0" x2="'+p.x+'" y2="'+CH+'"/>'+
          '<circle class="chart-focus-dot" cx="'+p.x+'" cy="'+p.y+'" r="4" fill="var(--card)" stroke="'+col+'"/>'+
        '</g></svg>'+
      '<div class="chart-x-axis" aria-hidden="true">'+chartXLabels(st.data,st.points,every,line)+'</div>'+
    '</div></div></div>';
}
function selectChartPoint(id,index){
  var st=chartStore[id], shell=document.getElementById(id);
  if(!st||!shell) return;
  index=Math.max(0,Math.min(st.points.length-1,index));
  st.selected=index;
  var p=st.points[index], svg=shell.querySelector('svg');
  shell.querySelector('[data-chart-date]').textContent=chartPointDate(st,index);
  shell.querySelector('[data-chart-value]').textContent=st.fmt(p.value);
  var seriesReadout=shell.querySelector('[data-chart-series-readout]');
  if(seriesReadout) seriesReadout.outerHTML=chartSeriesReadout(st,index);
  var line=svg.querySelector('.chart-focus-line'), dot=svg.querySelector('.chart-focus-dot');
  line.setAttribute('x1',p.x); line.setAttribute('x2',p.x);
  dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y);
  dot.setAttribute('stroke',p.color||st.color);
  var bars=svg.querySelectorAll('.chart-bar');
  Array.prototype.forEach.call(bars,function(b){
    b.classList.toggle('selected',parseInt(b.getAttribute('data-bar-index'),10)===index);
  });
  svg.setAttribute('aria-label',chartAriaLabel(st,index));
}
function chartPointFromPointer(e,id){
  var st=chartStore[id], svg=e.currentTarget;
  if(!st||!svg) return;
  var r=svg.getBoundingClientRect();
  if(!r.width) return;
  var x=Math.max(0,Math.min(CW,(e.clientX-r.left)/r.width*CW));
  var best=0, dist=Infinity;
  st.points.forEach(function(p,i){
    var d=Math.abs(p.x-x); if(d<dist){dist=d;best=i;}
  });
  selectChartPoint(id,best);
}
function chartPointerDown(e,id){
  e.currentTarget._chartDragging=true;
  try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  chartPointFromPointer(e,id);
}
function chartPointerMove(e,id){
  if(e.pointerType==='mouse'||e.currentTarget._chartDragging) chartPointFromPointer(e,id);
}
function chartPointerUp(e,id){
  chartPointFromPointer(e,id);
  e.currentTarget._chartDragging=false;
}
function chartPointerCancel(e){ e.currentTarget._chartDragging=false; }
function chartKey(e,id){
  var st=chartStore[id], next;
  if(!st) return;
  if(e.key==='ArrowLeft') next=st.selected-1;
  else if(e.key==='ArrowRight') next=st.selected+1;
  else if(e.key==='Home') next=0;
  else if(e.key==='End') next=st.points.length-1;
  else return;
  e.preventDefault(); selectChartPoint(id,next);
}
function lineChart(data,color,fmt,unit,label){
  if(data.length<2) return '<p class="dim">数据不足</p>';
  color=color||'var(--gold)'; fmt=fmt||n0; unit=unit||''; label=label||'趋势图';
  var scale=chartScale(data.map(function(d){return d.value;}));
  var top=18,bottom=6,span=scale.max-scale.min;
  var X=function(i){ return 2+(i/(data.length-1))*(CW-4); };
  var Y=function(v){ return top+((scale.max-v)/span)*(CH-top-bottom); };
  var points=data.map(function(p,i){
    return {x:X(i),y:Y(p.value),value:p.value,date:p.date,color:color};
  });
  var d=points.map(function(p,i){
    return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);
  }).join(' ');
  var base=Y(0);
  var area=d+' L'+points[points.length-1].x.toFixed(1)+','+base.toFixed(1)+
    ' L'+points[0].x.toFixed(1)+','+base.toFixed(1)+' Z';
  var marks='<path d="'+area+'" fill="'+color+'" opacity=".13"/>'+
    '<path d="'+d+'" stroke="'+color+'" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>';
  var id='chart-'+(++chartSeq), selected=data.length-1;
  chartStore[id]={id:id,data:data,points:points,selected:selected,color:color,fmt:fmt,unit:unit,label:label};
  return chartMarkup(chartStore[id],marks,scale,Y,1,true);
}
function barChart(data,fmt,colorFn,every,unit,label){
  if(!data.length) return '<p class="dim">暂无数据</p>';
  fmt=fmt||n0; every=every||Math.max(1,Math.ceil(data.length/6));
  unit=unit||''; label=label||'柱状图';
  var scale=chartScale(data.map(function(d){return d.value;}));
  var top=18,bottom=6,span=scale.max-scale.min,step=CW/data.length,bw=step*.62;
  var Y=function(v){ return top+((scale.max-v)/span)*(CH-top-bottom); };
  var zy=Y(0), selected=data.length-1, points=[], marks='';
  data.forEach(function(p,i){
    var y=Y(p.value), barTop=Math.min(y,zy), bh=Math.max(1.5,Math.abs(zy-y));
    var col=colorFn?colorFn(p.value):(p.value<0?'var(--red)':'var(--gold)');
    var x=i*step+step/2;
    points.push({x:x,y:y,value:p.value,date:p.date,color:col});
    marks+='<rect class="chart-bar'+(i===selected?' selected':'')+'" data-bar-index="'+i+
      '" x="'+(x-bw/2).toFixed(1)+'" y="'+barTop.toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+bh.toFixed(1)+'" rx="2" fill="'+col+'" opacity=".92"/>';
  });
  var id='chart-'+(++chartSeq);
  chartStore[id]={id:id,data:data,points:points,selected:selected,color:'var(--gold)',
    fmt:fmt,unit:unit,label:label};
  return chartMarkup(chartStore[id],marks,scale,Y,every,false);
}

var TABS=[

function navRootForView(v){
  if(['energy','power','gas'].indexOf(v)>=0) return 'energy';
  if(['save','transactions','estate','debts','retire'].indexOf(v)>=0) return 'funds';
  if(['rights','ctr','coupons'].indexOf(v)>=0) return 'rights';

function renderNav(){
  var nav=document.getElementById('nav'), root=navRootForView(view);

    nav.innerHTML=TABS.map(function(t){

        icon(t.icon,false)+'<span>'+t.label+'</span></button>';
    }).join('');
  }
  Array.prototype.forEach.call(nav.children,function(button,index){
    var tab=TABS[index], selected=root===tab.k;

    else button.removeAttribute('aria-current');

    if(glyph) glyph.className=(selected?'ph-fill':'ph')+' ph-'+tab.icon;
  });

function navGo(v,at){
  if(v==='funds'){
    var now=isFinite(at)?Number(at):Date.now();
    saveSecretTaps=saveSecretTaps.filter(function(t){return now-t<=RETIREMENT_TAP_WINDOW;});
    saveSecretTaps.push(now);

      saveSecretTaps=[];
      return go('retire');
    }
  }else saveSecretTaps=[];

/* ================= 弹层 ================= */
function openSheet(title,html){
  var sheet=document.getElementById('sheet'), shell=document.querySelector('.app-shell'), nav=document.getElementById('nav');
  clearTimeout(sheetClearT);
  clearTimeout(sheetScrollResetT);
  if(!sheet.classList.contains('open')) sheetTrigger=document.activeElement;
  document.getElementById('sheetTitle').textContent=title;
  var sheetBody=document.getElementById('sheetBody');
  sheetBody.innerHTML=html;
  sheetBody.scrollTop=0;
  sheet.removeAttribute('inert');
  sheet.setAttribute('aria-hidden','false');
  if(shell) shell.setAttribute('inert','');
  if(nav) nav.setAttribute('inert','');
  sheet.classList.add('open');
  document.body.style.overflow='hidden';
  requestAnimationFrame(function(){
    sheetBody.scrollTop=0;
    requestAnimationFrame(function(){sheetBody.scrollTop=0;});
  });
  sheetScrollResetT=setTimeout(function(){
    if(sheet.classList.contains('open')) sheetBody.scrollTop=0;
  },280);
  setTimeout(function(){ if(sheet.classList.contains('open')) sheet.focus(); },0);
}
function closeSheet(){
  var sheet=document.getElementById('sheet'), shell=document.querySelector('.app-shell'), nav=document.getElementById('nav');
  if(!sheet) return;
  clearTimeout(sheetScrollResetT);
  if(typeof couponStopQrScanner==='function') couponStopQrScanner();
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
  sheet.setAttribute('inert','');
  if(shell) shell.removeAttribute('inert');
  if(nav) nav.removeAttribute('inert');
  document.body.style.overflow='';
  var restore=sheetTrigger; sheetTrigger=null;
  sheetClearT=setTimeout(function(){
    if(!sheet.classList.contains('open')) document.getElementById('sheetBody').innerHTML='';
    if(restore&&restore.isConnected&&restore.focus) restore.focus();
  },250);
  if(updatePending) setTimeout(function(){ refreshApp(true); },280);
}
document.addEventListener('keydown',function(event){
  var sheet=document.getElementById('sheet');
  if(event.key==='Escape'&&sheet&&sheet.classList.contains('open')){
    event.preventDefault(); closeSheet(); return;
  }
  if(event.key!=='Tab'||!sheet||!sheet.classList.contains('open')) return;
  var focusable=Array.prototype.slice.call(sheet.querySelectorAll(
    'button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )).filter(function(el){return !el.hasAttribute('inert')&&el.offsetParent!==null;});
  if(!focusable.length) return;
  var first=focusable[0], last=focusable[focusable.length-1];
  if(event.shiftKey&&document.activeElement===first){
    event.preventDefault(); last.focus();
  }else if(!event.shiftKey&&document.activeElement===last){
    event.preventDefault(); first.focus();
  }
});

var KDF_ITERATIONS=310000;
var vaultKey=null, vaultEnvelope=null, pendingState=null;
var saveQueue=Promise.resolve(), hiddenAt=0, vaultStarted=false;

function copyState(x){ return JSON.parse(JSON.stringify(x)); }
function randomBytes(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function bytesToB64(bytes){
  var s='', step=32768;
  for(var i=0;i<bytes.length;i+=step)
    s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
  return btoa(s);
}
function b64ToBytes(s){
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function b64Url(bytes){ return bytesToB64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlBytes(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  return b64ToBytes(s);
}
function subtle(){
  if(!window.crypto || !crypto.subtle) throw new Error('当前浏览器不支持加密，请使用最新版 Safari 或 Chrome');
  return crypto.subtle;
}
async function deriveVaultKey(password,salt,iterations){
  var raw=await subtle().importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return subtle().deriveKey(
    {name:'PBKDF2',salt:salt,iterations:iterations||KDF_ITERATIONS,hash:'SHA-256'},
    raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptTextWithKey(text,key,kdf,format){
  var iv=randomBytes(12);
  var encrypted=await subtle().encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));
  return {
    format:format,version:2,
    kdf:{name:'PBKDF2',hash:'SHA-256',iterations:kdf.iterations,salt:kdf.salt},
    cipher:{name:'AES-GCM',iv:bytesToB64(iv)},
    data:bytesToB64(new Uint8Array(encrypted))
  };
}
async function decryptTextWithKey(envelope,key){
  if(!envelope || envelope.version!==2 || !envelope.kdf || !envelope.cipher || !envelope.data)
    throw new Error('不是有效的加密金库文件');
  var plain=await subtle().decrypt(
    {name:'AES-GCM',iv:b64ToBytes(envelope.cipher.iv)},
    key,b64ToBytes(envelope.data));
  return new TextDecoder().decode(plain);
}
async function keyForEnvelope(password,envelope){
  return deriveVaultKey(password,b64ToBytes(envelope.kdf.salt),envelope.kdf.iterations);
}
function assertState(p){
  if(!p || !Array.isArray(p.accounts) || !Array.isArray(p.txs) ||
     !Array.isArray(p.readings) || !Array.isArray(p.contracts))
    throw new Error('备份内容结构不完整');
  if(p.coupons==null) p.coupons=[];
  if(p.debts==null) p.debts=[];
  if(p.mortgages==null) p.mortgages=[];
  if(p.mortgagePayments==null) p.mortgagePayments=[];
  if(p.specialRepayments==null) p.specialRepayments=[];
  if(p.tenancies==null) p.tenancies=[];
  if(p.rentPayments==null) p.rentPayments=[];
  if(!Array.isArray(p.coupons)||!Array.isArray(p.debts)||
     !Array.isArray(p.mortgages)||!Array.isArray(p.mortgagePayments)||
     !Array.isArray(p.specialRepayments)||!Array.isArray(p.tenancies)||!Array.isArray(p.rentPayments))
    throw new Error('家庭记录结构不完整');
  p.coupons.forEach(function(coupon){
    coupon.currency=['EUR','RMB','POINTS'].indexOf(coupon.currency)>=0?coupon.currency:'EUR';
    if(coupon.valueType==='percent') coupon.currency='EUR';
    if(coupon.image&&(!coupon.image.dataUrl||
      !/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(coupon.image.dataUrl)||
      coupon.image.dataUrl.length>420000)) coupon.image=null;
  });
  (p.meters||[]).forEach(function(meter){
    if(typeof meter.provider!=='string') meter.provider='';
    if(!isDate(meter.contractEndDate||'')) meter.contractEndDate=null;
    if(!isDate(meter.contractStartDate||''))
      meter.contractStartDate=meter.contractEndDate?addYearsIso(meter.contractEndDate,-1):null;
    if(meter.contractStartReading==null||meter.contractStartReading===''||
      !isFinite(Number(meter.contractStartReading))||Number(meter.contractStartReading)<0)
      meter.contractStartReading=null;
    else meter.contractStartReading=Number(meter.contractStartReading);
    if(!isFinite(Number(meter.annualQuota))||Number(meter.annualQuota)<0) meter.annualQuota=0;
    else meter.annualQuota=Number(meter.annualQuota);
    meter.quotaUnit=meter.unit==='m3'&&meter.quotaUnit==='m3'?'m3':'kWh';
    if(meter.id==='m-karl-power'){
      meter.ocrIntegerDigits=6;
      meter.ocrDecimals=1;
    }else if(meter.id==='m-karl-gas'){
      meter.ocrIntegerDigits=5;
      meter.ocrDecimals=2;
    }
  });
  return p;
}
function freshKdf(){
  return {iterations:KDF_ITERATIONS,salt:bytesToB64(randomBytes(16))};
}

async function persistSnapshot(snapshot,key,kdf){
  var env=await encryptTextWithKey(snapshot,key,kdf,'scrooge-vault-local');
  localStorage.setItem(ENC_KEY,JSON.stringify(env));
  vaultEnvelope=env;
  return env;
}
function save(){
  if(!S || !vaultKey || !vaultEnvelope) return Promise.resolve(false);
  if(typeof syncLocalChanged==='function') syncLocalChanged();
  var snapshot=JSON.stringify(S), key=vaultKey;
  var kdf={iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
  saveQueue=saveQueue.catch(function(){}).then(function(){
    return persistSnapshot(snapshot,key,kdf);
  }).catch(function(e){
    toast('加密保存失败：'+e.message);
    throw e;
  });
  return saveQueue;
}

async function setupVault(){
  var p=val('setup_pw'), p2=val('setup_pw2');
  if(p.length<8) return setLockError('主密码至少需要 8 位');
  if(p!==p2) return setLockError('两次输入的密码不一致');
  try{
    var kdf=freshKdf();
    vaultKey=await deriveVaultKey(p,b64ToBytes(kdf.salt),kdf.iterations);
    vaultEnvelope={kdf:kdf};
    S=assertState(pendingState||copyState(SEED));
    await persistSnapshot(JSON.stringify(S),vaultKey,kdf);
    localStorage.removeItem(KEY);
    pendingState=null;

    vaultEnvelope=env; vaultKey=key; S=Object.assign({},SEED,state);

  });

/* ================= 家庭端到端加密同步 ================= */
var SYNC_CONFIG_KEY='scrooge.vault.sync.config.v1';
var SYNC_META_KEY='scrooge.vault.sync.meta.v1';
var SYNC_FILE_PATH='vault.sync.json';
var SYNC_RETRY_DELAYS=[350,900];
var syncTimer=null, syncPollTimer=null, syncRunning=null, syncAbortController=null;
var syncEditVersion=0, syncSession=0;
var syncStatus={kind:'off',text:'家庭同步未设置',detail:''};

function syncClone(value){
  return value===undefined?undefined:JSON.parse(JSON.stringify(value));
}
function syncSame(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function syncObject(value){
  return value!==null&&typeof value==='object'&&!Array.isArray(value);
}
function syncIdArrays(values){
  var found=false;
  for(var i=0;i<values.length;i++){
    var value=values[i];
    if(value===undefined) continue;
    if(!Array.isArray(value)) return false;
    for(var j=0;j<value.length;j++){
      found=true;
      if(!syncObject(value[j])||typeof value[j].id!=='string') return false;
    }
  }
  return found;
}
function syncMergeValue(base,local,remote,path,context){
  if(syncSame(local,remote)) return syncClone(local);
  if(syncSame(local,base)) return syncClone(remote);
  if(syncSame(remote,base)) return syncClone(local);

  if(syncIdArrays([base,local,remote])){
    var maps=[{}, {}, {}], order=[], seen={};
    [base||[],remote||[],local||[]].forEach(function(list,listIndex){
      list.forEach(function(item){
        maps[listIndex][item.id]=item;
        if(!seen[item.id]){ seen[item.id]=1; order.push(item.id); }
      });
    });
    return order.map(function(id){
      return syncMergeValue(maps[0][id],maps[2][id],maps[1][id],
        path+'['+id+']',context);
    }).filter(function(item){return item!==undefined;});
  }

  if(syncObject(local)&&syncObject(remote)&&(base===undefined||syncObject(base))){
    var keys={}, out={};
    Object.keys(base||{}).concat(Object.keys(local),Object.keys(remote)).forEach(function(k){
      keys[k]=1;
    });
    Object.keys(keys).forEach(function(k){
      var merged=syncMergeValue(base&&base[k],local[k],remote[k],
        path?(path+'.'+k):k,context);
      if(merged!==undefined) out[k]=merged;
    });
    return out;
  }

  context.conflicts.push(path||'state');
  return syncClone(context.preferLocal?local:remote);
}
function syncStateEmpty(state){
  if(!state) return true;
  return ['properties','meters','readings','txs','contracts','coupons','debts','mortgages',
    'mortgagePayments','specialRepayments','tenancies','rentPayments'].every(function(k){
    return !Array.isArray(state[k])||state[k].length===0;
  });
}
function syncMergeStates(base,local,remote,preferLocal){
  if(!base&&syncStateEmpty(local)&&!syncStateEmpty(remote))
    return {state:syncClone(remote),conflicts:[]};
  if(!base&&syncStateEmpty(remote)&&!syncStateEmpty(local))
    return {state:syncClone(local),conflicts:[]};
  var context={preferLocal:!!preferLocal,conflicts:[]};
  var state=syncMergeValue(base||{},local,remote,'',context);
  return {state:assertState(Object.assign({},SEED,state)),conflicts:context.conflicts};
}

function readSyncMeta(){
  try{ return JSON.parse(localStorage.getItem(SYNC_META_KEY)||'{}'); }
  catch(e){ return {}; }
}
function writeSyncMeta(patch){
  var meta=Object.assign({},readSyncMeta(),patch||{});
  localStorage.setItem(SYNC_META_KEY,JSON.stringify(meta));

}
async function readSyncConfig(key){

  if(!useKey||env.format!=='scrooge-vault-sync-config')
    throw new Error('本机同步设置无法解密');
  return JSON.parse(await decryptTextWithKey(env,useKey));
}
async function writeSyncConfig(config,key,kdf){
  var useKey=key||vaultKey;
  var useKdf=kdf||{iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
  var env=await encryptTextWithKey(JSON.stringify(config),useKey,useKdf,
    'scrooge-vault-sync-config');
  localStorage.setItem(SYNC_CONFIG_KEY,JSON.stringify(env));
  writeSyncMeta({
    configured:true,auto:config.auto!==false,repo:config.repo,branch:config.branch,
    deviceName:config.deviceName
  });
}
function syncDeviceId(){
  return b64Url(randomBytes(18));
}
function syncRepoParts(repo){
  var match=String(repo||'').trim().match(/^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/);
  if(!match) throw new Error('仓库格式应为 owner/repo');
  return {owner:match[1],repo:match[2]};
}
function syncApiUrl(config){
  var p=syncRepoParts(config.repo);
  var path=SYNC_FILE_PATH.split('/').map(encodeURIComponent).join('/');
  return 'https://api.github.com/repos/'+encodeURIComponent(p.owner)+'/'+
    encodeURIComponent(p.repo)+'/contents/'+path;
}
function syncGithubBlobUrl(config,sha){
  var p=syncRepoParts(config.repo);
  return 'https://api.github.com/repos/'+encodeURIComponent(p.owner)+'/'+
    encodeURIComponent(p.repo)+'/git/blobs/'+encodeURIComponent(sha);
}
function syncRetryableStatus(status){
  return status===401||status===403||status===429||status>=500;
}
function syncGithubError(status,data){
  var message;
  if(status===401||status===403)
    message='GitHub 令牌无效、没有仓库权限，或 GitHub 认证暂时不可用';
  else if(status===429) message='GitHub 请求过于频繁，请稍后重试';
  else message=(data&&data.message)||('GitHub 请求失败 ('+status+')');
  var err=new Error(message);
  err.status=status;
  return err;
}
function syncNetworkError(){
  return new Error('GitHub 暂时无法连接，已保留本机数据，请稍后重试');
}
function syncRetryWait(delay){
  return new Promise(function(resolve){setTimeout(resolve,delay);});
}
async function syncGithubRequest(config,method,body,query,urlOverride){
  var url=(urlOverride||syncApiUrl(config))+(query?('?'+query):'');
  var delays=method==='GET'?SYNC_RETRY_DELAYS:[], attempt=0;
  while(true){
    var response;
    try{
      response=await fetch(url,{
        method:method,
        headers:{
          Accept:'application/vnd.github+json',
          Authorization:'Bearer '+config.token,
          'X-GitHub-Api-Version':'2022-11-28',
          'Content-Type':'application/json'
        },
        body:body?JSON.stringify(body):undefined,
        signal:syncAbortController?syncAbortController.signal:undefined,
        cache:'no-store'
      });
    }catch(e){
      if(e&&e.name==='AbortError') throw e;
      if(attempt<delays.length){
        await syncRetryWait(delays[attempt++]);
        continue;
      }
      throw syncNetworkError();
    }
    var data=null, invalidJson=false;
    try{ data=await response.json(); }catch(e){ invalidJson=true; }
    if(response.status===404&&method==='GET') return null;
    if(response.ok&&!invalidJson) return data;
    if(attempt<delays.length&&(invalidJson||syncRetryableStatus(response.status))){
      await syncRetryWait(delays[attempt++]);
      continue;
    }
    if(response.ok&&invalidJson) throw syncNetworkError();
    throw syncGithubError(response.status,data);
  }
}
async function syncReadCloud(config){
  var data=await syncGithubRequest(config,'GET',null,
    'ref='+encodeURIComponent(config.branch||'main'));
  if(!data) return null;
  var encoded=String(data.content||'').replace(/\s/g,'');
  if(!encoded||data.encoding==='none'){
    if(!data.sha) throw new Error('云端同步文件读取不完整，请稍后重试');
    var blob=await syncGithubRequest(config,'GET',null,null,syncGithubBlobUrl(config,data.sha));
    encoded=String(blob&&blob.content||'').replace(/\s/g,'');
  }
  if(!encoded) throw new Error('云端同步文件读取不完整，请稍后重试');
  var raw=new TextDecoder().decode(b64ToBytes(encoded)), envelope;
  if(!raw) throw new Error('云端同步文件读取不完整，请稍后重试');
  try{ envelope=JSON.parse(raw); }
  catch(e){ throw new Error('云端同步文件读取不完整，请稍后重试'); }
  return {sha:data.sha,envelope:envelope};
}
async function syncWriteCloud(config,envelope,sha){
  var content=bytesToB64(new TextEncoder().encode(JSON.stringify(envelope)));
  var body={
    message:"Update encrypted Scrooge's Safe vault",
    content:content,branch:config.branch||'main'
  };
  if(sha) body.sha=sha;
  return syncGithubRequest(config,'PUT',body);
}
async function encryptSyncPayload(payload,password){
  var kdf=freshKdf();
  var key=await deriveVaultKey(password,b64ToBytes(kdf.salt),kdf.iterations);
  return encryptTextWithKey(JSON.stringify(payload),key,kdf,'scrooge-vault-sync');
}
async function decryptSyncPayload(envelope,password){
  if(!envelope||envelope.format!=='scrooge-vault-sync')
    throw new Error('云端文件不是 Scrooge\'s Safe 加密同步数据');
  try{
    var key=await keyForEnvelope(password,envelope);
    var payload=JSON.parse(await decryptTextWithKey(envelope,key));
    payload.state=assertState(Object.assign({},SEED,payload.state));
    return payload;
  }catch(e){
    if(e.message&&e.message.indexOf('云端文件')>=0) throw e;
    throw new Error('同步密码错误，或云端密文已损坏');
  }
}

async function syncOnce(config,session){
  syncAssertSession(session);
  await saveQueue.catch(function(){});
  syncAssertSession(session);
  var meta=readSyncMeta(), startVersion=syncEditVersion;
  var local=syncClone(S), cloud=await syncReadCloud(config);
  syncAssertSession(session);

  if(!cloud){
    if(syncEditVersion!==startVersion) throw {retry:true};
    var firstPayload={
      schema:1,revision:1,updatedAt:new Date().toISOString(),
      deviceId:config.deviceId,deviceName:config.deviceName,state:local
    };
    var firstEnvelope=await encryptSyncPayload(firstPayload,config.password);
    syncAssertSession(session);
    await syncWriteCloud(config,firstEnvelope,null);
    syncAssertSession(session);
    config.baseState=syncClone(local);
    config.revision=1;
    return {config:config,state:local,localAtStart:local,editVersion:startVersion,
      conflicts:[],uploaded:true};
  }

  var remotePayload=await decryptSyncPayload(cloud.envelope,config.password);
  syncAssertSession(session);
  var localChanged=new Date(meta.localChangedAt||0).getTime();
  var remoteChanged=new Date(remotePayload.updatedAt||0).getTime();
  var merged=syncMergeStates(config.baseState||null,local,remotePayload.state,
    localChanged>=remoteChanged);
  if(syncEditVersion!==startVersion) throw {retry:true};

  var needsUpload=!syncSame(merged.state,remotePayload.state);
  var revision=Number(remotePayload.revision)||0;
  if(needsUpload){
    var nextPayload={
      schema:1,revision:revision+1,updatedAt:new Date().toISOString(),
      deviceId:config.deviceId,deviceName:config.deviceName,state:merged.state
    };
    var envelope=await encryptSyncPayload(nextPayload,config.password);
    syncAssertSession(session);
    try{
      await syncWriteCloud(config,envelope,cloud.sha);
      syncAssertSession(session);
      revision++;
    }catch(e){
      if(e.status===409||e.status===422) throw {retry:true};
      throw e;
    }
  }
  config.baseState=syncClone(merged.state);
  config.revision=revision;
  return {config:config,state:merged.state,localAtStart:local,editVersion:startVersion,
    conflicts:merged.conflicts,uploaded:needsUpload};
}
async function runSync(options){
  options=options||{};
  if(!S||!vaultKey) return false;
  var meta=readSyncMeta();
  if(!meta.configured){
    if(!options.quiet) openSyncSettings();
    return false;
  }
  if(navigator.onLine===false){
    setSyncStatus('offline','当前离线','数据会保存在本机，联网后自动同步');
    if(!options.quiet) toast('当前离线，修改已安全保存在本机');
    return false;
  }

  setSyncStatus('syncing','正在加密同步…','');
  var session=syncSession;
  syncAbortController=new AbortController();
  var config=await readSyncConfig();
  syncAssertSession(session);
  if(!config||!config.token||!config.password) throw new Error('同步设置不完整');
  var result, attempts=0;
  while(attempts<4){
    attempts++;
    try{ result=await syncOnce(config,session); break; }
    catch(e){
      if(e&&e.retry){ await new Promise(function(r){setTimeout(r,180*attempts);}); continue; }
      throw e;
    }
  }
  if(!result) throw new Error('两台设备同时修改较频繁，请稍后重试');
  syncAssertSession(session);

  var stateToApply=result.state;
  if(syncEditVersion!==result.editVersion){
    var followup=syncMergeStates(result.localAtStart,S,result.state,true);
    stateToApply=followup.state;
    result.conflicts=result.conflicts.concat(followup.conflicts);
  }
  var changed=!syncSame(S,stateToApply);
  if(changed){
    S=assertState(Object.assign({},SEED,syncClone(stateToApply)));
    await saveQueue.catch(function(){});
    syncAssertSession(session);
    var kdf={iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
    await persistSnapshot(JSON.stringify(S),vaultKey,kdf);
    render();
  }
  config=result.config;
  config.lastSyncAt=new Date().toISOString();
  await writeSyncConfig(config);
  syncAssertSession(session);
  var stillPending=!syncSame(S,config.baseState);
  writeSyncMeta({
    pending:stillPending,lastSyncAt:config.lastSyncAt,lastError:'',
    conflicts:result.conflicts.length,revision:config.revision
  });
  syncRefreshStatus();
  if(stillPending) syncSchedule(500);
  if(!options.quiet)
    toast(result.conflicts.length?
      ('同步完成，'+result.conflicts.length+' 处同时修改已按较新时间合并'):'家庭数据已同步');
  return true;
}
function syncNow(options){
  if(syncRunning) return syncRunning;
  var run=runSync(options).catch(function(e){
    if(e&&(e.cancelled||e.name==='AbortError')) return false;
    var message=e&&e.message?e.message:'同步失败';
    writeSyncMeta({lastError:message});
    setSyncStatus('error','同步失败',message);
    if(!options||!options.quiet) toast('同步失败：'+message);
    return false;
  }).finally(function(){
    if(syncRunning===run){
      syncRunning=null;
      syncAbortController=null;
    }
  });
  syncRunning=run;
  return syncRunning;
}
