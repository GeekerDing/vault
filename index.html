<html lang="zh-CN">

<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="金库">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230E1116'/%3E%3Ccircle cx='90' cy='90' r='58' fill='none' stroke='%23E9B949' stroke-width='9'/%3E%3Ccircle cx='90' cy='90' r='20' fill='%23E9B949'/%3E%3Cg stroke='%23E9B949' stroke-width='9' stroke-linecap='round'%3E%3Cpath d='M90 32V52'/%3E%3Cpath d='M90 128V148'/%3E%3Cpath d='M32 90H52'/%3E%3Cpath d='M128 90H148'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#0E1116; --card:#171C24; --card2:#1F2631; --line:#2A3240;
  --tx:#F2F4F7; --dim:#8C97A8;
  --gold:#E9B949; --goldS:#3A2F14;
  --green:#3DD68C; --greenS:#12301F;
  --red:#F0616D; --redS:#341418;
  --amber:#F5A524; --amberS:#3A2A0E;
  --blue:#5B8DEF; --blueS:#16233C;
  --nav:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.86);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.3px}
header .hbtn{color:var(--dim);font-size:13px;font-weight:600;padding:6px 10px;border-radius:9px;background:var(--card2)}
.header-actions{display:flex;align-items:center;gap:7px}

/* ---------- 布局 ---------- */
main{padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:10px}
.card.gold{background:var(--goldS)} .card.green{background:var(--greenS)}
.card.red{background:var(--redS)} .card.amber{background:var(--amberS)} .card.blue{background:var(--blueS)}
.h2{font-size:17px;font-weight:700;margin:0}
.h3{font-size:14px;font-weight:600;margin:0}
.dim{color:var(--dim);font-size:12px}
.big{font-size:31px;font-weight:700;letter-spacing:-.5px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hr{height:1px;background:var(--line);margin:2px 0}
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{flex:1 1 96px;min-width:92px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:21px;font-weight:700}
.stat .v small{font-size:11px;color:var(--dim);font-weight:400}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;text-align:left;width:100%}
.row .l{flex:1;min-width:0}
.row .l b{font-weight:400;font-size:14px;display:block;overflow-wrap:anywhere}
.row .v{font-weight:600;font-size:14px;white-space:nowrap}
.row.tap:active{opacity:.55}
.badge{display:inline-block;padding:3px 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.b-gold{background:var(--goldS);color:var(--gold)} .b-dim{background:var(--card2);color:var(--dim)}
.b-green{background:var(--greenS);color:var(--green)} .b-red{background:var(--redS);color:var(--red)}
.b-amber{background:var(--amberS);color:var(--amber)} .b-blue{background:var(--blueS);color:var(--blue)}
.c-gold{color:var(--gold)} .c-green{color:var(--green)} .c-red{color:var(--red)}
.c-dim{color:var(--dim)} .c-blue{color:var(--blue)}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- 按钮 ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;
  background:var(--gold);color:#1A1405}
.btn:active{opacity:.7}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.danger{background:var(--redS);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:10px}
.btnrow{display:flex;gap:8px}
.btnrow>*{flex:1}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;
  -ms-overflow-style:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:10px;background:var(--card2);
  color:var(--tx);font-size:13px;font-weight:600}
.chip.on{background:var(--gold);color:#1A1405}

/* ---------- 表单 ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label{color:var(--dim);font-size:12px}
.field input,.field select,.field textarea{
  background:var(--card2);border-radius:10px;padding:12px;color:var(--tx);
  border:1px solid transparent;font-size:16px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--gold)}
.field .hint{color:var(--dim);font-size:11px}
.field input[type=date]{min-height:46px}
.switch{display:flex;align-items:center;justify-content:space-between;
  background:var(--card2);border-radius:10px;padding:12px}

/* ---------- 弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;flex-direction:column;transform:translateY(100%);
  transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.sheet.open{transform:translateY(0)}
.sheet>.top{display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;border-bottom:1px solid var(--line)}
.sheet>.top .h2{font-size:18px}
.sheet>.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px}
.x{color:var(--dim);font-size:26px;line-height:1;padding:0 6px}

/* ---------- 底部导航 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(23,28,36,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);display:flex;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;color:var(--dim);font-size:10px;font-weight:600}
nav button.on{color:var(--gold)}
nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- 图表 ---------- */
.chart{width:100%;display:block;overflow:visible}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%);z-index:80;background:var(--card2);color:var(--tx);
  padding:11px 17px;border-radius:12px;font-size:13px;font-weight:600;
  box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}

/* ---------- 安全锁屏 ---------- */
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;
  align-items:center;justify-content:center;padding:24px}
body.locked{overflow:hidden}
body.locked .lock{display:flex}
body.locked .app-shell,body.locked .sheet,body.locked .toast{visibility:hidden}
.lockbox{width:min(100%,390px);display:flex;flex-direction:column;gap:14px}
.vaultmark{width:66px;height:66px;border:3px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;color:var(--gold);font-size:25px;font-weight:800;margin-bottom:4px}
.lockbox h1{font-size:28px;margin:0}.lockbox p{margin:0;line-height:1.6}
.lockbox input{background:var(--card2);border:1px solid var(--line);border-radius:10px;
  padding:13px;color:var(--tx);font-size:16px;width:100%}
.lockbox input:focus{outline:0;border-color:var(--gold)}
.lock-error{min-height:18px;color:var(--red);font-size:12px}
.lock-actions{display:flex;flex-direction:column;gap:9px}

/* ---------- 导入与识别 ---------- */
.filepick{position:relative;overflow:hidden}
.filepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.import-list{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.import-row{display:grid;grid-template-columns:24px 76px 1fr auto;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.import-row input{width:18px;height:18px}.import-row .note{min-width:0;overflow-wrap:anywhere}
.ocr-preview{width:100%;max-height:230px;object-fit:contain;background:#050607;border-radius:10px}
.progress{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--gold);width:0;transition:width .2s}
</style>
</head>
<body>
<div class="lock" id="lock" aria-live="polite">
  <div class="lockbox">
    <div class="vaultmark">¥</div>
    <h1 id="lockTitle">打开金库</h1>
    <p class="dim" id="lockText"></p>
    <div id="lockFields"></div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-actions" id="lockActions"></div>
  </div>
</div>
<div class="app-shell">
  <header><h1>金库</h1><div class="header-actions">
    <button class="hbtn" onclick="lockVault()">锁定</button>
    <button class="hbtn" onclick="openSettings()">设置</button>
  </div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div class="top"><h2 class="h2" id="sheetTitle"></h2><button class="x" onclick="closeSheet()">&times;</button></div><div class="body" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<script>
var SEED={version:1,fxRmbPerEur:8,properties:[],meters:[],readings:[],accounts:[{id:"a1",name:"储蓄账户",currency:"EUR",note:""}],txs:[],contracts:[],budget:{einkommen:0,tilgung:0,autoMonat:0,grundbesitzQuartal:0,wohngebaeudeJahr:0,festkosten:[],sparZiel:0}};
/* ================= 计算引擎 =================
   逻辑与《嘘！Scrooge 的金库.xlsx》的公式逐条对齐：
   月均消耗 = (本次读数 − 上次读数) × 换算系数 ÷ 天数 × 30
   （对应 Excel  电: (E5-E4)/(B5-B4)*30   气: (Q5-Q4)*k/(M5-M4)*30 ）
   ============================================ */
var DAY = 86400000;

function toD(iso){ var p = iso.split('-'); return Date.UTC(+p[0], p[1]-1, +p[2]); }
function isoOf(ms){ return new Date(ms).toISOString().slice(0,10); }
function today(){ var n=new Date(); return isoOf(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())); }
function daysBetween(a,b){ return Math.round((toD(b)-toD(a))/DAY); }
function addDays(d,n){ return isoOf(toD(d)+n*DAY); }
function fmtDate(d){ if(!d) return '—'; var p=d.split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function isDate(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); }

/** 结算年度起点：以 Ablesetermin (MM-DD) 为分界 */
function periodStart(d, term){
  var t=term.split('-'), am=+t[0], ad=+t[1];
  var dt=new Date(toD(d)), y=dt.getUTCFullYear();
  var cut=Date.UTC(y,am-1,ad);
  return isoOf(toD(d)>=cut ? cut : Date.UTC(y-1,am-1,ad));
}

function n0(v){ return Math.round(v).toLocaleString('de-DE'); }
function n2(v){ return v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function eur(v){ return (v<0?'−':'')+n2(Math.abs(v))+' €'; }
function money(v,cur){ return (v<0?'−':'')+n2(Math.abs(v))+' '+(cur==='EUR'?'€':'¥'); }

function sortByDate(a){ return a.slice().sort(function(x,y){ return x.date<y.date?-1:x.date>y.date?1:0; }); }
function meterReadings(readings,id){ return sortByDate(readings.filter(function(r){return r.meterId===id;})); }

/** 每两次抄表之间的区间 */
function intervals(rs,m){
  var s=sortByDate(rs), out=[];
  for(var i=1;i<s.length;i++){
    var days=daysBetween(s[i-1].date,s[i].date);
    var safe=days>0?days:1;
    var netRaw=s[i].value-s[i-1].value;
    var kwh=netRaw*m.factor;
    var cost=kwh*m.arbeitspreisCt/100;
    var absch=m.monthlyAbschlag*safe*12/365;
    out.push({from:s[i-1].date,to:s[i].date,days:days,netRaw:netRaw,kwh:kwh,
      avg30:kwh/safe*30, perDay:kwh/safe, cost:cost, abschlag:absch,
      delta:cost-absch, anomaly:netRaw<0, readingId:s[i].id, value:s[i].value});
  }
  return out;
}

/** 本结算年度累计 */
function currentPeriod(rs,m,now){
  now=now||today();
  var s=sortByDate(rs);
  if(s.length<2) return null;
  var start=periodStart(now,m.ableseTermin);
  // 基准 = 不晚于结算年度起点的最后一次抄表；若全都晚于起点则取第一次
  var bi=-1;
  for(var i=0;i<s.length;i++) if(s[i].date<=start) bi=i;
  if(bi<0) bi=0;
  var base=s[bi], last=s[s.length-1];
  if(base.date===last.date) return null;
  var netRaw=last.value-base.value, kwh=netRaw*m.factor;
  var days=Math.max(1,daysBetween(base.date,last.date));
  var cost=kwh*m.arbeitspreisCt/100;
  var paid=m.monthlyAbschlag*(daysBetween(base.date,now)/30.44);
  var perDay=kwh/days;
  return {start:base.date,end:last.date,kwh:kwh,netRaw:netRaw,cost:cost,
    abschlagPaid:paid, delta:cost-paid, days:days, avg30:perDay*30,
    projectedYearKwh:perDay*365, projectedYearCost:perDay*365*m.arbeitspreisCt/100};
}

function accountBalance(txs,id){
  return txs.reduce(function(s,t){ return t.accountId===id ? s+t.amount : s; },0);
}
function totalEur(txs,accounts,fx){
  return accounts.reduce(function(s,a){
    var b=accountBalance(txs,a.id);
    return s + (a.currency==='EUR' ? b : b/fx);
  },0);
}
/** 累计余额曲线（对应「存款走势」表） */
function balanceSeries(txs,ids){
  var rel=txs.filter(function(t){return ids.indexOf(t.accountId)>=0;})
             .sort(function(a,b){return a.date<b.date?-1:1;});
  var out=[],run=0;
  for(var i=0;i<rel.length;i++){
    run+=rel[i].amount;
    if(out.length && out[out.length-1].date===rel[i].date) out[out.length-1].value=run;
    else out.push({date:rel[i].date,value:run});
  }
  return out;
}
function monthlyNet(txs,ids){
  var m={};
  txs.forEach(function(t){
    if(ids.indexOf(t.accountId)<0) return;
    var k=t.date.slice(0,7); m[k]=(m[k]||0)+t.amount;
  });
  return Object.keys(m).sort().map(function(k){return {date:k,value:m[k]};});
}

var CYCLE_N={'jährlich':1,'halbjährlich':2,'quartal':4,'monatlich':12,'einmalig':0};
var CYCLE_ZH={'jährlich':'每年','halbjährlich':'每半年','quartal':'每季度','monatlich':'每月','einmalig':'一次性'};

/** 合同倒计时 */
function contractStatus(c,now){
  now=now||today();
  var yearly=(c.premium||0)*(CYCLE_N[c.cycle]||0);
  if(!c.endDate) return {daysToEnd:null,noticeDeadline:null,daysToNotice:null,
    urgency:'open', label:c.autoRenew?'自动续约 · 无固定到期':'无到期日', yearlyCost:yearly};
  var dEnd=daysBetween(now,c.endDate);
  var nd=c.noticeDays>0 ? addDays(c.endDate,-c.noticeDays) : c.endDate;
  var dNotice=daysBetween(now,nd);
  var u,label;
  if(dEnd<0){ u='expired'; label='已过期 '+Math.abs(dEnd)+' 天'; }
  else if(dNotice<=0){ u='notice'; label='退保期已过 · '+dEnd+' 天后到期'; }
  else if(dNotice<=45){ u='soon'; label=dNotice+' 天内需决定退保'; }
  else { u='ok'; label=dEnd+' 天后到期'; }
  return {daysToEnd:dEnd,noticeDeadline:nd,daysToNotice:dNotice,urgency:u,label:label,yearlyCost:yearly};
}
var URG_RANK={notice:0,expired:1,soon:2,ok:3,open:4};
var URG_TONE={expired:'red',notice:'red',soon:'amber',ok:'green',open:'blue'};
var INSURANCE=['车险','房屋险','家财险','责任险','法律险','健康险'];

/* ---------- .ics 日历文件 ---------- */
function icsEsc(s){ return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n'); }
function icsStamp(){
  var d=new Date(), p=function(n){return String(n).padStart(2,'0');};
  return d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+
         p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'Z';
}
function buildIcs(contracts){
  var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Scrooge Vault//Contracts//ZH',
         'CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:金库 · 合同到期'];
  var alarm=function(trig,desc){ return ['BEGIN:VALARM','ACTION:DISPLAY',
    'TRIGGER:'+trig,'DESCRIPTION:'+icsEsc(desc),'END:VALARM']; };
  contracts.forEach(function(c){
    if(!c.endDate) return;
    var st=contractStatus(c);
    var mny=c.premium?(' · '+c.premium.toFixed(2)+' € / '+c.cycle):'';
    var desc=[c.provider?('服务商：'+c.provider):'', c.tariff?('Tarif：'+c.tariff):'',
      c.premium?('保费：'+c.premium.toFixed(2)+' € ('+CYCLE_ZH[c.cycle]+')'):'',
      '合同期：'+fmtDate(c.startDate)+' – '+fmtDate(c.endDate),
      '退保通知期：'+c.noticeDays+' 天',
      c.autoRenew?'自动续约：是（不退保则自动延长）':'自动续约：否',
      c.notes?('备注：'+c.notes):''].filter(Boolean).join('\n');
    var ds=function(d){return d.replace(/-/g,'');};
    if(st.noticeDeadline && c.noticeDays>0){
      L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-notice@scrooge','DTSTAMP:'+icsStamp(),
        'DTSTART;VALUE=DATE:'+ds(st.noticeDeadline),
        'SUMMARY:⚠︎ 退保截止：'+icsEsc(c.name)+icsEsc(mny),
        'DESCRIPTION:'+icsEsc(desc)],
        alarm('-P14D',c.name+' 退保通知期还有 14 天'),
        alarm('-PT9H',c.name+' 今天是退保通知最后一天'),
        ['END:VEVENT']);
    }
    L=L.concat(['BEGIN:VEVENT','UID:'+c.id+'-end@scrooge','DTSTAMP:'+icsStamp(),
      'DTSTART;VALUE=DATE:'+ds(c.endDate),
      'SUMMARY:'+icsEsc(c.category)+' 到期：'+icsEsc(c.name)+icsEsc(mny),
      'DESCRIPTION:'+icsEsc(desc)],
      alarm('-P7D',c.name+' 7 天后到期'), ['END:VEVENT']);
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
/* ================= 状态与存储 ================= */
var KEY='scrooge.vault.v1';
var ENC_KEY='scrooge.vault.encrypted.v2';
var DEVICE_KEY='scrooge.vault.device.v1';
var S=null, view='home', meterSel={power:null,gas:null}, accSel='all', catSel='all', showAllTx=false;
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var toastT;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('show');},2600);
}

/* ================= 小工具 ================= */
function card(inner,tone){ return '<div class="card'+(tone?' '+tone:'')+'">'+inner+'</div>'; }
function h2(t,right){ return '<div class="between"><h2 class="h2">'+t+'</h2>'+(right||'')+'</div>'; }
function badge(t,tone){ return '<span class="badge b-'+(tone||'dim')+'">'+esc(t)+'</span>'; }
function stat(label,v,unit,tone,sub){
  return '<div class="stat"><span class="dim">'+esc(label)+'</span>'+
    '<span class="v tnum'+(tone?' c-'+tone:'')+'">'+v+(unit?' <small>'+unit+'</small>':'')+'</span>'+
    (sub?'<span class="dim">'+esc(sub)+'</span>':'')+'</div>';
}
function row(o){
  var tag = o.onclick ? 'button' : 'div';
  return '<'+tag+' class="row'+(o.onclick?' tap':'')+'"'+(o.onclick?' onclick="'+o.onclick+'"':'')+'>'+
    '<span class="l"><b>'+esc(o.label)+'</b>'+(o.sub?'<span class="dim">'+esc(o.sub)+'</span>':'')+'</span>'+
    (o.value?'<span class="v tnum'+(o.tone?' c-'+o.tone:'')+'">'+o.value+'</span>':'')+
    (o.right||'')+'</'+tag+'>';
}
function hr(){ return '<div class="hr"></div>'; }
function chips(items,cur,fn){
  return '<div class="chips">'+items.map(function(i){
    return '<button class="chip'+(i.k===cur?' on':'')+'" onclick="'+fn+'(\''+i.k+'\')">'+esc(i.label)+'</button>';
  }).join('')+'</div>';
}
function btn(t,onclick,kind){ return '<button class="btn'+(kind?' '+kind:'')+'" onclick="'+onclick+'">'+esc(t)+'</button>'; }
function field(o){
  var t=o.type||'text';
  var input = t==='textarea'
    ? '<textarea id="'+o.id+'" rows="3" placeholder="'+esc(o.ph||'')+'">'+esc(o.val||'')+'</textarea>'
    : t==='select'
      ? '<select id="'+o.id+'">'+o.opts.map(function(op){
          return '<option value="'+esc(op.k)+'"'+(op.k===o.val?' selected':'')+'>'+esc(op.label)+'</option>';}).join('')+'</select>'
      : '<input id="'+o.id+'" type="'+t+'" value="'+esc(o.val==null?'':o.val)+'"'+
        (o.step?' step="'+o.step+'"':'')+(o.inputmode?' inputmode="'+o.inputmode+'"':'')+
        ' placeholder="'+esc(o.ph||'')+'"'+(o.oninput?' oninput="'+o.oninput+'"':'')+'>';
  return '<div class="field"><label for="'+o.id+'">'+esc(o.label)+'</label>'+input+
    '<span class="hint" id="'+o.id+'_hint">'+(o.hint||'')+'</span></div>';
}
function fileField(o){
  return '<label class="btn ghost filepick">'+esc(o.label)+
    '<input id="'+o.id+'" type="file" accept="'+esc(o.accept||'*/*')+'"'+
    (o.capture?' capture="'+esc(o.capture)+'"':'')+
    (o.onchange?' onchange="'+o.onchange+'"':'')+'></label>'+
    (o.hint?'<span class="dim">'+o.hint+'</span>':'');
}
function val(id){ var e=document.getElementById(id); return e?e.value.trim():''; }
function fnum(id){ var v=val(id).replace(',','.'); var n=parseFloat(v); return isFinite(n)?n:NaN; }

/* ================= 图表 ================= */
var CW=320;
function lineChart(data,color,fmt){
  if(data.length<2) return '<p class="dim">数据不足</p>';
  color=color||'var(--gold)'; fmt=fmt||n0;
  var H=150, padB=18, h=H-padB, padL=4;
  var vs=data.map(function(d){return d.value;});
  var mn=Math.min.apply(null,vs.concat([0])), mx=Math.max.apply(null,vs);
  var lo=Math.min.apply(null,vs);          // 真实最小值，用于标签
  var span=(mx-mn)||1;
  var X=function(i){ return padL+(i/(data.length-1))*(CW-padL*2); };
  var Y=function(v){ return h-((v-mn)/span)*(h-8)-4; };
  var d=data.map(function(p,i){ return (i?'L':'M')+X(i).toFixed(1)+','+Y(p.value).toFixed(1); }).join(' ');
  var area=d+' L'+X(data.length-1).toFixed(1)+','+h+' L'+padL+','+h+' Z';
  var zy=Y(0);
  return '<svg class="chart" viewBox="0 0 '+CW+' '+H+'" preserveAspectRatio="none" height="'+H+'">'+
    '<path d="'+area+'" fill="'+color+'" opacity=".13"/>'+
    (mn<0?'<line x1="'+padL+'" y1="'+zy+'" x2="'+(CW-padL)+'" y2="'+zy+'" stroke="var(--line)"/>':'')+
    '<path d="'+d+'" stroke="'+color+'" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+X(data.length-1)+'" cy="'+Y(vs[vs.length-1])+'" r="3.5" fill="'+color+'"/>'+
    '</svg>'+
    '<div class="between"><span class="dim">'+data[0].date+' · 低 '+fmt(lo)+'</span>'+
    '<span class="dim">高 '+fmt(mx)+' · '+data[data.length-1].date+'</span></div>';
}
function barChart(data,fmt,colorFn,every){
  if(!data.length) return '<p class="dim">暂无数据</p>';
  fmt=fmt||n0; every=every||Math.max(1,Math.ceil(data.length/6));
  var H=150, padB=20, h=H-padB;
  var vs=data.map(function(d){return d.value;});
  var mn=Math.min.apply(null,vs.concat([0])), mx=Math.max.apply(null,vs.concat([0]));
  var span=(mx-mn)||1, step=CW/data.length, bw=step*0.62;
  var Y=function(v){ return h-((v-mn)/span)*(h-6)-3; };
  var zy=Y(0), out='';
  data.forEach(function(p,i){
    var y=Y(p.value), top=Math.min(y,zy), bh=Math.max(1.5,Math.abs(zy-y));
    var col=colorFn?colorFn(p.value):(p.value<0?'var(--red)':'var(--gold)');
    out+='<rect x="'+(i*step+(step-bw)/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+
      '" height="'+bh.toFixed(1)+'" rx="2" fill="'+col+'" opacity=".92"/>';
  });
  data.forEach(function(p,i){
    if(i%every) return;
    var lab=p.date.length>7?p.date.slice(2,7):p.date.slice(2);
    out+='<text x="'+(i*step+step/2).toFixed(1)+'" y="'+(H-6)+'" font-size="8" fill="var(--dim)" text-anchor="middle">'+lab+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+CW+' '+H+'" height="'+H+'">'+
    '<line x1="0" y1="'+zy+'" x2="'+CW+'" y2="'+zy+'" stroke="var(--line)"/>'+out+'</svg>'+
    '<div class="between"><span class="dim">最低 '+fmt(mn)+'</span><span class="dim">最高 '+fmt(mx)+'</span></div>';
}

/* ================= 加密存储与设备解锁 ================= */
var KDF_ITERATIONS=310000;
var vaultKey=null, vaultEnvelope=null, pendingState=null;
var saveQueue=Promise.resolve(), hiddenAt=0, vaultStarted=false;

function copyState(x){ return JSON.parse(JSON.stringify(x)); }
function randomBytes(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
function bytesToB64(bytes){
  var s='', step=32768;
  for(var i=0;i<bytes.length;i+=step)
    s+=String.fromCharCode.apply(null,bytes.subarray(i,Math.min(i+step,bytes.length)));
  return btoa(s);
}
function b64ToBytes(s){
  var raw=atob(s), out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function b64Url(bytes){ return bytesToB64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64UrlBytes(s){
  s=s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  return b64ToBytes(s);
}
function subtle(){
  if(!window.crypto || !crypto.subtle) throw new Error('当前浏览器不支持加密，请使用最新版 Safari 或 Chrome');
  return crypto.subtle;
}
async function deriveVaultKey(password,salt,iterations){
  var raw=await subtle().importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return subtle().deriveKey(
    {name:'PBKDF2',salt:salt,iterations:iterations||KDF_ITERATIONS,hash:'SHA-256'},
    raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptTextWithKey(text,key,kdf,format){
  var iv=randomBytes(12);
  var encrypted=await subtle().encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));
  return {
    format:format,version:2,
    kdf:{name:'PBKDF2',hash:'SHA-256',iterations:kdf.iterations,salt:kdf.salt},
    cipher:{name:'AES-GCM',iv:bytesToB64(iv)},
    data:bytesToB64(new Uint8Array(encrypted))
  };
}
async function decryptTextWithKey(envelope,key){
  if(!envelope || envelope.version!==2 || !envelope.kdf || !envelope.cipher || !envelope.data)
    throw new Error('不是有效的加密金库文件');
  var plain=await subtle().decrypt(
    {name:'AES-GCM',iv:b64ToBytes(envelope.cipher.iv)},
    key,b64ToBytes(envelope.data));
  return new TextDecoder().decode(plain);
}
async function keyForEnvelope(password,envelope){
  return deriveVaultKey(password,b64ToBytes(envelope.kdf.salt),envelope.kdf.iterations);
}
function assertState(p){
  if(!p || !Array.isArray(p.accounts) || !Array.isArray(p.txs) ||
     !Array.isArray(p.readings) || !Array.isArray(p.contracts))
    throw new Error('备份内容结构不完整');
  return p;
}
function freshKdf(){
  return {iterations:KDF_ITERATIONS,salt:bytesToB64(randomBytes(16))};
}

async function persistSnapshot(snapshot,key,kdf){
  var env=await encryptTextWithKey(snapshot,key,kdf,'scrooge-vault-local');
  localStorage.setItem(ENC_KEY,JSON.stringify(env));
  vaultEnvelope=env;
  return env;
}
function save(){
  if(!S || !vaultKey || !vaultEnvelope) return Promise.resolve(false);
  var snapshot=JSON.stringify(S), key=vaultKey;
  var kdf={iterations:vaultEnvelope.kdf.iterations,salt:vaultEnvelope.kdf.salt};
  saveQueue=saveQueue.catch(function(){}).then(function(){
    return persistSnapshot(snapshot,key,kdf);
  }).catch(function(e){
    toast('加密保存失败：'+e.message);
    throw e;
  });
  return saveQueue;
}

function hasDeviceUnlock(){
  try{ return !!JSON.parse(localStorage.getItem(DEVICE_KEY)||'null'); }catch(e){ return false; }
}
function showUnlock(){
  var device=hasDeviceUnlock()
    ? '<button class="btn ghost" onclick="unlockWithDevice()">使用 Face ID / 设备解锁</button>' : '';
  lockUi('打开金库','数据已在此设备加密。请输入主密码，或使用已启用的设备认证。',
    passwordInput('unlock_pw','主密码','unlockWithPassword()'),
    device+'<button class="btn" onclick="unlockWithPassword()">用主密码解锁</button>');
  setTimeout(function(){ var e=document.getElementById('unlock_pw'); if(e)e.focus(); },50);

function unlockUi(){
  document.body.classList.remove('locked');
  setLockError('');
  render();
}
async function setupVault(){
  var p=val('setup_pw'), p2=val('setup_pw2');
  if(p.length<8) return setLockError('主密码至少需要 8 位');
  if(p!==p2) return setLockError('两次输入的密码不一致');
  try{
    var kdf=freshKdf();
    vaultKey=await deriveVaultKey(p,b64ToBytes(kdf.salt),kdf.iterations);
    vaultEnvelope={kdf:kdf};
    S=assertState(pendingState||copyState(SEED));
    await persistSnapshot(JSON.stringify(S),vaultKey,kdf);
    localStorage.removeItem(KEY);
    pendingState=null;
    unlockUi();
    toast('金库已加密');
  }catch(e){ setLockError('加密失败：'+e.message); }
}
async function unlockWithPassword(){
  var p=val('unlock_pw');
  if(!p) return setLockError('请输入主密码');
  setLockError('正在解密…');
  try{
    var env=JSON.parse(localStorage.getItem(ENC_KEY));
    var key=await keyForEnvelope(p,env);
    var state=assertState(JSON.parse(await decryptTextWithKey(env,key)));
    vaultEnvelope=env; vaultKey=key; S=Object.assign({},SEED,state);
    unlockUi();
  }catch(e){
    vaultKey=null; S=null;
    setLockError('密码不正确，或加密数据已损坏');
  }
}
async function lockVault(){
  if(!vaultStarted) return;
  try{ await saveQueue; }catch(e){}
  closeSheet();
  vaultKey=null; S=null;
  showUnlock();
}

async function initVault(){
  vaultStarted=true;
  document.body.classList.add('locked');
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) hiddenAt=Date.now();
    else if(hiddenAt && Date.now()-hiddenAt>5*60*1000) lockVault();
  });
  var raw=localStorage.getItem(ENC_KEY);
  if(raw){
    try{
      vaultEnvelope=JSON.parse(raw);
      if(vaultEnvelope.format!=='scrooge-vault-local') throw new Error('格式不符');
      showUnlock();
      return;
    }catch(e){
      lockUi('无法打开金库','本地加密数据格式异常。请从加密备份恢复。','','');
      setLockError(e.message);
      return;
    }
  }
  try{
    var plain=localStorage.getItem(KEY);
    pendingState=plain ? assertState(Object.assign({},SEED,JSON.parse(plain))) : copyState(SEED);
  }catch(e){ pendingState=copyState(SEED); }
  showSetup();
}

async function encryptBackupPayload(state,password){
  var kdf=freshKdf();
  var key=await deriveVaultKey(password,b64ToBytes(kdf.salt),kdf.iterations);
  return encryptTextWithKey(JSON.stringify(state),key,kdf,'scrooge-vault-backup');
}
async function decryptBackupPayload(envelope,password){
  if(envelope.format!=='scrooge-vault-backup') throw new Error('不是金库加密备份');
  var key=await keyForEnvelope(password,envelope);
  return assertState(JSON.parse(await decryptTextWithKey(envelope,key)));
}

var bankImportRows=[];

function parseDelimited(text,delimiter){
  var rows=[], row=[], field='', quoted=false;
  text=String(text||'').replace(/\r\n?/g,'\n');
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(quoted){
      if(c==='"' && text[i+1]==='"'){ field+='"'; i++; }
      else if(c==='"') quoted=false;
      else field+=c;
    }else if(c==='"') quoted=true;
    else if(c===delimiter){ row.push(field); field=''; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
    else field+=c;
  }
  if(field || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){return r.some(function(x){return String(x).trim();});});
}
function normHeader(s){
  return String(s||'').replace(/^\uFEFF/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function findHeaderIndex(rows){
  for(var i=0;i<Math.min(rows.length,40);i++){
    var hs=rows[i].map(normHeader).join('|');
    var hasDate=/(buchung|valuta|wertstellung|datum|date)/.test(hs);
    var hasAmount=/(betrag|umsatz|amount|soll|haben)/.test(hs);
    if(hasDate&&hasAmount) return i;
  }
  return -1;
}
function pickColumn(headers,patterns,excluded){
  for(var i=0;i<headers.length;i++){
    if(excluded&&excluded.indexOf(i)>=0) continue;
    for(var j=0;j<patterns.length;j++) if(patterns[j].test(headers[i])) return i;
  }
  return -1;
}
function parseBankDate(v){
  v=String(v||'').trim();
  var m=v.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  return m?m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0'):'';
}
function parseBankAmount(v){
  var s=String(v==null?'':v).trim(), neg=/^\(.*\)$/.test(s)||/-\s*$/.test(s);
  s=s.replace(/[()€$£¥\s']/g,'').replace(/-$/,'');
  if(s[0]==='-'){ neg=true; s=s.slice(1); }
  if(s[0]==='+') s=s.slice(1);
  var comma=s.lastIndexOf(','), dot=s.lastIndexOf('.');
  if(comma>=0&&dot>=0){
    if(comma>dot) s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(comma>=0) s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,'');
  var n=parseFloat(s);
  return isFinite(n)?(neg?-Math.abs(n):n):NaN;
}
function uniqueText(values){
  var seen={}, out=[];
  values.forEach(function(v){
    v=String(v||'').replace(/\s+/g,' ').trim();
    var k=v.toLowerCase();
    if(v&&!seen[k]){seen[k]=1;out.push(v);}
  });
  return out.join(' · ').slice(0,500);
}
function parseBankMatrix(rows){
  var hi=findHeaderIndex(rows);
  if(hi<0) throw new Error('找不到日期和金额列，请导出 CSV 格式的账单');
  var headers=rows[hi].map(normHeader);
  var dateCol=pickColumn(headers,[/^buchung(stag)?$/,/\bbuchung\b/,/^datum$/,/\bdate\b/,/wertstellung/,/valuta/]);
  var amountCol=pickColumn(headers,[/^betrag$/,/\bbetrag\b/,/^umsatz$/,/\bamount\b/]);
  var debitCol=pickColumn(headers,[/^soll$/,/\bdebit\b/]);
  var creditCol=pickColumn(headers,[/^haben$/,/\bcredit\b/]);
  if(dateCol<0 || (amountCol<0&&debitCol<0&&creditCol<0))
    throw new Error('账单列无法识别');
  var noteCols=[];
  [
    /auftraggeber/,/empfanger/,/begunstigter/,/zahlungspflichtiger/,
    /verwendungszweck/,/buchungstext/,/beschreibung/,/description/,/^name$/
  ].forEach(function(p){
    var idx=pickColumn(headers,[p],noteCols);
    if(idx>=0&&[dateCol,amountCol,debitCol,creditCol].indexOf(idx)<0) noteCols.push(idx);
  });
  var out=[];
  rows.slice(hi+1).forEach(function(r){
    var date=parseBankDate(r[dateCol]);
    var amount=amountCol>=0?parseBankAmount(r[amountCol]):NaN;
    if(!isFinite(amount)){
      var debit=debitCol>=0?parseBankAmount(r[debitCol]):NaN;
      var credit=creditCol>=0?parseBankAmount(r[creditCol]):NaN;
      if(isFinite(credit)&&credit!==0) amount=Math.abs(credit);
      else if(isFinite(debit)&&debit!==0) amount=-Math.abs(debit);
    }
    if(!date||!isFinite(amount)||amount===0) return;
    var note=uniqueText(noteCols.map(function(i){return r[i];}));
    out.push({date:date,amount:amount,note:note||'银行账单导入',selected:true});
  });
  if(!out.length) throw new Error('没有找到可导入的交易');
  return out;
}
function parseBankCsvText(text){
  var semi=parseDelimited(text,';'), comma=parseDelimited(text,',');
  var a=findHeaderIndex(semi), b=findHeaderIndex(comma);
  return parseBankMatrix(a>=0&&(b<0||semi[a].length>=comma[b].length)?semi:comma);
}
function decodeBankFile(buffer){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buffer);}
  catch(e){return new TextDecoder('windows-1252').decode(buffer);}
}
function normalizedNote(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function importSignature(accountId,row){
  return accountId+'|'+row.date+'|'+Number(row.amount).toFixed(2)+'|'+normalizedNote(row.note);
}
function shortHash(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(16).padStart(8,'0');
}
function markBankDuplicates(){
  var accountId=val('bank_acc'), seen={};

    if(t.importRef) seen[t.importRef]=1;
  });
  bankImportRows.forEach(function(r){
    var wasDuplicate=r.duplicate;
    r.signature=importSignature(accountId,r);
    r.importRef='bank-'+shortHash(r.signature);
    r.duplicate=!!(seen[r.signature]||seen[r.importRef]);
    if(r.duplicate) r.selected=false;
    else if(wasDuplicate) r.selected=true;
    seen[r.signature]=1;
  });
}

var tesseractLoader=null, ocrPreviewUrl='';

function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoader) return tesseractLoader;
  tesseractLoader=new Promise(function(resolve,reject){
    var script=document.createElement('script');
    script.src='https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js';
    script.onload=function(){ resolve(window.Tesseract); };
    script.onerror=function(){ reject(new Error('OCR 组件下载失败，请检查网络')); };
    document.head.appendChild(script);
  });
  return tesseractLoader;
}
async function prepareMeterImage(file){
  var source, cleanup=function(){};
  if(window.createImageBitmap) source=await createImageBitmap(file);
  else{
    source=await new Promise(function(resolve,reject){
      var img=new Image(), url=URL.createObjectURL(file);
      cleanup=function(){URL.revokeObjectURL(url);};
      img.onload=function(){resolve(img);}; img.onerror=function(){reject(new Error('无法读取照片'));};
      img.src=url;
    });
  }
  var max=1800, scale=Math.min(1,max/Math.max(source.width,source.height));
  var canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(source.width*scale));
  canvas.height=Math.max(1,Math.round(source.height*scale));
  var ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(source,0,0,canvas.width,canvas.height);
  if(source.close) source.close();
  cleanup();
  var image=ctx.getImageData(0,0,canvas.width,canvas.height), d=image.data;
  for(var i=0;i<d.length;i+=4){
    var gray=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    gray=Math.max(0,Math.min(255,(gray-128)*1.45+128));
    d[i]=d[i+1]=d[i+2]=gray;
  }
  ctx.putImageData(image,0,0);
  return new Promise(function(resolve,reject){
    canvas.toBlob(function(blob){blob?resolve(blob):reject(new Error('无法处理照片'));},'image/jpeg',.9);
  });
}
function meterNumber(token){
  var s=String(token||'').replace(/[Oo]/g,'0').replace(/[^\d.,]/g,'');
  if(!s) return NaN;
  var separators=(s.match(/[.,]/g)||[]).length;
  if(separators){
    var last=Math.max(s.lastIndexOf('.'),s.lastIndexOf(',')), tail=s.length-last-1;
    if(separators===1&&tail>0&&tail<=2)
      s=s.slice(0,last).replace(/[.,]/g,'')+'.'+s.slice(last+1);
    else s=s.replace(/[.,]/g,'');
  }
  var n=parseFloat(s);
  return isFinite(n)?n:NaN;
}
function extractMeterCandidates(text,last){
  var matches=String(text||'').replace(/[Oo]/g,'0').match(/\d[\d\s.,]{2,}\d/g)||[];
  var seen={}, out=[];
  matches.forEach(function(token){
    var n=meterNumber(token), digits=String(token).replace(/\D/g,'').length;
    if(!isFinite(n)||n<0||digits<4||digits>10) return;
    var key=String(n);
    if(seen[key]) return;
    seen[key]=1;
    var score=digits;
    if(isFinite(last)){
      if(n>=last) score+=50;
      var delta=Math.abs(n-last);
      if(delta<10000) score+=20;
      if(delta<2000) score+=20;
      score-=Math.min(20,delta/5000);
    }
    out.push({value:n,raw:token.trim(),score:score});
  });
  return out.sort(function(a,b){return b.score-a.score;});
}
function updateOcrProgress(message,progress){

    '</small></span></div>'+badge(kind==='power'?'电':'气','gold')+'</div>';
  if(li){
    head+=hr()+'<span class="dim">上一期间 '+fmtDate(li.from)+' → '+fmtDate(li.to)+' · '+li.days+' 天</span>'+
      '<div class="stats">'+
      stat('净用量',n2(li.netRaw),unit,null,m.factor!==1?('= '+n0(li.kwh)+' kWh'):'')+
      stat('月均 (30天)',n0(li.avg30),'kWh',null,'日均 '+n2(li.perDay)+' kWh')+
      stat('折算费用',n2(li.cost),'€','gold')+'</div>';
    if(m.monthlyAbschlag>0) head+=row({
      label:'同期预缴 Abschlag（'+n0(m.monthlyAbschlag)+' €/月）',
      sub:li.delta>0?('预计补缴 '+n2(li.delta)+' €'):('预计退款 '+n2(-li.delta)+' €'),
      value:eur(li.abschlag), tone:li.delta>0?'red':'green'});
  }
  out+=card(head,'gold');

  if(per){
    out+=card(h2('本结算年度累计',badge('抄表日 '+m.ableseTermin,'dim'))+
      '<span class="dim">'+fmtDate(per.start)+' → '+fmtDate(per.end)+' · '+per.days+' 天</span>'+
      '<div class="stats">'+stat('累计用量',n0(per.kwh),'kWh')+
      stat('累计费用',n2(per.cost),'€','gold')+stat('月均',n0(per.avg30),'kWh')+'</div>'+hr()+
      '<div class="stats">'+stat('全年推算用量',n0(per.projectedYearKwh),'kWh')+
      stat('全年推算费用',n0(per.projectedYearCost),'€')+
      (m.monthlyAbschlag>0 ? stat(per.delta>0?'预计补缴':'预计退款',
        n2(Math.abs(per.delta)),'€',per.delta>0?'red':'green','已预缴 '+n0(per.abschlagPaid)+' €') : '')+
      '</div><p class="dim" style="margin:0">费用仅按 Arbeitspreis '+n2(m.arbeitspreisCt)+
      ' ct/kWh 折算，未含 Grundpreis / 基础费。</p>');
  }

  if(iv.length){
    out+=card(h2('每期月均消耗 (kWh / 30天)')+barChart(
      iv.map(function(i){return {date:i.to,value:Math.max(0,Math.round(i.avg30))};}),
      function(v){return n0(v)+' kWh';}));
    out+=card(h2('每期费用 (€)')+barChart(
      iv.map(function(i){return {date:i.to,value:Math.round(i.cost)};}),
      function(v){return n0(v)+' €';}, function(){return 'var(--blue)';}));
  }

  var bad=iv.filter(function(i){return i.anomaly;});
  if(bad.length) out+=card(h2('⚠︎ 读数异常')+bad.map(function(a){
    return '<p class="c-red" style="margin:0;font-size:13px">'+fmtDate(a.from)+' → '+fmtDate(a.to)+
      '：读数下降 '+n2(Math.abs(a.netRaw))+' '+unit+'，请核对是否录错或换表。</p>';
  }).join(''),'red');

  var body=h2('抄表记录 ('+rs.length+')',
    '<button class="btn sm ghost" onclick="editTarif()">资费</button>')+
    '<span class="dim">表号 '+esc(m.serial||'—')+(m.reference?(' · 客户号 '+esc(m.reference)):'')+'</span>'+hr();
  if(!rs.length) body+='<p class="empty">还没有抄表记录</p>';
  iv.slice().reverse().forEach(function(i){
    body+=row({label:fmtDate(i.to)+'   '+n2(i.value)+' '+unit,
      sub:'+'+n2(i.netRaw)+' '+unit+' · '+i.days+' 天 · 月均 '+n0(i.avg30)+' kWh · '+n2(i.cost)+' €',
      right:'<button class="btn sm ghost" onclick="delReading(\''+i.readingId+'\')">删</button>'});
  });
  if(rs.length) body+=row({label:fmtDate(rs[0].date)+'   '+n2(rs[0].value)+' '+unit,sub:'基准读数',
    right:'<button class="btn sm ghost" onclick="delReading(\''+rs[0].id+'\')">删</button>'});
  out+=card(body);
  out+=btn('＋ 录入新读数','addReading()');
  return out;
}

function addReading(){

  var m=pickMeter(kind);
  var rs=meterReadings(S.readings,m.id), last=rs[rs.length-1];
  var unit=m.unit==='m3'?'m³':'kWh';
  window._addKind=kind;
  openSheet('录入 · '+m.label,
    (last?card('<span class="dim">上次读数</span><span class="h2 tnum">'+n2(last.value)+' '+unit+
      ' · '+fmtDate(last.date)+'</span>','blue'):'')+
    fileField({id:'rd_photo',label:'拍照识别表盘',accept:'image/*',capture:'environment',
      onchange:'scanMeterPhoto(this)',hint:'照片只在当前设备识别，不会上传。首次使用需要下载 OCR 组件。'})+
    '<div id="ocr_result"></div>'+
    field({id:'rd_date',label:'日期',type:'date',val:today()})+
    field({id:'rd_val',label:'表读数 (Brutto, '+unit+')',type:'number',step:'any',
      inputmode:'decimal',ph:last?('≥ '+n2(last.value)):'例如 12345',oninput:'previewReading()'})+
    field({id:'rd_note',label:'备注（可选）',ph:'例如 年度 Ablesung'})+
    btn('保存','saveReading()'));
}
function previewReading(){
  var m=pickMeter(window._addKind);
  var rs=meterReadings(S.readings,m.id), last=rs[rs.length-1];
  var v=fnum('rd_val'), el=document.getElementById('rd_val_hint');
  if(!el) return;
  if(!last || !isFinite(v)){ el.textContent=''; return; }
  var net=v-last.value, kwh=net*m.factor;
  el.innerHTML='本期净用量 '+n2(net)+' '+(m.unit==='m3'?'m³':'kWh')+
    (m.factor!==1?(' = '+n0(kwh)+' kWh'):'')+' · 约 '+n2(kwh*m.arbeitspreisCt/100)+' €'+
    (net<0?' <span class="c-red">（读数比上次低，请核对）</span>':'');
}
function saveReading(){
  var m=pickMeter(window._addKind);
  var d=val('rd_date'), v=fnum('rd_val');
  if(!isDate(d)) return toast('请选择日期');
  if(!isFinite(v)) return toast('请输入有效的表读数');
  var rs=meterReadings(S.readings,m.id), last=rs[rs.length-1];
  if(last && v<last.value && !confirm('读数 '+n2(v)+' 小于上次的 '+n2(last.value)+'，仍然保存吗？')) return;
  S.readings.push({id:uid(),meterId:m.id,date:d,value:v,note:val('rd_note')});
  save(); closeSheet(); render(); toast('已保存');
}
function delReading(id){
  var r=S.readings.filter(function(x){return x.id===id;})[0];
  if(!r || !confirm('删除 '+fmtDate(r.date)+' 的读数 '+n2(r.value)+'？')) return;
  S.readings=S.readings.filter(function(x){return x.id!==id;});
  save(); render(); toast('已删除');
}
function editTarif(){
  var m=pickMeter(view==='gas'?'gas':'power');

    field({id:'tf_p',label:'Arbeitspreis (ct/kWh)',type:'number',step:'any',inputmode:'decimal',
      val:m.arbeitspreisCt,hint:'用于把用量折算成钱'})+
    field({id:'tf_a',label:'每月预缴 Abschlag (€)',type:'number',step:'any',inputmode:'decimal',
      val:m.monthlyAbschlag,hint:'填 0 表示不预缴，则不显示补缴/退款估算'})+
    (m.unit==='m3'?field({id:'tf_f',label:'m³ → kWh 换算系数',type:'number',step:'any',
      inputmode:'decimal',val:m.factor,hint:'Brennwert × Zustandszahl，账单上可查，Excel 中为 10.7'}):'')+
    field({id:'tf_t',label:'年度抄表日 (MM-DD)',val:m.ableseTermin,hint:'用于划分结算年度'})+
    btn('保存','saveTarif(\''+m.id+'\')'));
}
function saveTarif(id){
  var m=S.meters.filter(function(x){return x.id===id;})[0];
  var p=fnum('tf_p'), a=fnum('tf_a'), f=fnum('tf_f'), t=val('tf_t');
  if(isFinite(p)) m.arbeitspreisCt=p;
  if(isFinite(a)) m.monthlyAbschlag=a;
  if(isFinite(f)&&f>0) m.factor=f;
  if(/^\d{2}-\d{2}$/.test(t)) m.ableseTermin=t;
  save(); closeSheet(); render(); toast('已保存');
}

function setAcc(k){ accSel=k; showAllTx=false; render(); }

function viewSave(){
  var fx=S.fxRmbPerEur, tot=totalEur(S.txs,S.accounts,fx);
  var eurIds=S.accounts.filter(function(a){return a.currency==='EUR';}).map(function(a){return a.id;});
  var ids = accSel==='all' ? eurIds : [accSel];
  var sel = S.accounts.filter(function(a){return a.id===accSel;})[0];
  var out='';

  out+=card('<div class="between"><span class="dim">家庭净资产（折算欧元）</span>'+
    '<button class="badge b-gold" onclick="editFx()">汇率 1€ = '+n2(fx)+' ¥ ✎</button></div>'+
    '<span class="big tnum c-gold">'+n2(tot)+' €</span>'+
    '<span class="dim">≈ '+n0(tot*fx)+' ¥</span>','gold');

  out+=card(h2('账户余额')+S.accounts.map(function(a){
    var b=accountBalance(S.txs,a.id);
    var sub=(a.currency==='RMB'?('≈ '+n2(b/fx)+' €'):'')+(a.note?((a.currency==='RMB'?' · ':'')+a.note):'');
    return row({label:a.name,sub:sub,value:money(b,a.currency),tone:b<0?'red':'',
      onclick:"setAcc('"+a.id+"')"});
  }).join(''));

  out+=chips([{k:'all',label:'欧元合计'}].concat(S.accounts.map(function(a){
    return {k:a.id,label:a.name};})),accSel,'setAcc');

  out+=card(h2('余额走势',badge(accSel==='all'?'EUR 账户合计':(sel?sel.currency:''),'dim'))+
    lineChart(balanceSeries(S.txs,ids)));

  var mn=monthlyNet(S.txs,ids).slice(-18);
  var yr=today().slice(0,4);
  var rel = accSel==='all' ? S.txs.filter(function(t){return eurIds.indexOf(t.accountId)>=0;})
                           : S.txs.filter(function(t){return t.accountId===accSel;});
  var din=rel.filter(function(t){return t.date.slice(0,4)===yr&&t.amount>0;}).reduce(function(s,t){return s+t.amount;},0);
  var dout=rel.filter(function(t){return t.date.slice(0,4)===yr&&t.amount<0;}).reduce(function(s,t){return s+t.amount;},0);
  out+=card(h2('月度净流入')+barChart(mn,n0,function(v){return v<0?'var(--red)':'var(--green)';},3)+hr()+
    '<div class="stats">'+stat(yr+' 存入',n0(din),'','green')+
    stat(yr+' 支出',n0(Math.abs(dout)),'','red')+
    stat('净额',n0(din+dout),'',din+dout>=0?'green':'red')+'</div>');

  var list=rel.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var shown = showAllTx ? list : list.slice(0,25);
  var body=h2('流水',badge(list.length+' 条','dim'));
  body+=shown.map(function(t){
    var a=S.accounts.filter(function(x){return x.id===t.accountId;})[0];
    return row({label:t.note||'（无备注）',sub:fmtDate(t.date)+' · '+a.name,
      value:money(t.amount,a.currency),tone:t.amount<0?'red':'green',
      right:'<button class="btn sm ghost" onclick="delTx(\''+t.id+'\')">删</button>'});
  }).join('');
  if(!list.length) body+='<p class="empty">还没有流水</p>';
  if(list.length>25) body+=btn(showAllTx?'收起':('显示全部 '+list.length+' 条'),'toggleAllTx()','ghost');
  out+=card(body);
  out+='<div class="btnrow">'+btn('＋ 记一笔','addTx()')+
    btn('导入银行账单','openBankImport()','ghost')+'</div>';
  return out;
}

/* ================= 合同与保险 ================= */
var CATS=['车险','房屋险','家财险','责任险','法律险','健康险','税费','能源','通讯','其他'];
var CYCLES=['jährlich','halbjährlich','quartal','monatlich','einmalig'];
function setCat(k){ catSel=k; render(); }

function viewCtr(){
  var list=S.contracts.filter(function(c){return catSel==='all'||c.category===catSel;})
    .map(function(c){return {c:c,st:contractStatus(c)};})
    .sort(function(a,b){
      var r=URG_RANK[a.st.urgency]-URG_RANK[b.st.urgency];
      return r || ((a.st.daysToEnd==null?99999:a.st.daysToEnd)-(b.st.daysToEnd==null?99999:b.st.daysToEnd));
    });
  var yearly=S.contracts.reduce(function(s,c){return s+contractStatus(c).yearlyCost;},0);
  var insY=S.contracts.filter(function(c){return INSURANCE.indexOf(c.category)>=0;})
    .reduce(function(s,c){return s+contractStatus(c).yearlyCost;},0);
  var att=list.filter(function(x){return ['expired','notice','soon'].indexOf(x.st.urgency)>=0;});
  var miss=S.contracts.filter(function(c){return !c.premium||!c.endDate;});
  var out='';

  out+=card('<div class="stats">'+stat('年度保险支出',n0(insY),'€','gold')+
    stat('所有合同年化',n0(yearly),'€',null,S.contracts.length+' 份合同')+
    stat('需要关注',String(att.length),'份',att.length?'red':'green')+'</div>','gold');

  if(att.length) out+=card(h2('⏰ 需要行动')+att.map(function(x){
    return row({label:x.c.name,
      sub:x.st.noticeDeadline?('退保截止 '+fmtDate(x.st.noticeDeadline)+' · 到期 '+fmtDate(x.c.endDate)):
        ('到期 '+fmtDate(x.c.endDate)),
      value:x.st.label,tone:'red',onclick:"editCtr('"+x.c.id+"')"});
  }).join(''),'red');

  out+=btn('📅 导出到 iPhone 日历 (.ics)','exportIcs()');
  out+='<p class="dim" style="margin:-4px 0 0">每份合同生成「退保截止日」（提前 14 天提醒）与「到期日」（提前 7 天提醒）两个全天事件。</p>';

  out+=chips([{k:'all',label:'全部'}].concat(CATS.map(function(c){return {k:c,label:c};})),catSel,'setCat');

  if(!list.length) out+=card('<p class="empty">此分类下没有合同</p>');
  out+=list.map(function(x){
    var c=x.c, st=x.st;
    var prop=S.properties.filter(function(p){return p.id===c.propertyId;})[0];
    var body='<div class="between"><div style="flex:1;min-width:0"><h3 class="h3">'+esc(c.name)+'</h3>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px">'+badge(c.category,'dim')+
      (prop?badge(prop.name,'blue'):'')+(c.tariff?badge(c.tariff,'dim'):'')+'</div></div>'+
      badge(st.label,URG_TONE[st.urgency])+'</div>'+hr()+
      row({label:fmtDate(c.startDate)+' → '+(c.endDate?fmtDate(c.endDate):'无固定到期'),
        sub:CYCLE_ZH[c.cycle]+(c.noticeDays>0?(' · 退保通知期 '+c.noticeDays+' 天'):'')+
          (c.autoRenew?' · 自动续约':''),
        value:c.premium?(n2(c.premium)+' €'):'待补',tone:c.premium?'gold':'dim'});
    if(c.premium && c.cycle!=='jährlich' && c.cycle!=='einmalig')
      body+='<span class="dim">年化 '+eur(st.yearlyCost)+'</span>';
    if(c.notes) body+='<p class="dim" style="margin:0;line-height:1.5">'+esc(c.notes)+'</p>';
    body+=btn('编辑',"editCtr('"+c.id+"')",'ghost sm');
    return card(body);
  }).join('');

  if(miss.length) out+=card(h2('资料待补齐')+miss.map(function(c){
    return row({label:c.name,
      sub:[!c.premium?'缺保费':'',!c.endDate?'缺到期日':''].filter(Boolean).join(' · '),
      onclick:"editCtr('"+c.id+"')"});
  }).join(''),'amber');

  out+=btn('＋ 新增合同','editCtr()');
  return out;
}

      opts:CATS.map(function(k){return {k:k,label:k};})})+
    field({id:'c_prop',label:'关联房产',type:'select',val:c.propertyId||'none',
      opts:[{k:'none',label:'无 / 通用'}].concat(S.properties.map(function(p){
        return {k:p.id,label:p.name};}))})+
    field({id:'c_prov',label:'保险公司 / 服务商',val:c.provider})+
    field({id:'c_tar',label:'Tarif / Stufe',val:c.tariff})+

    field({id:'c_start',label:'生效日',type:'date',val:c.startDate})+

      val:c.noticeDays,hint:'德国常见：车险 30 天、房屋/家财险 90 天'})+
    '<div class="switch"><span>自动续约</span><input type="checkbox" id="c_auto" '+
      (c.autoRenew?'checked':'')+' style="width:auto;transform:scale(1.4)"></div>'+
    field({id:'c_notes',label:'注意事项 / 备注',type:'textarea',val:c.notes,
      ph:'免赔额、理赔电话、保单号、涨价情况…'})+
    btn('保存',"saveCtr('"+(c.id||'')+"')")+
    (id?btn('删除此合同',"delCtr('"+c.id+"')",'danger'):''));
}
function saveCtr(id){
  var name=val('c_name');
  if(!name) return toast('请填写合同名称');
  var st=val('c_start'), en=val('c_end');
  if(!isDate(st)) return toast('请选择生效日');
  if(en && !isDate(en)) return toast('到期日格式不对');
  var prem=fnum('c_prem'), nd=parseInt(val('c_notice'),10);
  var prop=val('c_prop');
  var obj={id:id||uid(),name:name,category:val('c_cat'),
    propertyId:prop==='none'?null:prop, provider:val('c_prov'), tariff:val('c_tar'),
    premium:isFinite(prem)?prem:null, cycle:val('c_cyc'), startDate:st, endDate:en||null,
    autoRenew:document.getElementById('c_auto').checked,
    noticeDays:isFinite(nd)?nd:0, notes:val('c_notes')};
  var i=-1;
  S.contracts.forEach(function(c,k){ if(c.id===id) i=k; });
  if(i>=0) S.contracts[i]=obj; else S.contracts.push(obj);
  save(); closeSheet(); render(); toast('已保存');
}
function delCtr(id){
  var c=S.contracts.filter(function(x){return x.id===id;})[0];
  if(!confirm('删除合同「'+c.name+'」？')) return;
  S.contracts=S.contracts.filter(function(x){return x.id!==id;});
  save(); closeSheet(); render(); toast('已删除');
}

/* ================= 文件导出 ================= */
function saveFile(name,text,mime,utiHint){
  var blob=new Blob([text],{type:mime});
  // iPhone 优先走系统分享面板 —— 可直接选「日历」或存到「文件」
  if(navigator.canShare){
    try{
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).catch(function(){});
        return;
      }
    }catch(e){}
  }
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); },1500);
  toast(utiHint||'已生成 '+name);
}
function exportIcs(){

    '已生成 '+withEnd.length+' 份合同的日历事件');
}

async function readBackupFile(input){
  var f=input.files&&input.files[0];
  if(!f) return;
  try{
    document.getElementById('imp').value=await f.text();
    toast('已读取 '+f.name);
  }catch(e){ toast('无法读取文件：'+e.message); }
}
async function doImport(){
  var t=val('imp');
  if(!t) return toast('请先粘贴备份内容');
  try{
    var p=JSON.parse(t);
    if(p&&p.format==='scrooge-vault-backup'){
      var password=val('imp_pw');
      if(!password) return toast('请输入备份密码');
      p=await decryptBackupPayload(p,password);
    }
    assertState(p);
    S=Object.assign({},SEED,p);
    await save(); closeSheet(); render(); toast('备份已恢复并加密保存');
  }catch(e){ toast('恢复失败：'+e.message); }
}
function doReset(){
  if(!confirm('将丢弃所有新增记录，恢复到从 Excel 导入时的状态。继续？')) return;
  S=JSON.parse(JSON.stringify(SEED)); save(); closeSheet(); render(); toast('已重置');
}
/** 生成不含数据的空壳，用于公开托管 */
function exportShell(){
  var html=document.documentElement.outerHTML;
  var empty='var SEED={version:1,fxRmbPerEur:8,properties:[],meters:[],readings:[],'+
    'accounts:[{id:"a1",name:"储蓄账户",currency:"EUR",note:""}],txs:[],contracts:[],'+
    'budget:{einkommen:0,tilgung:0,autoMonat:0,grundbesitzQuartal:0,wohngebaeudeJahr:0,'+
    'festkosten:[],sparZiel:0}};';
  var i=html.indexOf('var SEED={'), j=html.indexOf('/* ================= 计算引擎');
  if(i<0||j<0||j<i) return toast('无法定位数据段，请手动删除 var SEED');
  var shell=html.slice(0,i)+empty+'\n'+html.slice(j);
  // 去掉运行时注入的内容，保证空壳干净
  shell=shell.replace(/<main id="main">[\s\S]*?<\/main>/,'<main id="main"></main>')
             .replace(/<nav id="nav">[\s\S]*?<\/nav>/,'<nav id="nav"></nav>')
             .replace(/<div class="body" id="sheetBody">[\s\S]*?<\/div>\s*<\/div>/,
                      '<div class="body" id="sheetBody"></div></div>');
  saveFile('金库-空壳版.html','<!DOCTYPE html>\n'+shell,'text/html','空壳版已生成（不含数据）');
}
